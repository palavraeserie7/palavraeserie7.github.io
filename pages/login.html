<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Palavra em Série</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Importante: Esta linha conecta seu login ao Banco de Dados -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="book-card" style="max-width: 400px; margin: 50px auto; text-align: center; padding: 20px;">
            <h2 style="color: white;">Acessar Plataforma</h2>
            <p style="color: rgba(255,255,255,0.7);">Entre para acessar seus estudos exclusivos.</p>
            <br>
            <input type="email" id="email" placeholder="Seu e-mail" style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: none; background: #1a1a1a; color: white;">
            <br>
            <input type="password" id="password" placeholder="Sua senha" style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: none; background: #1a1a1a; color: white;">
            <br>
            <button onclick="fazerLogin()" class="filter-btn pro-btn" style="width: 100%; cursor: pointer;">Entrar</button>
            <div style="margin: 20px 0; color: gray;">ou</div>
            <button onclick="fazerCadastro()" class="filter-btn free-btn" style="width: 100%; cursor: pointer;">Criar Conta Grátis</button>
            <p id="msg" style="margin-top: 15px; font-size: 14px; min-height: 20px;"></p>
        </div>
    </div>

    <!-- Script que fará a mágica acontecer -->
    <script src="../js/services/auth.js"></script>
</body>
</html>
