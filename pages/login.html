<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Palavra em Série</title>

    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/services/supabase.js"></script>

</head>

<body>

    <div class="container">

        <div class="book-card login-card">

            <h1>Palavra em Série</h1>

            <p>Acesso Administrativo</p>

            <input type="email" id="email" placeholder="Seu email">

            <input type="password" id="password" placeholder="Sua senha">

            <button onclick="fazerLogin()" class="btn-liberado">
                Entrar
            </button>

            <button onclick="fazerCadastro()" class="btn-bloqueado">
                Criar Conta
            </button>

            <p id="msg"></p>

        </div>

    </div>

    <script src="../js/services/auth.js"></script>

</body>

</html>
