
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Palavra em Série</title>

    <link rel="stylesheet" href="../css/style.css">

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- CLIENT -->
    <script src="../js/services/supabase.js"></script>

    <style>

        body{
            margin:0;
            padding:0;
            background:#0B1628;
            color:#F8F4EC;
            font-family:Arial, sans-serif;
        }

        .container{
            width:100%;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
            box-sizing:border-box;
        }

        .login-card{
            width:100%;
            max-width:400px;
            background:#111827;
            border:1px solid #1f2937;
            border-radius:16px;
            padding:30px;
            box-sizing:border-box;
            text-align:center;
        }

        h1{
            color:#C9A84C;
            margin-bottom:10px;
        }

        p{
            opacity:0.8;
        }

        input{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            box-sizing:border-box;
            background:#1f2937;
            color:white;
            font-size:16px;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
        }

        .btn-login{
            background:#00cc66;
            color:white;
        }

        .btn-register{
            background:#C9A84C;
            color:#111827;
        }

        #msg{
            margin-top:20px;
            min-height:20px;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="login-card">

            <h1>Palavra em Série</h1>

            <p>Acesso Administrativo</p>

            <input
                type="email"
                id="email"
                placeholder="Seu email"
            >

            <input
                type="password"
                id="password"
                placeholder="Sua senha"
            >

            <button
                onclick="fazerLogin()"
                class="btn-login"
            >
                Entrar
            </button>

            <button
                onclick="fazerCadastro()"
                class="btn-register"
            >
                Criar Conta
            </button>

            <p id="msg"></p>

        </div>

    </div>

    <!-- AUTH -->
    <script src="../js/services/auth.js"></script>

</body>

</html>
