<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
    href="/css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module"
    src="/js/core/orchestrator.js"></script>

</head>
<body>

    <div class="container">

        <div class="book-card login-card">

            <h2>Entrar</h2>

            <input
                type="email"
                id="email"
                placeholder="Seu email"
            >

            <input
                type="password"
                id="password"
                placeholder="Sua senha"
            >

            <button
                class="btn-liberado"
                onclick="fazerLogin()"
            >
                Entrar
            </button>

            <button
                class="btn-bloqueado"
                onclick="fazerCadastro()"
            >
                Criar Conta
            </button>

            <p id="msg"></p>

        </div>

    </div>

    <script type="module"
    src="/js/pages/login.js"></script>

</body>
</html>
