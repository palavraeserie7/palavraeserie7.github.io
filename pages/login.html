
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Palavra & Série</title>
    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div style="text-align:center; margin-bottom:30px;">
            <span style="font-size:3rem;">📚</span>
            <h2 style="margin:10px 0; color:#00cc66;">PALAVRA & SÉRIE</h2>
            <p style="font-size:0.8rem; color:#94a3b8;">Acesse sua inteligência teológica</p>
        </div>
        <div class="form-group">
            <input type="email" id="email" placeholder="Seu E-mail">
        </div>
        <div class="form-group">
            <input type="password" id="password" placeholder="Sua Senha">
        </div>
        <button id="login-btn" onclick="handleLogin( )" class="btn-liberado" style="width:100%;">Entrar</button>
        <p id="message" style="text-align:center; margin-top:20px; font-size:0.9rem;"></p>
    </div>
    <script src="../js/supabase.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
