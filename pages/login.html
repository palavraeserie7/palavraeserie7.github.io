<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>TESTE BOTÃO</title>

</head>

<body style="
background:#0B1628;
color:white;
font-family:Arial;
padding:40px;
">

<h1>TESTE BOTÃO</h1>

CLIQUE TESTE
</button>

.innerText =
"JS EXECUTOU";

}

</script>
