<script type="module">
    import { matrizCompleta } from '../etapas/index.js';

    document.addEventListener("DOMContentLoaded", () => {
        const container = document.querySelector('.container') || document.body;

        const wrapper = document.createElement('div');
        wrapper.style.padding = "20px";
        wrapper.style.color = "#f1f5f9";

        let htmlContent = `
            <div style="margin-bottom:25px; background:#1e293b; padding:20px; border-radius:8px; border:1px solid #334155;">
                <h2 style="color:#22c55e; margin-bottom:10px;">Matriz de Análise Bíblica (12 Etapas)</h2>
                <p style="color:#94a3b8; font-size:14px; margin-bottom:15px;">Digite o termo e consulte individualmente cada etapa:</p>
                <input type="text" id="inputBuscaBiblica" placeholder="Ex: regeneração, fé, aliança..." style="width:100%; padding:12px; background:#0f172a; border:1px solid #475569; color:#fff; border-radius:6px; font-size:16px; margin-bottom:10px;">
                <div id="resultadoBuscaInfo" style="color:#38bdf8; font-size:14px; font-weight:bold;"></div>
            </div>
            <div id="listaEtapasContainer">
        `;

        Object.keys(matrizCompleta).forEach(key => {
            const etapa = matrizCompleta[key];
            const badgePro = etapa.isPro ? '<span style="background:#f59e0b; color:#000; font-size:11px; padding:2px 6px; border-radius:4px; margin-left:8px;">PRO</span>' : '';

            htmlContent += `
                <div class="etapa-card" data-etapa="${etapa.id}" style="background:#1e293b; margin-bottom:12px; border-radius:8px; border:1px solid #334155; overflow:hidden;">
                    <div class="etapa-header" style="padding:15px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:#0f172a;">
                        <h3 style="color:#38bdf8; margin:0; font-size:16px;">${etapa.id} — ${etapa.titulo} ${badgePro}</h3>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <button class="btn-consultar" data-id="${etapa.id}" style="background:#22c55e; color:#000; border:none; padding:6px 12px; font-size:12px; font-weight:bold; border-radius:4px; cursor:pointer;">Consultar Etapa</button>
                            <span style="color:#22c55e; font-weight:bold;">▼</span>
                        </div>
                    </div>
                    <div class="etapa-body" style="padding:0 15px; max-height:0; overflow:hidden; transition:max-height 0.3s ease, padding 0.3s ease;">
                        <div class="etapa-conteudo-dinamico" style="margin:15px 0; line-height:1.6;">
                            <p style="color:#94a3b8; font-style:italic;">Insira um termo acima e clique em consultar para gerar a análise desta etapa.</p>
                        </div>
                    </div>
                </div>
            `;
        });

        htmlContent += `</div>`;
        wrapper.innerHTML = htmlContent;
        container.appendChild(wrapper);

        // Ações de clique individual por botão
        document.querySelectorAll('.btn-consultar').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = btn.getAttribute('data-id');
                const termo = document.getElementById('inputBuscaBiblica').value.trim();
                const etapaObj = matrizCompleta[id];

                if (!termo) {
                    alert("Por favor, digite um termo no campo de busca primeiro.");
                    document.getElementById('inputBuscaBiblica').focus();
                    return;
                }

                // Trava de segurança PRO
                const usuarioEhPro = false; // Altere para true se houver integração de login ativa
                if (etapaObj.isPro && !usuarioEhPro) {
                    alert(`A etapa ${id} é exclusiva para assinantes PRO.`);
                    return;
                }

                const card = document.querySelector(`.etapa-card[data-etapa="${id}"]`);
                const body = card.querySelector('.etapa-body');
                const arrow = card.querySelector('.etapa-header span:last-child');
                const conteudo = card.querySelector('.etapa-conteudo-dinamico');

                // Executa a função nativa do módulo da etapa para gerar o conteúdo
                const resultadoGerado = etapaObj.analisar ? etapaObj.analisar(termo) : "Análise padrão da etapa.";

                conteudo.innerHTML = `
                    <div style="background:#0f172a; padding:12px; border-left:4px solid #22c55e; border-radius:4px; margin-bottom:12px; color:#e2e8f0;">
                        🎯 <strong>Resultado para "${termo}":</strong><br>${resultadoGerado}
                    </div>
                    <p style="color:#94a3b8; font-style:italic; font-size:13px;">Critérios técnicos:</p>
                    <ul style="padding-left:20px; font-size:14px;">
                        ${etapaObj.itens.map(i => `<li>${i}</li>`).join('')}
                    </ul>
                `;

                body.style.maxHeight = body.scrollHeight + 300 + "px";
                body.style.padding = "15px";
                arrow.style.transform = "rotate(180deg)";
                card.style.borderColor = "#22c55e";
            });
        });
    });
</script>
