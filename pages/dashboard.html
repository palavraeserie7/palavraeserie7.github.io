<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Matriz de Análise Bíblica — Pesquisa Profunda</title>
</head>
<body style="background:#0f172a; color:#f1f5f9; font-family:sans-serif; margin:0; padding:20px;">

    <div class="container" style="max-width: 900px; margin: 0 auto;"></div>

    <script>
        const matrizCompleta = {
            "ANL-01": {
                id: "ANL-01",
                titulo: "TEXTO E MANUSCRITOS",
                itens: ["Texto hebraico", "Texto aramaico", "Texto grego", "Manuscritos", "Testemunhos textuais", "Variantes textuais", "Crítica textual", "NA28", "BHS / BHQ", "SBLGNT", "Septuaginta"]
            },
            "ANL-02": {
                id: "ANL-02",
                titulo: "TRADUÇÃO E TEXTO ORIGINAL",
                itens: ["Hebraico", "Aramaico", "Grego", "Septuaginta", "Traduções bíblicas", "Comparação de traduções", "Equivalências de tradução", "Diferenças significativas entre traduções"]
            },
            "ANL-03": {
                id: "ANL-03",
                titulo: "GRAMÁTICA E SINTAXE",
                itens: ["Morfologia", "Gramática hebraica", "Gramática aramaica", "Gramática grega", "Sintaxe hebraica", "Sintaxe grega", "Estrutura das frases", "Verbos", "Tempos e aspectos", "Voz", "Modo", "Relações sintáticas", "Conectivos"]
            },
            "ANL-04": {
                id: "ANL-04",
                titulo: "PALAVRAS E SEMÂNTICA",
                itens: ["Palavras-chave", "Lemas", "Formas lexicais", "Campo semântico", "Sentido contextual", "Uso no AT", "Uso no NT", "BDAG", "HALOT", "BDB", "LSJ"]
            },
            "ANL-05": {
                id: "ANL-05",
                titulo: "SIGNIFICADO TEOLÓGICO",
                itens: ["Desenvolvimento dos conceitos", "Vocabulário teológico", "Uso teológico no AT", "Uso teológico no NT", "Relação com a LXX", "NIDNTTE", "NIDOTTE", "TDNT", "TDOT"]
            },
            "ANL-06": {
                id: "ANL-06",
                titulo: "EXEGESE E CONTEXTO LITERÁRIO",
                itens: ["Contexto imediato", "Contexto da passagem", "Estrutura literária", "Argumento do autor", "Intenção comunicativa", "Gênero literário", "Relação entre versículos", "Exegese versículo a versículo", "Comentários bíblicos", "BECNT", "NIGTC", "NICNT", "Pillar", "WBC", "NICOT", "AOTC", "Baker OT"]
            },
            "ANL-07": {
                id: "ANL-07",
                titulo: "CONTEXTO HISTÓRICO, CULTURAL E RELIGIOSO",
                itens: ["Contexto histórico", "Período histórico", "Cultura", "Costumes", "Sociedade", "Instituições", "Religião", "Práticas religiosas", "Grupos religiosos", "Templos", "Sacerdócio", "Festas", "Crenças", "Zondervan Encyclopedia", "IVP Bible Background Commentary", "New Bible Dictionary", "ANET", "Context of Scripture", "Manners and Customs"]
            },
            "ANL-08": {
                id: "ANL-08",
                titulo: "CONTEXTO GEOGRÁFICO E POLÍTICO",
                itens: ["Localização geográfica", "Cidades", "Regiões", "Territórios", "Fronteiras", "Rotas", "Montanhas", "Rios", "Reinos", "Impérios", "Governantes", "Estruturas políticas", "Guerras", "Conflitos", "Relações de poder", "Arqueologia", "Atlas bíblico", "Zondervan Atlas"]
            },
            "ANL-09": {
                id: "ANL-09",
                titulo: "RELAÇÃO COM O RESTANTE DA ESCRITURA",
                itens: ["Relações AT–NT", "Citações", "Alusões", "Ecos", "Paralelos", "Uso do AT no NT", "LXX e NT", "Relações canônicas", "Desenvolvimento da revelação", "História da redenção", "Beale", "Beale & Carson", "Vos", "Goldsworthy", "Schreiner"]
            },
            "ANL-10": {
                id: "ANL-10",
                titulo: "HERMENÊUTICA E CONTROLE",
                itens: ["Controle interpretativo", "Pressupostos", "Eisegese", "Falácias lexicais", "Descontextualização", "Anacronismo", "Alegorização indevida", "Generalizações", "Descrição × prescrição", "Grant Osborne", "D. A. Carson — Exegetical Fallacies", "Carson & Moo", "Dillard & Longman", "Fee & Stuart"]
            },
            "ANL-11": {
                id: "ANL-11",
                titulo: "TEOLOGIA & COMPARAÇÃO",
                itens: ["Teologia sistemática", "Coerência doutrinária", "Comparação de interpretações", "Concordâncias entre fontes", "Divergências entre fontes", "Argumentos das diferentes interpretações", "Consenso acadêmico", "Posições minoritárias", "Evidências favoráveis e contrárias", "Grudem", "Berkhof", "Frame", "Evangelical Dictionary of Theology", "Comentários bíblicos em comparação"]
            },
            "ANL-12": {
                id: "ANL-12",
                titulo: "SÍNTESE",
                itens: ["Integração das evidências", "Conclusão exegética", "O que o texto afirma", "O que o texto implica", "O que é interpretação", "O que é inferência", "O que é aplicação", "Questões ainda debatidas", "Grau de segurança da conclusão", "Síntese final para geração de conteúdo"]
            }
        };

        document.addEventListener("DOMContentLoaded", () => {
            const container = document.querySelector('.container');
            let htmlContent = `
                <div style="margin-bottom:25px; background:#1e293b; padding:20px; border-radius:8px; border:1px solid #334155;">
                    <h2 style="color:#22c55e; margin-bottom:10px;">Matriz de Análise Bíblica — Pesquisa Exegética Profunda</h2>
                    <p style="color:#94a3b8; font-size:14px; margin-bottom:15px;">Defina o termo e a passagem opcional para investigar cada critério técnico:</p>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <input type="text" id="inputTermo" placeholder="Termo (ex: temor, amor...)" style="flex: 2; padding:12px; background:#0f172a; border:1px solid #475569; color:#fff; border-radius:6px; font-size:15px;">
                        <input type="text" id="inputPassagem" placeholder="Passagem opcional (ex: Gn 28:16-17)" style="flex: 1; padding:12px; background:#0f172a; border:1px solid #475569; color:#fff; border-radius:6px; font-size:15px;">
                    </div>
                </div>
                <div id="listaEtapas">
            `;

            Object.keys(matrizCompleta).forEach(key => {
                const etapa = matrizCompleta[key];
                htmlContent += `
                    <div class="etapa-card" data-etapa="${etapa.id}" style="background:#1e293b; margin-bottom:12px; border-radius:8px; border:1px solid #334155; overflow:hidden;">
                        <div class="etapa-header" style="padding:15px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:#0f172a;">
                            <h3 style="color:#38bdf8; margin:0; font-size:16px;">${etapa.id} — ${etapa.titulo}</h3>
                            <span class="seta-icone" style="color:#22c55e; font-weight:bold; transition:transform 0.3s ease;">▼</span>
                        </div>
                        <div class="etapa-body" style="display:none; padding:15px; border-top:1px solid #334155; background:#1e293b;">
                            <p style="color:#94a3b8; font-size:13px; margin-bottom:10px;">Clique em um critério técnico abaixo para gerar a análise direcionada:</p>
                            <div style="display: flex; flex-direction: column; gap: 6px;">
                                ${etapa.itens.map(item => `
                                    <button class="btn-criterio" data-etapa="${etapa.id}" data-item="${item}" style="background:#0f172a; color:#cbd5e1; border:1px solid #475569; text-align:left; padding:10px; border-radius:5px; cursor:pointer; font-size:14px; transition:all 0.2s;">
                                        🔍 <strong>${item}</strong>
                                    </button>
                                `).join('')}
                            </div>
                            <div class="resultado-criterio" style="margin-top:15px; display:none;"></div>
                        </div>
                    </div>
                `;
            });

            htmlContent += `</div>`;
            container.innerHTML = htmlContent;

            // Comportamento de abrir/fechar o acordeão da etapa
            document.querySelectorAll('.etapa-header').forEach(header => {
                header.addEventListener('click', () => {
                    const card = header.closest('.etapa-card');
                    const body = card.querySelector('.etapa-body');
                    const arrow = card.querySelector('.seta-icone');
                    
                    const isOpen = body.style.display === "block";
                    body.style.display = isOpen ? "none" : "block";
                    arrow.style.transform = isOpen ? "rotate(0deg)" : "rotate(180deg)";
                    card.style.borderColor = isOpen ? "#334155" : "#22c55e";
                });
            });

            // Ação ao clicar em cada critério técnico específico
            document.querySelectorAll('.btn-criterio').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const termo = document.getElementById('inputTermo').value.trim();
                    const passagem = document.getElementById('inputPassagem').value.trim();
                    const etapaId = btn.getAttribute('data-etapa');
                    const criterio = btn.getAttribute('data-item');

                    if (!termo) {
                        alert("Por favor, digite um termo no campo de busca no topo primeiro.");
                        document.getElementById('inputTermo').focus();
                        return;
                    }

                    const card = btn.closest('.etapa-card');
                    const resBox = card.querySelector('.resultado-criterio');

                    // Simulação inteligente e contextualizada baseada na taxonomia e exemplo do usuário
                    let analisePronta = `Análise do critério <strong>"${criterio}"</strong> na etapa <strong>${etapaId}</strong> para o termo <strong>"${termo}"</strong>`;
                    if(passagem) {
                        analisePronta += ` no contexto da passagem <strong>${passagem}</strong>`;
                    }
                    analisePronta += `.`;

                    // Exemplo customizado se o termo for relacionado a temor/respeito
                    if(termo.toLowerCase() === 'temor') {
                        analisePronta += `<br><br>💡 <em>Nota Exegética:</em> No hebraico bíblico, termos ligados ao temor (como <em>yir'ah</em> ou <em>paḥad</em>) em contextos teofânicos frequentemente indicam não um pânico aterrorizante comum, mas um <strong>profundo respeito reverencial, tremor e assombro diante da santidade e majestade divina</strong> (exatamente o impacto registrado na experiência patriarcal).`;
                    } else {
                        analisePronta += `<br><br>💡 <em>Diretriz aplicada:</em> O exame deste critério deve isolar o uso léxico-sintático e o background histórico para evitar anacronismos e garantir rigor exegético.`;
                    }

                    resBox.style.display = "block";
                    resBox.style.background = "#0f172a";
                    resBox.style.padding = "12px";
                    resBox.style.borderLeft = "4px solid #22c55e";
                    resBox.style.borderRadius = "4px";
                    resBox.style.color = "#e2e8f0";
                    resBox.innerHTML = analisePronta;
                });
            });
        });
    </script>
</body>
</html>
