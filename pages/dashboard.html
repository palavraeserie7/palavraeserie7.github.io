<script type="module">
    import { matrizCompleta } from '../etapas/index.js';

    document.addEventListener("DOMContentLoaded", () => {
        const container = document.querySelector('.container') || document.body;

        const wrapper = document.createElement('div');
        wrapper.style.padding = "20px";
        wrapper.style.color = "#f1f5f9";

        let htmlContent = `
            <div style="margin-bottom:25px; background:#1e293b; padding:20px; border-radius:8px; border:1px solid #334155;">
                <h2 style="color:#22c55e; margin-bottom:10px;">Matriz de Análise Bíblica (12 Etapas)</h2>
                <p style="color:#94a3b8; font-size:14px; margin-bottom:15px;">Digite o termo e selecione qual etapa deseja consultar individualmente:</p>
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <input type="text" id="inputBuscaBiblica" placeholder="Ex: regeneração, amor, deus..." style="flex:1; min-width:250px; padding:12px; background:#0f172a; border:1px solid #475569; color:#fff; border-radius:6px; font-size:16px;">
                </div>
                <div id="resultadoBuscaInfo" style="margin-top:12px; color:#38bdf8; font-size:14px; font-weight:bold;"></div>
            </div>
            <div id="listaEtapasContainer">
        `;

        // Defina aqui quais etapas são PRO (exemplo: ANL-11 e ANL-12 bloqueadas)
        const etapasProConfig = {
            "ANL-11": false,
            "ANL-12": true // Exemplo de etapa restrita
        };

        Object.keys(matrizCompleta).forEach(key => {
            const etapa = matrizCompleta[key];
            const isPro = etapasProConfig[etapa.id] || false;

            htmlContent += `
                <div class="etapa-card" data-etapa="${etapa.id}" style="background:#1e293b; margin-bottom:12px; border-radius:8px; border:1px solid #334155; overflow:hidden;">
                    <div class="etapa-header" style="padding:15px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:#0f172a;">
                        <h3 style="color:#38bdf8; margin:0; font-size:16px;">
                            ${etapa.id} — ${etapa.titulo} 
                            ${isPro ? '<span style="background:#f59e0b; color:#000; font-size:11px; padding:2px 6px; border-radius:4px; margin-left:8px; vertical-align:middle;">PRO</span>' : ''}
                        </h3>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <button class="btn-consultar-etapa" data-etapa-id="${etapa.id}" style="background:#22c55e; color:#000; border:none; padding:6px 12px; font-size:12px; font-weight:bold; border-radius:4px; cursor:pointer;">Consultar Etapa</button>
                            <span style="color:#22c55e; font-weight:bold;">▼</span>
                        </div>
                    </div>
                    <div class="etapa-body" style="padding:0 15px; max-height:0; overflow:hidden; transition:max-height 0.3s ease, padding 0.3s ease;">
                        <div class="etapa-conteudo-dinamico" style="margin:15px 0; line-height:1.6;">
                            <p style="color:#94a3b8; font-style:italic; margin-bottom:10px;">Critérios base da etapa:</p>
                            <ul style="margin-bottom:15px; padding-left:20px;">
                                ${etapa.itens.map(item => `<li>${item}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        });

        htmlContent += `</div>`;
        wrapper.innerHTML = htmlContent;
        container.appendChild(wrapper);

        // Comportamento de sanfona ao clicar no cabeçalho
        document.querySelectorAll('.etapa-header').forEach(header => {
            header.addEventListener('click', (e) => {
                // Evita abrir se o clique foi diretamente no botão de consulta
                if(e.target.classList.contains('btn-consultar-etapa')) return;

                const body = header.nextElementSibling;
                const arrow = header.querySelector('span:last-child');
                if (body.style.maxHeight && body.style.maxHeight !== "0px") {
                    body.style.maxHeight = "0px";
                    body.style.padding = "0 15px";
                    arrow.style.transform = "rotate(0deg)";
                } else {
                    body.style.maxHeight = body.scrollHeight + 300 + "px";
                    body.style.padding = "15px";
                    arrow.style.transform = "rotate(180deg)";
                }
            });
        });

        // Consulta manual e individual por botão de cada etapa
        document.querySelectorAll('.btn-consultar-etapa').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation(); // Impede fechar/abrir a sanfona indesejadamente
                const etapaId = btn.getAttribute('data-etapa-id');
                const termoBruto = document.getElementById('inputBuscaBiblica').value.trim();
                const info = document.getElementById('resultadoBuscaInfo');
                const isPro = etapasProConfig[etapaId] || false;

                if(!termoBruto) {
                    info.innerHTML = `⚠️ Digite um termo no campo acima antes de consultar a etapa ${etapaId}.`;
                    document.getElementById('inputBuscaBiblica').focus();
                    return;
                }

                // SIMulação de verificação de permissão PRO (aqui você pode integrar com seu sistema de login/Supabase/Kiwify)
                const usuarioLogadoEhPro = false; // Mude para true se o usuário tiver acesso

                if (isPro && !usuarioLogadoEhPro) {
                    alert(`🔒 A etapa ${etapaId} é exclusiva para assinantes PRO. Faça login para desbloquear.`);
                    return;
                }

                const termo = termoBruto.toLowerCase();
                const card = document.querySelector(`.etapa-card[data-etapa="${etapaId}"]`);
                const body = card.querySelector('.etapa-body');
                const arrow = card.querySelector('.etapa-header span:last-child');
                const conteudoDinamico = card.querySelector('.etapa-conteudo-dinamico');

                let analiseGerada = `Investigação pontual para o termo <strong>"${termoBruto}"</strong> na etapa ${etapaId}.`;

                if (termo.includes("deus")) {
                    const mapDeus = {
                        "ANL-01": "Análise Textual de Deus: *Elohim* e *Theos* nos originais.",
                        "ANL-02": "Tradução de Deus: Sentido singular qualitativo preservado.",
                        "ANL-03": "Gramática de Deus: Substantivo plural com verbos no singular.",
                        "ANL-04": "Semântica de Deus: O Criador supremo e soberano.",
                        "ANL-05": "Teologia de Deus: Auto-existente e transcendente.",
                        "ANL-06": "Contexto Literário de Deus: Origem de todas as coisas.",
                        "ANL-07": "Contexto Histórico de Deus: Ruptura com o politeísmo.",
                        "ANL-08": "Contexto Geográfico de Deus: Domínio universal sobre panteões locais.",
                        "ANL-09": "Escritura e Deus: Revelação progressiva culminando em Cristo.",
                        "ANL-10": "Hermenêutica de Deus: Controle contra antropomorfismos literais.",
                        "ANL-11": "Sistemática de Deus: Atributos comunicáveis e incomunicáveis.",
                        "ANL-12": "<strong>Conclusão Exegética:</strong> Deus é a Realidade pessoal e central da história."
                    };
                    analiseGerada = mapDeus[etapaId] || analiseGerada;
                } else if (termo.includes("regeneração") || termo.includes("amor")) {
                    analiseGerada = `<strong>Conclusão analítica (${etapaId})</strong> para o conceito pesquisado: O termo exibe profundas raízes exegéticas alinhadas aos critérios desta seção específica.`;
                }

                conteudoDinamico.innerHTML = `
                    <div style="background:#0f172a; padding:15px; border-left:4px solid #22c55e; border-radius:6px; margin-bottom:15px; color:#e2e8f0; font-size:15px;">
                        🎯 <strong>Consulta Individual (${etapaId}):</strong> ${analiseGerada}
                    </div>
                    <p style="color:#94a3b8; font-style:italic; margin-bottom:5px; font-size:13px;">Critérios de suporte técnico:</p>
                    <ul style="margin-bottom:10px; padding-left:20px; font-size:14px;">
                        ${matrizCompleta[etapaId].itens.map(item => `<li>${item}</li>`).join('')}
                    </ul>
                `;

                // Abre automaticamente apenas esta caixa consultada
                body.style.maxHeight = body.scrollHeight + 300 + "px";
                body.style.padding = "15px";
                arrow.style.transform = "rotate(180deg)";
                card.style.borderColor = "#22c55e";

                info.innerHTML = `✅ Etapa <strong>${etapaId}</strong> consultada individualmente para o termo "${termoBruto}".`;
            });
        });
    });
</script>
