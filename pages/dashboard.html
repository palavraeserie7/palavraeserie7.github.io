<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Palavra em Série</title>
    <!-- Caminho corrigido para a pasta assets conforme sua estrutura -->
    <link rel="stylesheet" href="../assets/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/services/supabase.js"></script>
</head>
<body>
    <header style="padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #1a1a1a;">
        <h3 style="color: #00ff88; margin: 0;">Palavra em Série</h3>
        <button onclick="supabaseClient.auth.signOut().then(() => window.location.href='login.html')" 
                style="background: #ff4444; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">
            Sair
        </button>
    </header>

    <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
        <!-- Card de Boas-vindas e Plano -->
        <div style="margin: 30px 0; padding: 25px; background: #1a1a1a; border-radius: 12px; border-left: 5px solid #00ff88;">
            <h2 id="welcome-msg" style="color: white; margin-bottom: 5px;">Carregando...</h2>
            <p id="user-plan" style="color: #888; font-weight: bold; text-transform: uppercase;">Verificando plano ministerial...</p>
        </div>

        <!-- Container onde os livros serão injetados pelo orchestrator.js -->
        <section id="books-container" class="books-grid">
            <!-- Os livros aparecerão aqui automaticamente -->
        </section>
    </div>

    <!-- Scripts de controle e permissão -->
    <script src="../permissions.js"></script>
    <script src="../js/core/orchestrator.js"></script>
</body>
</html>
