<script type="module">
    import { matrizCompleta } from '../etapas/index.js';

    document.addEventListener("DOMContentLoaded", () => {
        const container = document.querySelector('.container') || document.body;

        const wrapper = document.createElement('div');
        wrapper.style.padding = "20px";
        wrapper.style.color = "#f1f5f9";

        let htmlContent = `
            <div style="margin-bottom:25px; background:#1e293b; padding:20px; border-radius:8px; border:1px solid #334155;">
                <h2 style="color:#22c55e; margin-bottom:10px;">Matriz de Análise Bíblica (12 Etapas)</h2>
                <p style="color:#94a3b8; font-size:14px; margin-bottom:15px;">Digite o texto ou tema que deseja investigar (ex: João 1:1, fé, regeneração):</p>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="inputBuscaBiblica" placeholder="Digite o tema ou passagem..." style="flex:1; padding:12px; background:#0f172a; border:1px solid #475569; color:#fff; border-radius:6px; font-size:16px;">
                    <button id="btnExecutarBusca" style="background:#22c55e; color:#000; border:none; padding:0 20px; font-weight:bold; border-radius:6px; cursor:pointer;">Ativar Matriz</button>
                </div>
                <div id="resultadoBuscaInfo" style="margin-top:12px; color:#38bdf8; font-size:14px; font-weight:bold;"></div>
            </div>
            <div id="listaEtapasContainer">
        `;

        Object.keys(matrizCompleta).forEach(key => {
            const etapa = matrizCompleta[key];
            htmlContent += `
                <div class="etapa-card" data-etapa="${etapa.id}" style="background:#1e293b; margin-bottom:12px; border-radius:8px; border:1px solid #334155; overflow:hidden;">
                    <div class="etapa-header" style="padding:15px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; background:#0f172a;">
                        <h3 style="color:#38bdf8; margin:0; font-size:16px;">${etapa.id} — ${etapa.titulo}</h3>
                        <span style="color:#22c55e; font-weight:bold;">▼</span>
                    </div>
                    <div class="etapa-body" style="padding:0 15px; max-height:0; overflow:hidden; transition:max-height 0.3s ease, padding 0.3s ease;">
                        <ul style="margin:15px 0; line-height:1.6; padding-left:20px;">
                            ${etapa.itens.map(item => `<li class="item-analise">${item}</li>`).join('')}
                        </ul>
                    </div>
                </div>
            `;
        });

        htmlContent += `</div>`;
        wrapper.innerHTML = htmlContent;
        container.appendChild(wrapper);

        // Comportamento de clique (sanfona)
        document.querySelectorAll('.etapa-header').forEach(header => {
            header.addEventListener('click', () => {
                const body = header.nextElementSibling;
                const arrow = header.querySelector('span');
                if (body.style.maxHeight && body.style.maxHeight !== "0px") {
                    body.style.maxHeight = "0px";
                    body.style.padding = "0 15px";
                    arrow.style.transform = "rotate(0deg)";
                } else {
                    body.style.maxHeight = body.scrollHeight + 50 + "px";
                    body.style.padding = "15px";
                    arrow.style.transform = "rotate(180deg)";
                }
            });
        });

        // Função que ativa o direcionamento da matriz com base no tema digitado
        document.getElementById('btnExecutarBusca').addEventListener('click', () => {
            const termo = document.getElementById('inputBuscaBiblica').value.trim();
            const info = document.getElementById('resultadoBuscaInfo');
            
            if(!termo) {
                info.innerHTML = `⚠️ Digite um texto ou tema para iniciar a análise.`;
                return;
            }

            // Abre todas as etapas para o estudo completo do tema inserido
            document.querySelectorAll('.etapa-card').forEach(card => {
                const body = card.querySelector('.etapa-body');
                const arrow = card.querySelector('.etapa-header span');
                body.style.maxHeight = body.scrollHeight + 100 + "px";
                body.style.padding = "15px";
                arrow.style.transform = "rotate(180deg)";
                card.style.borderColor = "#22c55e";
            });

            info.innerHTML = `🎯 Matriz ativada para o estudo de: "<span style="color:#22c55e;">${termo}</span>". Utilize os critérios abaixo para a exegese completa.`;
        });
    });
</script>
