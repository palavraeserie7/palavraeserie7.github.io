<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estante - Ecossistema Palavra & Série</title>
    <link rel="stylesheet" href="../style.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-layout">
    <nav class="sidebar">
        <div class="sidebar-header">
            <span style="font-size: 1.8rem;">📚</span>
            <div class="logo-text">
                <span style="font-weight: 800; font-size: 0.9rem; display: block;">PALAVRA & SÉRIE</span>
                <span style="font-size: 0.65rem; color: #00cc66; font-weight: bold;">SEMENTE DO CORAÇÃO</span>
            </div>
        </div>
        <ul class="nav-links">
            <li class="nav-item active" onclick="switchTab('home' )"><i class="fas fa-home"></i> <span>Início</span></li>
            
            <li class="nav-section">BIBLIOTECA AVANÇADA</li>
            <li class="nav-item" onclick="switchTab('biblioteca')"><i class="fas fa-layer-group"></i> <span>As 9 Camadas</span></li>
            <li class="nav-item" onclick="switchTab('fluxo')"><i class="fas fa-stream"></i> <span>Fluxo de Estudo</span></li>
            
            <li class="nav-section">ESTANTE</li>
            <li class="nav-item" onclick="switchTab('all')"><i class="fas fa-book-open"></i> <span>Livros e Séries</span></li>
            
            <li class="nav-section">CONTA</li>
            <li class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></li>
        </ul>
    </nav>
    <main class="main-content">
        <header class="top-bar">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="global-search" placeholder="Buscar recurso teológico..." onkeyup="handleGlobalSearch()">
            </div>
            <div id="user-email" style="font-size: 0.85rem; opacity: 0.7;"></div>
        </header>
        <div class="content-body">
            <!-- VISÃO INICIAL -->
            <div id="home-view">
                <h1 id="page-title">Bem-vindo à sua Jornada</h1>
                <div id="books-free" class="books-grid"></div>
                <div id="books-pro" class="books-grid" style="margin-top:40px;"></div>
            </div>

            <!-- VISÃO DAS 9 CAMADAS -->
            <div id="biblioteca-view" style="display:none;">
                <h1>Biblioteca Bíblica Avançada</h1>
                <div id="camadas-container"></div>
            </div>

            <!-- VISÃO DO FLUXO -->
            <div id="fluxo-view" style="display:none;">
                <h1>Fluxo de Estudo de 7 Camadas</h1>
                <div id="fluxo-container" class="fluxo-box"></div>
            </div>
        </div>
    </main>
    
    <script src="../js/supabase.js"></script>
    <script src="../js/core/orchestrator.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
