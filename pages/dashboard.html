<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecossistema Palavra & Série</title>
    <!-- Link para forçar o carregamento do visual -->
    <link rel="stylesheet" href="../style.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-layout">
    <nav class="sidebar">
        <div class="sidebar-header">
            <span style="font-size: 1.8rem;">📚</span>
            <div class="logo-text">
                <span class="brand-main">PALAVRA & SÉRIE</span>
                <span class="brand-sub">SEMENTE DO CORAÇÃO</span>
            </div>
        </div>
        <ul class="nav-links">
            <li class="nav-item active" onclick="switchTab('home' )"><i class="fas fa-home"></i> <span>Início</span></li>
            <li class="nav-section">PALAVRA & SÉRIE</li>
            <li class="nav-item" onclick="switchTab('estudos')"><i class="fas fa-bible"></i> <span>Temas Bíblicos</span></li>
            <li class="nav-section">SEMENTE DO CORAÇÃO</li>
            <li class="nav-item" onclick="switchTab('biblioteca')"><i class="fas fa-book-open"></i> <span>Biblioteca</span></li>
        </ul>
        <div class="sidebar-footer">
            <button class="btn-sair-sidebar" onclick="logout()" style="background:#ef4444; color:white; border:none; width:100%; padding:10px; border-radius:8px; cursor:pointer;">Sair</button>
        </div>
    </nav>

    <main class="main-content">
        <header class="top-bar">
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" id="theme-search" placeholder="Consultar tema..." onkeyup="searchTheme()">
            </div>
            <div id="user-email" style="font-size: 0.9rem; opacity: 0.7;"></div>
        </header>
        <div class="content-body">
            <section class="spiritual-status dashboard-box">
                <h3><i class="fas fa-seedling"></i> Estado Espiritual (E08)</h3>
                <div class="status-grid">
                    <div class="status-card"><span class="label">Nível</span><span class="value" id="user-level">N1</span></div>
                    <div class="status-card"><span class="label">Fé</span><span class="value" id="stat-faith">0%</span></div>
                    <div class="status-card"><span class="label">Oração</span><span class="value" id="stat-prayer">0%</span></div>
                </div>
            </section>
            <div class="shelf" style="margin-top:40px;">
                <h2>Biblioteca Aberta (FREE)</h2>
                <div id="books-free" class="books-grid"></div>
            </div>
            <div class="shelf" style="margin-top:40px;">
                <h2 style="color:#C9A84C;">Acesso Profundo (PRO)</h2>
                <div id="books-pro" class="books-grid"></div>
            </div>
        </div>
    </main>

    <script src="../js/supabase.js"></script>
    <script src="../js/core/orchestrator.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
