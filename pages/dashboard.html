<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet"
    href="../css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script type="module"
    src="../js/core/orchestrator.js"></script>

</head>

<body>

    <header class="header">

        <h2>📚 Palavra em Série</h2>

        <button
            class="btn-sair"
            onclick="supabaseClient.auth.signOut().then(() => window.location.replace('./login.html'))"
        >
            Sair
        </button>

    </header>

    <div class="container">

        <div class="dashboard-box">

            <h2 id="welcome-msg">
                Carregando...
            </h2>

            <p id="user-plan">
                Carregando plano...
            </p>

        </div>

        <section
            id="books-container"
            class="books-grid">
        </section>

    </div>

    <script type="module"
    src="../js/pages/dashboard.js"></script>

</body>
</html>
