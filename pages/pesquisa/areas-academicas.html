    const breadcrumb = p.slice(1).map(esc).join(' / ');
    const contextLabel = esc(p.join(' / '));
    main.innerHTML = `<div class="academic-study-workspace"><section class="academic-study-panel academic-study-chat" aria-label="Chat e pesquisa acadêmica"><header class="academic-study-header"><button class="back-arrow" type="button" onclick="window.PalavraAcademicAreaModule.showTree()" title="Voltar para as áreas académicas">← VOLTAR</button><div class="academic-study-kicker">${area}</div><h1>${topic}</h1><p class="academic-study-breadcrumb">${breadcrumb || topic}</p><p class="academic-study-context">O chat está contextualizado automaticamente em: <strong>${contextLabel}</strong></p>${methodPanel(p)}</header><div class="academic-study-messages" id="academic-study-messages"><div class="academic-study-message system">Faça perguntas sobre o tema selecionado. As respostas desta pesquisa ficam neste painel e não alteram a árvore acadêmica nem a MATRIZ PRO.</div></div><form class="academic-study-form" onsubmit="return window.PalavraAcademicAreaModule.submitQuestion(event)"><label for="academic-study-question">PERGUNTA / PESQUISA</label><div class="academic-study-question-row"><input id="academic-study-question" type="text" autocomplete="off" placeholder="Pergunte sobre ${topic}..." required><button type="submit" id="academic-study-submit">PESQUISAR</button></div><div id="academic-study-status" class="academic-study-status" aria-live="polite"></div></form></section><aside class="academic-study-panel academic-study-notes" aria-label="Minhas anotações"><header class="academic-study-notes-header"><div class="academic-study-kicker">REGISTRO PESSOAL</div><h2>MINHAS ANOTAÇÕES</h2><p>Escreva e guarde as suas observações independentemente do chat.</p></header><textarea id="academic-study-notes-input" aria-label="Minhas anotações" placeholder="Escreva aqui as suas anotações sobre este tema..." oninput="scheduleAcademicNotesSave()"></textarea><div class="academic-study-notes-actions"><span id="academic-study-notes-status" aria-live="polite">As anotações são separadas da pesquisa.</span><button type="button" onclick="saveAcademicNotes()">GUARDAR ANOTAÇÕES</button></div></aside></div>`;
    window.activeAcademicNotesKey = `palavra-serie-academic-notes:${JSON.stringify(p)}`;
    if (typeof window.loadAcademicNotes === 'function') window.loadAcademicNotes();
    return true;
  }
  function selectOperation(selection) {
    if (!selection) return;
    const command = operationSelection(selection.module, selection.item);
    const fullSelection = {...selection, prompt: selection.prompt || command.prompt || ''};
    if (typeof window.applyAcademicPrompt === 'function') return window.applyAcademicPrompt(fullSelection);
    window.activeAcademicStagePrompt = fullSelection;
    window.activeResearchContext = {...(window.activeResearchContext || {}), ...contextFor(window.activeResearchContext?.path || [], fullSelection)};
    const input = document.getElementById('academic-study-question');
    if (input) { input.value = `${fullSelection.item}: `; input.focus(); }
  }
  function submitQuestion(event) {
    if (typeof window.submitAcademicStudyQuestion === 'function') return window.submitAcademicStudyQuestion(event);
    event?.preventDefault();
    const status = document.getElementById('academic-study-status');
    if (status) { status.textContent = 'O serviço de pesquisa académica não está disponível nesta abertura independente.'; status.className = 'academic-study-status error'; }
    return false;
  }
  window.PalavraAcademicAreaModule = {id: moduleId, tree: TREE, showTree, openStudy, selectOperation, submitQuestion};
  window.PalavraMenuRuntime = window.PalavraMenuRuntime || {};
  window.PalavraMenuRuntime[moduleId] = { mount() { return window.PalavraAcademicAreaModule.showTree(); } };
})();</script>
</body>
</html>
