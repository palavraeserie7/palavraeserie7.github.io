<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz de Análise Bíblica — Palavra & Série</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0b1428; color: #dbe7f5; font-family: 'Segoe UI', sans-serif; }
        .app { width: min(1200px, 94%); margin: 35px auto 70px; }
        .header { background: #18243a; border: 1px solid #263754; border-radius: 12px; padding: 28px; margin-bottom: 20px; }
        .header h1 { margin: 0 0 8px; color: #20d66b; font-size: 25px; }
        .search-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; }
        input { width: 100%; background: #0d172b; border: 1px solid #30415f; color: white; padding: 13px; border-radius: 6px; outline: none; }
        input:focus { border-color: #20d66b; }
        button { border: 0; border-radius: 6px; padding: 13px 24px; cursor: pointer; font-weight: bold; background: #20c96b; color: #06130b; transition: 0.3s; }
        button:hover { background: #27e57a; }
        .secao { background: #17243a; border: 1px solid #263754; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .titulo-secao { color: #18bfff; font-weight: bold; margin-bottom: 15px; font-size: 0.9rem; }
        .diagnostico-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .diag-item { background: #0d172b; border: 1px solid #263754; border-radius: 6px; padding: 12px; text-align: center; }
        .diag-item small { display: block; color: #778ba5; font-size: 0.7rem; margin-bottom: 4px; }
        .diag-item strong { color: #dce8f7; font-size: 0.85rem; }
        .module { background: #0d172b; border: 1px solid #253650; border-radius: 7px; margin-bottom: 9px; overflow: hidden; }
        .module-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .module-title { color: #18bfff; font-weight: bold; font-size: 14px; }
        .module-status { font-size: 10px; padding: 4px 8px; border-radius: 4px; border: 1px solid #20d66b; color: #20d66b; }
        .module-body { display: none; border-top: 1px solid #253650; padding: 18px; line-height: 1.6; }
        .module.open .module-body { display: block; }
        .research-box { background: #0a1426; border-left: 4px solid #20d66b; padding: 25px; margin-top: 15px; line-height: 1.8; font-size: 1.1rem; }
        .loading { color: #20d66b; text-align: center; padding: 20px; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>Pesquisa Bíblica — Motor de Investigação</h1>
        <div class="search-grid">
            <input id="tema-input" type="text" placeholder="Tema — ex.: Santidade">
            <input id="passagem-input" type="text" placeholder="Passagem — ex.: 1 Pedro 1:15">
            <button onclick="INICIAR_MATRIZ()">ANALISAR</button>
        </div>
    </div>

    <div class="secao">
        <div class="titulo-secao">ANL-00 — DIAGNÓSTICO E ROTEAMENTO</div>
        <div id="diagnostico-area" class="diagnostico-grid">
            <div style="color:#71849c; padding:10px;">Aguardando entrada...</div>
        </div>
    </div>

    <div class="secao">
        <div class="titulo-secao">MÓDULOS DE INVESTIGAÇÃO (12 ETAPAS)</div>
        <div id="modules-container">
            <div style="color:#71849c; padding:10px;">Defina um tema para iniciar a investigação.</div>
        </div>
    </div>

    <div id="resultado-area" class="research-box" style="display:none;"></div>
</div>

<script>
    const FONTES = [
        "NA28/BHS (Texto)", "Metzger (Crítica)", "Wallace (Gramática)", "BDAG/HALOT (Léxico)",
        "TDNT/TDOT (Teologia)", "BECNT/NICNT (Contexto)", "IVP (História)", "Beale (Cânon)",
        "Osborne (Hermenêutica)", "Grudem (Sistemática)", "Consenso Acadêmico", "Síntese Final"
    ];

    const RESPOSTAS_LOCAIS = {
        "DEUS": "Análise sobre THEOS/ELOHIM. Revela a natureza absoluta da divindade.",
        "SANTIDADE": "Investigação sobre QADOSH. Separação pactual para o serviço divino.",
        "GRAÇA": "O favor imerecido (CHARIS). Energia salvífica que restaura o homem."
    };

    async function INICIAR_MATRIZ() {
        const tema = document.getElementById('tema-input').value.trim();
        if (!tema) return alert("Informe um tema.");

        const diag = document.getElementById('diagnostico-area');
        const container = document.getElementById('modules-container');
        const resArea = document.getElementById('resultado-area');

        diag.innerHTML = '<div class="loading">Roteando fontes...</div>';
        container.innerHTML = "";
        resArea.style.display = 'none';

        let contextoAcumulado = "";
        const termoBusca = tema.toUpperCase();

        for (let i = 0; i < FONTES.length; i++) {
            const moduloId = "ANL-" + (i + 1).toString().padStart(2, '0');
            const div = document.createElement('div');
            div.className = "module open";
            div.innerHTML = `<div class="module-header"><span class="module-title">${moduloId} — ${FONTES[i]}</span><span class="module-status">COMPLETED</span></div><div class="module-body">Analisando...</div>`;
            container.appendChild(div);

            await new Promise(r => setTimeout(r, 300));
            const resposta = RESPOSTAS_LOCAIS[termoBusca] || `Análise técnica de "${tema}" via ${FONTES[i]}.`;
            div.querySelector('.module-body').innerHTML = `<div>${resposta}</div>`;
            contextoAcumulado += `\n[${moduloId}]: ${resposta}\n`;
        }

        diag.innerHTML = `<div class="diag-item"><small>STATUS</small><strong style="color:#20d66b;">APROVADO</strong></div>`;
        resArea.innerHTML = `<h2>Dossiê Consolidado: ${tema}</h2><div style="white-space:pre-wrap;">${contextoAcumulado}</div>`;
        resArea.style.display = 'block';
    }
</script>
</body>
</html>
