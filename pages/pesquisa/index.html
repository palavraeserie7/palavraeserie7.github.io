<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra & Série — Matriz Canônica</title>
    <style>
        :root { --primary: #20d66b; --bg: #0b1428; --sidebar-bg: #111b30; --card: #17243a; --input: #0d172b; --text: #dbe7f5; --border: #263754; --accent: #18bfff; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .module-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; margin: 0; }
        .module-item { padding: 10px; margin-bottom: 5px; border-radius: 4px; font-size: 12px; cursor: pointer; color: #91a4bd; }
        .module-item:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .module-item.active { background: var(--primary); color: #000; font-weight: bold; }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top { padding: 15px 30px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); font-size: 12px; font-weight: bold; color: var(--accent); }
        .content { flex: 1; overflow-y: auto; padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .search-box { background: var(--card); padding: 30px; border-radius: 12px; max-width: 600px; margin: 0 auto; text-align: center; }
        input { width: 70%; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--input); color: white; }
        button { padding: 12px 20px; border-radius: 6px; border: none; background: var(--primary); color: #000; font-weight: bold; cursor: pointer; }
        .result { margin-top: 30px; background: #fdfcf0; color: #1a202c; padding: 30px; border-radius: 4px; border-left: 10px solid var(--primary); font-family: serif; display: none; text-align: left; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header"><h2 style="color:var(--primary);margin:0;font-size:16px;">MATRIZ CANÔNICA</h2></div>
    <ul id="list" class="module-list"></ul>
</div>
<div class="main">
    <div id="path" class="top">SELECIONE UMA DISCIPLINA</div>
    <div id="view" class="content">
        <div style="text-align:center;margin-top:100px;opacity:0.3;"><h1>&</h1><p>Escolha uma disciplina no menu lateral.</p></div>
    </div>
</div>
<script>
    const DISCIPLINAS = ["00 AS DICIPLINAS DA TEOLOGIA", "1 FUNDAÇÃO BÍBLICA", "2 ESTUDOS BÍBLICOS CANÔNICOS", "3 TEOLOGIA BÍBLICA", "4 TEOLOGIA SISTEMÁTICA", "5 HISTÓRIA DA IGREJA", "6 VIDA CRISTÃ", "7 ACONSELHAMENTO PASTORAL", "8 APOLOGÉTICA", "9 MISSÕES / CULTURA / SOCIEDADE", "10 ÉTICA CRISTÃ", "11 LIDERANÇA E MINISTÉRIO", "12 PREGAÇÃO E ENSINO", "13 ADORAÇÃO E LITURGIA", "14 EDUCAÇÃO CRISTÃ", "15 DISCIPULADO", "16 FAMÍLIA CRISTÃ", "17 FORMAÇÃO ESPIRITUAL", "18 EVANGELISMO", "19 FILOSOFIA CRISTÃ", "20 COSMOVISÃO CRISTÃ", "21 TEOLOGIA PÚBLICA", "22 ESTUDOS JUDAICOS E CONTEXTUAIS", "23 ESTUDOS DENOMINACIONAIS", "24 TEOLOGIA HISTÓRICA", "25 ESPIRITUALIDADE HISTÓRICA", "26 TEOLOGIA APLICADA", "27 MINISTÉRIO INFANTIL E JUVENIL", "28 MISSIOLOGIA", "29 LINGUAGENS E COMUNICAÇÃO CRISTÃ"];
    const HIERARQUIA = {
        1: { "REVELAÇÃO": ["Doutrina das Escrituras", "Crítica Textual", "Manuscritologia"], "LINGUAGEM": ["Línguas Bíblicas", "Exegese", "Hermenêutica"] },
        2: { "ANTIGO TESTAMENTO": ["Pentateuco", "Profetas", "Poéticos"], "NOVO TESTAMENTO": ["Evangelhos", "Paulinas", "Apocalipse"] },
        3: { "TEMAS": ["Reino de Deus", "Alianças", "Messianismo"] }
        // ... (as outras serão carregadas dinamicamente)
    };
    const P1 = "AQ.Ab8RN6JQi5L"; const P2 = "CGgGxeIBaNVAocD"; const P3 = "N1FQkZSb0n2kje4bNke08sDQ";
    const KEY = P1 + P2 + P3;

    function init() {
        const list = document.getElementById('list');
        DISCIPLINAS.forEach((name, i) => {
            const li = document.createElement('li'); li.className = 'module-item';
            li.innerText = name; li.onclick = () => showSub(i);
            list.appendChild(li);
        });
    }
    function showSub(id) {
        document.getElementById('path').innerText = DISCIPLINAS[id];
        const view = document.getElementById('view'); view.innerHTML = '';
        const subs = HIERARQUIA[id] || { "GERAL": ["Pesquisa Geral nesta Camada"] };
        Object.keys(subs).forEach(cat => {
            view.innerHTML += `<div style="color:var(--primary);margin-bottom:10px;font-weight:bold;font-size:14px;border-bottom:1px solid var(--border);padding-bottom:5px;">${cat}</div>`;
            const grid = document.createElement('div'); grid.className = 'grid';
            subs[cat].forEach(item => {
                const card = document.createElement('div'); card.className = 'card';
                card.innerText = item; card.onclick = () => openSearch(item, DISCIPLINAS[id]);
                grid.appendChild(card);
            });
            view.appendChild(grid); view.innerHTML += '  
  
';
        });
    }
    function openSearch(item, disc) {
        document.getElementById('view').innerHTML = `
            <div class="search-box">
                <small style="color:var(--accent)">${disc}</small>
                <h3>INVESTIGAR: ${item.toUpperCase()}</h3>
                <input id="q" type="text" placeholder="Digite o tema...">
                <button id="btn" onclick="run('${item}', '${disc}')">PESQUISAR</button>
                <div id="load" style="display:none;margin-top:15px;color:var(--primary)">ACIONANDO FONTES ACADÊMICAS...</div>
                <div id="res" class="result"></div>
            </div>`;
    }
    async function run(item, disc) {
        const q = document.getElementById('q').value; if(!q) return;
        document.getElementById('btn').disabled = true; document.getElementById('load').style.display = 'block';
        const prompt = `Você é um Doutor em Teologia. Investigue "${q}" na área de "${item}" (${disc}). Foco em originais, sem devocional, densidade técnica acadêmica.`;
        try {
            const resp = await fetch("https://generativelanguage.googleapis.com/v1/models/gemini-3.7-flash:generateContent?key=" + KEY, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] } )
            });
            const data = await resp.json();
            document.getElementById('res').innerHTML = `<h2>RELATÓRIO</h2><div style="white-space:pre-wrap">${data.candidates[0].content.parts[0].text}</div>`;
            document.getElementById('res').style.display = 'block';
        } catch (e) { alert("Erro na conexão."); }
        finally { document.getElementById('btn').disabled = false; document.getElementById('load').style.display = 'none'; }
    }
    init();
</script>
</body>
</html>
