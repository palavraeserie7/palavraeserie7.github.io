    function init() {
        const ml = document.getElementById('ml');

        // Somente as áreas 1 a 29 são itens funcionais.
        Object.keys(DATA)
            .filter(k => k !== '00 AS DISCIPLINAS DA TEOLOGIA')
            .forEach(k => {
                const li = document.createElement('li');
                li.className = 'module-item';
                li.innerText = k;
                li.onclick = () => showSub(k, li);
                ml.appendChild(li);
            });

        showSub('1 FUNDAÇÃO BÍBLICA', ml.children[0]);

        const proList = document.getElementById('pro-list');
        PRO_MODULES.forEach(module => {
            const item = document.createElement('li');
            item.className = 'pro-item';
            item.innerText = module;
            item.onclick = () => {
                showProfessionalModule(module, item);
                if (module === '01 — TEXTO BÍBLICO') toggleTextBiblicoSubmenu(item);
            };
            proList.appendChild(item);
        });
    }

    function toggleProMenu() {
        const panel = document.getElementById('pro-panel');
        if (panel) panel.classList.toggle('open');
    }

    function renderProMenu() {
        const proList = document.getElementById('pro-inline-list');
        if (!proList) return;
        proList.innerHTML = '';
        PRO_MODULES.forEach(module => {
            const item = document.createElement('li');
            item.className = 'pro-item';
            item.innerText = module;
            item.onclick = () => showProfessionalModule(module, item);
            proList.appendChild(item);
        });
    }

    function toggleTextBiblicoSubmenu(parentItem) {
        const existing = parentItem.nextElementSibling;
        if (existing && existing.classList.contains('pro-sublist')) {
            existing.classList.toggle('open');
            return;
        }

        const submenu = document.createElement('ul');
        submenu.className = 'pro-sublist open';
        TEXT_BIBLICO_SUBMODULES.forEach(submodule => {
            const item = document.createElement('li');
            item.className = 'pro-subitem';
            item.innerText = submodule;
            item.onclick = (event) => {
                event.stopPropagation();
                document.querySelectorAll('.pro-subitem').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                showProfessionalModule(submodule, item, 'SUBMÓDULO DE TEXTO BÍBLICO');
            };
            submenu.appendChild(item);
        });
        parentItem.parentNode.insertBefore(submenu, parentItem.nextSibling);
    }

    function backToPreviousView() {
        const element = lastDisciplineElement || document.querySelector('.module-item');
        showSub(lastDisciplineKey, element);
    }

    function showProfessionalModule(module, element, category = 'MÓDULO PROFISSIONAL DE ANÁLISE') {
        document.body.dataset.activeMenu = 'pro';
        document.querySelectorAll('.module-item, .pro-item, .internal-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
        document.getElementById('mn').innerHTML = `
            <div class="content">
                <button class="back-arrow" onclick="backToPreviousView()" title="Voltar para a tela anterior">← VOLTAR</button>
                <div class="category-title">${category}</div>
                <div class="search-area" style="min-height:420px;">
                    <h1 style="color:#fff;">${module}</h1>
                    <div style="height:1px; background:var(--b); margin:25px 0;"></div>
                    <p style="color:#91a4bd;">Estrutura do módulo preparada para receber os procedimentos de análise.</p>
                </div>
            </div>`;
    }

    function renderInternalDisciplineMenu(discipline) {
        const internalList = document.getElementById('internal-list');
        if (!internalList || !DATA[discipline]) return;
        internalList.innerHTML = '';
        Object.keys(DATA[discipline]).forEach(category => {
            const categoryItem = document.createElement('li');
            categoryItem.className = 'internal-category';
            categoryItem.innerText = category;
            internalList.appendChild(categoryItem);

            DATA[discipline][category].forEach(tool => {
                const item = document.createElement('li');
                item.className = 'internal-item';
                item.innerText = tool;
                item.onclick = () => openSearch(tool, discipline);
                internalList.appendChild(item);
            });
        });
    }

    function showSub(k, el) {
        document.body.dataset.activeMenu = 'discipline';
        lastDisciplineKey = k;
        lastDisciplineElement = el;
        renderInternalDisciplineMenu(k);
        document.querySelectorAll('.module-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        const mn = document.getElementById('mn');
        let html = `<div class="content"><h1>${k}</h1>`;
        const subs = DATA[k];
        Object.keys(subs).forEach(cat => {
            html += `<div class="category-group"><div class="category-title">${cat}</div><div class="tools-grid">`;
            subs[cat].forEach(tool => {
                html += `<div class="tool-card" onclick="openSearch('${tool}', '${k}')"><h4>${tool}</h4></div>`;
            });
            html += `</div></div>`;
        });
        mn.innerHTML = html + `</div>`;
    }

                    </div>
                    <div class="ai-chat-input">
                        <div class="question-row">
                            <input type="text" id="q" placeholder="Escreva a sua questão de investigação...">
                            <button id="b" onclick="run('${tool}', '${disc}')">ENVIAR</button>
                        </div>
                        <div id="ld" class="ai-chat-loading">Análise contextual assistida por inteligência artificial...</div>
                    </div>
                </aside>
            </div>`;
        renderProMenu();
    }

    async function run(t, d) {
        const q = document.getElementById('q').value.trim(); if(!q) return;
        const btn = document.getElementById('b'); const ld = document.getElementById('ld'); const rs = document.getElementById('rs');
        btn.disabled = true; ld.style.display = 'block'; rs.style.display = 'none';
        
        const prompt = `Aja como um Doutor em Teologia. Investigue "${q}" na área de "${t}" (${d}). REGRAS: 1. Foco absoluto no original (Hebraico/Grego/LXX). 2. Sem comentários devocionais. 3. Densidade técnica acadêmica. 4. Se for bíblico, cite manuscritos e variantes.`;
        
        try {
            const r = await fetch("https://generativelanguage.googleapis.com/v1/models/gemini-3.7-flash:generateContent?key=" + KEY, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] } )
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error?.message || "Erro na API");
            
            rs.textContent = data.candidates[0].content.parts[0].text.trim();
            rs.style.display = 'block';
            rs.scrollIntoView({ behavior: 'smooth' });
        } catch (e) { alert("ERRO TÉCNICO: " + e.message); }
        finally { btn.disabled = false; ld.style.display = 'none'; }
    }
    init();
</script>
</body>
</html>
