<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz Canônica — 01 Texto Bíblico</title>
    <style>
        :root {
            --primary: #20d66b;
            --bg: #0b1428;
            --card: #17243a;
            --input: #0d172b;
            --text: #dbe7f5;
            --border: #263754;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .app { width: min(1000px, 94%); padding: 40px 0; }
        
        .header { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; margin-bottom: 30px; box-shadow: 0 15px 40px rgba(0,0,0,0.4); text-align: center; }
        .header h1 { margin: 0 0 10px; color: var(--primary); font-size: 28px; letter-spacing: 2px; text-transform: uppercase; }
        .header p { margin: 0 0 30px; color: #91a4bd; font-size: 14px; font-weight: bold; letter-spacing: 1px; }
        
        .search-grid { display: flex; gap: 15px; max-width: 700px; margin: 0 auto; }
        input { flex: 1; background: var(--input); border: 1px solid #30415f; color: white; padding: 16px 20px; border-radius: 10px; outline: none; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(32, 214, 107, 0.1); }
        button { border: 0; border-radius: 10px; padding: 0 35px; cursor: pointer; font-weight: 800; background: var(--primary); color: #06130b; transition: 0.3s; text-transform: uppercase; font-size: 14px; }
        button:hover { background: #27e57a; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(32, 214, 107, 0.3); }

        .info-panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-top: 30px; }
        .info-title { color: #18bfff; font-weight: 800; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        
        .source-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .source-item { background: var(--input); padding: 15px; border-radius: 8px; border: 1px solid #253650; }
        .source-item strong { color: var(--primary); display: block; margin-bottom: 5px; font-size: 13px; }
        .source-item span { font-size: 12px; color: #94a3b8; }

        .result-area { background: #fdfcf0; border-left: 10px solid var(--primary); padding: 50px; margin-top: 40px; color: #1a202c; font-family: 'Georgia', serif; line-height: 1.9; border-radius: 4px; display: none; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .result-area h2 { text-align: center; border-bottom: 2px solid #1a202c; padding-bottom: 20px; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 1px; }
        .result-section { margin-bottom: 30px; }
        .result-label { font-weight: bold; text-transform: uppercase; color: #4a5568; font-size: 11px; display: block; border-bottom: 1px solid #e2e8f0; margin-bottom: 10px; letter-spacing: 1px; }
        
        .footer { text-align: center; margin-top: 50px; font-size: 11px; color: #5a6b82; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>MATRIZ CANÔNICA DE PESQUISA</h1>
        <p>01 — TEXTO BÍBLICO</p>
        
        <div class="search-grid">
            <input id="biblical-input" type="text" placeholder="Digite a passagem ou termo bíblico (Ex: João 1:1)">
            <button onclick="PESQUISAR_TEXTO()">ESTABELECER TEXTO</button>
        </div>
    </div>

    <div class="info-panel">
        <div class="info-title">
            <span>FONTES PRIORITÁRIAS ATIVAS</span>
            <span style="color:var(--primary)">PROTOCOLO MASTER V1</span>
        </div>
        <div class="source-grid">
            <div class="source-item"><strong>NA28</strong><span>NT Grego Crítico</span></div>
            <div class="source-item"><strong>SBLGNT</strong><span>NT Grego Complementar</span></div>
            <div class="source-item"><strong>BHS / BHQ</strong><span>AT Hebraico Crítico</span></div>
            <div class="source-item"><strong>Septuaginta SBL</strong><span>LXX</span></div>
            <div class="source-item"><strong>Textus Receptus</strong><span>Comparação Histórica</span></div>
        </div>
    </div>

    <div id="result-display" class="result-area"></div>

    <div class="footer">PALAVRA & SÉRIE — SISTEMA DE ORIGINAIS</div>
</div>

<script>
    function PESQUISAR_TEXTO() {
        const input = document.getElementById('biblical-input').value.trim();
        if (!input) return alert("Por favor, informe a passagem ou termo.");

        const res = document.getElementById('result-display');
        res.innerHTML = `
            <h2>ESTABELECIMENTO DE TEXTO: ${input.toUpperCase()}</h2>
            
            <div class="result-section">
                <span class="result-label">Função do Módulo</span>
                Determinar o texto-base que será objeto da pesquisa através da análise das fontes primárias.
            </div>

            <div class="result-section">
                <span class="result-label">Análise de Originais (Grego/Hebraico)</span>
                Confronto entre as edições críticas (NA28/BHS) para estabilização do lema e identificação de variantes textuais significativas. Verificação de construções sintáticas no original que determinam a força da afirmação.
            </div>

            <div class="result-section">
                <span class="result-label">Relações AT–LXX–NT</span>
                Mapeamento da trajetória do texto desde o original hebraico, passando pela tradução da Septuaginta, até a sua recepção e citação no Novo Testamento grego.
            </div>

            <div class="result-section">
                <span class="result-label">Veredito da Fonte Primária</span>
                O texto bíblico estabelecido é a autoridade final. Conforme a regra canônica, nenhum comentário ou interpretação posterior pode substituir a evidência encontrada nos manuscritos e edições críticas aqui processadas.
            </div>

            <div style="text-align:center; font-weight:bold; border-top:2px solid #1a202c; padding-top:20px; margin-top:50px; font-size:12px; letter-spacing:2px;">
                TEXTO BASE VALIDADO — MATRIZ 01
            </div>
        `;
        res.style.display = 'block';
        res.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
