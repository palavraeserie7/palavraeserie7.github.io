
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz de Análise Bíblica — Palavra & Série</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #0b1428; color: #dbe7f5; font-family: 'Segoe UI', sans-serif; }
        .app { width: min(1200px, 94%); margin: 35px auto 70px; }
        .header { background: #18243a; border: 1px solid #263754; border-radius: 12px; padding: 28px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .header h1 { margin: 0 0 8px; color: #20d66b; font-size: 25px; }
        .search-grid { display: grid; grid-template-columns: 1fr 1fr auto; gap: 12px; margin-top: 20px; }
        input { width: 100%; background: #0d172b; border: 1px solid #30415f; color: white; padding: 14px; border-radius: 8px; outline: none; }
        button { border: 0; border-radius: 8px; padding: 14px 30px; cursor: pointer; font-weight: bold; background: #20c96b; color: #06130b; transition: 0.3s; text-transform: uppercase; }
        button:hover { background: #27e57a; }
        .secao { background: #17243a; border: 1px solid #263754; border-radius: 12px; padding: 25px; margin-bottom: 25px; }
        .titulo-secao { color: #18bfff; font-weight: 800; margin-bottom: 20px; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid #263754; padding-bottom: 10px; }
        .module { background: #0d172b; border: 1px solid #253650; border-radius: 10px; margin-bottom: 12px; padding: 18px; }
        .module-title { color: #18bfff; font-weight: bold; font-size: 14px; }
        .module-status { font-size: 10px; padding: 5px 10px; border-radius: 5px; border: 1px solid #20d66b; color: #20d66b; float: right; }
        .research-box { background: #fdfcf0; border-left: 8px solid #20d66b; padding: 40px; margin-top: 30px; color: #1a202c; font-family: 'Georgia', serif; line-height: 1.8; }
        
        /* Estilos da Central de Publicação */
        .social-container { background: #111b33; border: 2px solid #20d66b; border-radius: 15px; padding: 30px; margin-top: 40px; }
        .social-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #1f2937; color: #94a3b8; padding: 12px 20px; border-radius: 8px; cursor: pointer; border: 1px solid #374151; font-weight: bold; flex: 1; text-align: center; }
        .tab-btn.active { background: #20d66b; color: #06130b; border-color: #20d66b; }
        .social-content { background: #0d172b; border: 1px solid #263754; border-radius: 10px; padding: 25px; color: #dbe7f5; min-height: 200px; font-size: 1.1rem; line-height: 1.6; }
        .action-btns { margin-top: 20px; display: flex; gap: 15px; }
        .copy-btn { background: #3b82f6; color: white; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .wa-btn { background: #25D366; color: white; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <h1>Motor de Investigação — Palavra & Série</h1>
        <div class="search-grid">
            <input id="tema-input" type="text" placeholder="Tema teológico (ex.: Graça)">
            <input id="passagem-input" type="text" placeholder="Passagem bíblica">
            <button onclick="PROCESSAR_MATRIZ()">ANALISAR E PUBLICAR</button>
        </div>
    </div>

    <div class="secao">
        <div class="titulo-secao">MÓDULOS DE INVESTIGAÇÃO (12 ETAPAS)</div>
        <div id="modules-container">Aguardando tema...</div>
    </div>

    <div id="resultado-area" class="research-box" style="display:none;"></div>

    <!-- NOVA CENTRAL DE PUBLICAÇÃO -->
    <div id="central-social" class="social-container" style="display:none;">
        <div class="titulo-secao" style="color:#20d66b;">🚀 CENTRAL DE PUBLICAÇÃO DIGITAL</div>
        <div class="social-tabs">
            <div id="btn-insta" class="tab-btn active" onclick="mudarAba('insta')">INSTAGRAM</div>
            <div id="btn-video" class="tab-btn" onclick="mudarAba('video')">SCRIPT VÍDEO</div>
            <div id="btn-wa" class="tab-btn" onclick="mudarAba('wa')">WHATSAPP</div>
        </div>
        <div class="social-content">
            <div id="texto-social" style="white-space: pre-wrap;"></div>
        </div>
        <div class="action-btns">
            <div class="copy-btn" onclick="copiarTexto()">COPIAR TEXTO</div>
            <a id="link-wa" href="#" target="_blank" class="wa-btn" style="display:none;">ENVIAR PARA WHATSAPP</a>
        </div>
    </div>
</div>

<script>
    const MATRIZ = {
        "ANL-01": "Análise dos originais (NA28/BHS).", "ANL-02": "Traduções históricas.", "ANL-03": "Sintaxe e Gramática.",
        "ANL-04": "Léxico (BDAG/HALOT).", "ANL-05": "Teologia Bíblica.", "ANL-06": "Contexto Literário.",
        "ANL-07": "Contexto Histórico.", "ANL-08": "Geografia Bíblica.", "ANL-09": "Relação Canônica.",
        "ANL-10": "Hermenêutica.", "ANL-11": "Teologia Sistemática.", "ANL-12": "Síntese Final."
    };

    let CONTEUDO_SOCIAL = { insta: "", video: "", wa: "" };

    async function PROCESSAR_MATRIZ() {
        const tema = document.getElementById('tema-input').value.trim();
        if (!tema) return alert("Informe um tema.");

        const container = document.getElementById('modules-container');
        const resArea = document.getElementById('resultado-area');
        const socialArea = document.getElementById('central-social');

        container.innerHTML = ""; resArea.style.display = 'none'; socialArea.style.display = 'none';

        let textoFinal = "";
        for (let id in MATRIZ) {
            const div = document.createElement('div'); div.className = "module";
            div.innerHTML = `<span class="module-status">COMPLETED</span><span class="module-title">${id}</span><p>${MATRIZ[id]}</p>`;
            container.appendChild(div);
            await new Promise(r => setTimeout(r, 200));
            textoFinal += `[${id}] ${MATRIZ[id]}\n`;
        }

        resArea.innerHTML = `<h2>DOSSIÊ: ${tema.toUpperCase()}</h2><div style="white-space:pre-wrap;">${textoFinal}</div>`;
        resArea.style.display = 'block';

        // GERAÇÃO AUTOMÁTICA PARA REDES SOCIAIS
        CONTEUDO_SOCIAL.insta = `📸 POST PARA INSTAGRAM\n\nVocê já parou para pensar na profundidade de "${tema}"?\n\nNossa investigação exegética de hoje revela que ${tema} é a base para uma vida cristã madura. Confira o estudo completo!\n\n#Teologia #Exegese #PalavraESerie`;
        CONTEUDO_SOCIAL.video = `🎥 ROTEIRO PARA VÍDEO CURTO\n\n[00:00] "Você sabe o que a Bíblia realmente diz sobre ${tema}?"\n[00:10] "No original grego/hebraico, descobrimos algo surpreendente..."\n[00:30] "Quer o estudo completo? Digite EU QUERO!"`;
        CONTEUDO_SOCIAL.wa = `💬 *ESTUDO BÍBLICO: ${tema.toUpperCase()}*\n\nCompartilho com vocês a síntese da nossa investigação de hoje.\n\n*Ponto Chave:* A análise técnica mostra que ${tema} transforma nosso caráter.\n\nLeia mais em nossa plataforma!`;

        socialArea.style.display = 'block';
        mudarAba('insta');
        socialArea.scrollIntoView({ behavior: 'smooth' });
    }

    function mudarAba(tipo) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + (tipo === 'insta' ? 'insta' : tipo === 'video' ? 'video' : 'wa')).classList.add('active');
        document.getElementById('texto-social').innerText = CONTEUDO_SOCIAL[tipo];
        
        const linkWa = document.getElementById('link-wa');
        if (tipo === 'wa') {
            linkWa.style.display = 'inline-block';
            linkWa.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(CONTEUDO_SOCIAL.wa )}`;
        } else {
            linkWa.style.display = 'none';
        }
    }

    function copiarTexto() {
        const txt = document.getElementById('texto-social').innerText;
        navigator.clipboard.writeText(txt).then(() => alert("Copiado!"));
    }
</script>
</body>
</html>
