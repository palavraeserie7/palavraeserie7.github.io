    <style>
        :root { --primary: #20d66b; --bg: #0b1428; --sidebar-bg: #111b30; --card: #17243a; --input: #0d172b; --text: #dbe7f5; --border: #263754; --accent: #18bfff; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 320px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
        .sidebar-header { padding: 25px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
        .sidebar-header h2 { font-size: 14px; color: var(--primary); margin: 0; letter-spacing: 2px; text-transform: uppercase; }
        .module-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; margin: 0; scrollbar-width: thin; }
        .module-item { padding: 10px 15px; margin-bottom: 4px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #91a4bd; cursor: pointer; transition: 0.2s; display: flex; align-items: center; }
        .module-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .module-item.active { background: rgba(32, 214, 107, 0.1); border-left: 3px solid var(--primary); color: var(--primary); padding-left: 12px; }
        .module-item span { margin-right: 10px; opacity: 0.5; font-family: monospace; width: 20px; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: radial-gradient(circle at center, #111b30 0%, #0b1428 100%); overflow: hidden; }
        .top-bar { padding: 15px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); }
        .breadcrumb { font-size: 12px; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .view-container { flex: 1; overflow-y: auto; padding: 40px; }
        .category-group { margin-bottom: 40px; width: 100%; max-width: 900px; }
        .category-title { font-size: 14px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 20px; letter-spacing: 2px; font-weight: 900; }
        .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .item-card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 12px; font-weight: bold; color: #dbe7f5; display: flex; align-items: center; }
        .item-card:hover { border-color: var(--primary); background: rgba(32, 214, 107, 0.05); transform: translateX(5px); }
        .item-card::before { content: '•'; color: var(--primary); margin-right: 10px; }
        .search-box { background: var(--card); border: 1px solid var(--border); padding: 30px; border-radius: 12px; max-width: 700px; margin: 0 auto; }
        .search-box h3 { margin-top: 0; text-align: center; color: var(--primary); }
        .input-group { display: flex; gap: 10px; margin-top: 20px; }
        input { flex: 1; background: var(--input); border: 1px solid var(--border); color: white; padding: 12px 15px; border-radius: 6px; outline: none; }
        button { background: var(--primary); color: #000; border: none; padding: 0 20px; border-radius: 6px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .result-panel { margin-top: 30px; background: #fdfcf0; color: #1a202c; padding: 30px; border-radius: 4px; border-left: 8px solid var(--primary); font-family: 'Georgia', serif; display: none; }
        .footer-bar { padding: 10px; text-align: center; font-size: 10px; background: rgba(0,0,0,0.3); color: #5a6b82; font-weight: bold; letter-spacing: 1px; }

    const P1 = "AQ.Ab8RN6JQi5L"; const P2 = "CGgGxeIBaNVAocD"; const P3 = "N1FQkZSb0n2kje4bNke08sDQ";
    const API_KEY = P1 + P2 + P3;
    function init() {
        const list = document.getElementById('module-list');
        DISCIPLINAS.forEach((name, i) => {
            const li = document.createElement('li'); li.className = 'module-item';
            li.innerHTML = `<span>${i < 10 ? '0'+i : i}</span> ${name.replace(/^\d+\s/, '')}`;
            li.onclick = () => selectDisciplina(i); list.appendChild(li);
        });
    }
    function selectDisciplina(id) {
        document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
        const activeItem = document.querySelectorAll('.module-item')[id]; if (activeItem) activeItem.classList.add('active');
        document.getElementById('path-display').innerText = DISCIPLINAS[id];
        const container = document.getElementById('view-container'); container.innerHTML = '';
        if (HIERARQUIA[id]) {
            Object.keys(HIERARQUIA[id]).forEach(cat => {
                const group = document.createElement('div'); group.className = 'category-group';
                group.innerHTML = `<div class="category-title">${cat}</div>`;
                const grid = document.createElement('div'); grid.className = 'items-grid';
                HIERARQUIA[id][cat].forEach(item => {
                    const card = document.createElement('div'); card.className = 'item-card';
                    card.innerText = item; card.onclick = () => openTool(item, DISCIPLINAS[id]);
                    grid.appendChild(card);
                });
                group.appendChild(grid); container.appendChild(group);
            });
        } else { container.innerHTML = `<div style="text-align:center; padding:100px; color:#5a6b82;">Camada "${DISCIPLINAS[id]}" em desenvolvimento.</div>`; }
    }
    function openTool(name, disciplina) {
        const container = document.getElementById('view-container');
        container.innerHTML = `<div class="search-box"><div style="font-size:10px; color:var(--accent); margin-bottom:5px;">${disciplina.toUpperCase()}</div><h3>MATRIZ: ${name.toUpperCase()}</h3><div class="input-group"><input id="tool-input" type="text" placeholder="Digite o tema ou passagem..." onkeypress="if(event.key==='Enter')runSearch('${name}', '${disciplina}')"><button id="search-btn" onclick="runSearch('${name}', '${disciplina}')">PESQUISAR</button></div><div id="load-msg" style="display:none; color:var(--primary); font-size:12px; text-align:center; margin-top:15px; font-weight:bold;">ACIONANDO FONTES ACADÊMICAS...</div></div><div id="result-panel" class="result-panel"></div>`;
        document.getElementById('tool-input').focus();
    }
    async function runSearch(toolName, disciplina) {
        const input = document.getElementById('tool-input').value.trim(); if (!input) return alert("Digite algo para pesquisar.");
        const btn = document.getElementById('search-btn'); const load = document.getElementById('load-msg'); const res = document.getElementById('result-panel');
        btn.disabled = true; load.style.display = 'block'; res.style.display = 'none';
        const prompt = `Você é o motor de inteligência da disciplina ${disciplina}, especificamente para a ferramenta "${toolName}". Realize uma análise profunda sobre "${input}". REGRAS: 1. Foco no original (Hebraico/Grego/LXX). 2. Sem comentários devocionais. 3. Densidade acadêmica técnica. 4. Se for bíblico, cite manuscritos e variantes.`;
        try {
            const response = await fetch("https://generativelanguage.googleapis.com/v1/models/gemini-3.7-flash:generateContent?key=" + API_KEY, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] } ) });
            const data = await response.json(); if (!response.ok) throw new Error(data.error?.message || "Erro na API");
            res.innerHTML = `<h2>RESULTADO: ${toolName.toUpperCase()}</h2><div style="white-space: pre-wrap; font-size: 1.1rem; line-height: 1.8;">${data.candidates[0].content.parts[0].text}</div>`;
            res.style.display = 'block'; res.scrollIntoView({ behavior: 'smooth' });
        } catch (e) { res.innerHTML = `<div style="color:red; padding:20px; border:1px solid red; border-radius:8px;"><strong>ERRO TÉCNICO:</strong>  
${e.message}</div>`; res.style.display = 'block'; } finally { btn.disabled = false; load.style.display = 'none'; }
    }
    init();
</script>
