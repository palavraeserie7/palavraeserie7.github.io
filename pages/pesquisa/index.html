<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra & Série — Matriz Canônica</title>
    <style>
        :root { --primary: #20d66b; --bg: #0b1428; --sidebar-bg: #111b30; --card: #17243a; --input: #0d172b; --text: #dbe7f5; --border: #263754; --accent: #18bfff; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
        .module-list { flex: 1; overflow-y: auto; padding: 10px; list-style: none; margin: 0; }
        .module-item { padding: 12px; margin-bottom: 5px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; color: #91a4bd; border: 1px solid transparent; }
        .module-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .module-item.active { background: rgba(32, 214, 107, 0.1); border-color: var(--primary); color: var(--primary); }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(circle at center, #111b30 0%, #0b1428 100%); }
        .top { padding: 15px 30px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.3); font-size: 12px; font-weight: bold; color: var(--accent); display: flex; justify-content: space-between; }
        .content { flex: 1; overflow-y: auto; padding: 40px; }
        .category-title { color: var(--primary); font-size: 14px; font-weight: 900; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin: 30px 0 15px 0; letter-spacing: 1px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .card:hover { border-color: var(--primary); background: rgba(32, 214, 107, 0.05); transform: translateY(-2px); }
        .search-box { background: var(--card); padding: 40px; border-radius: 16px; max-width: 700px; margin: 0 auto; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .input-group { display: flex; gap: 10px; margin-top: 25px; }
        input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid var(--border); background: var(--input); color: white; font-size: 16px; outline: none; }
        button { padding: 0 25px; border-radius: 8px; border: none; background: var(--primary); color: #000; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .result { margin-top: 40px; background: #fdfcf0; color: #1a202c; padding: 40px; border-radius: 4px; border-left: 12px solid var(--primary); font-family: 'Georgia', serif; display: none; line-height: 1.8; font-size: 1.1rem; }
        .footer { padding: 10px; text-align: center; font-size: 10px; background: rgba(0,0,0,0.4); color: #5a6b82; font-weight: bold; letter-spacing: 1px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-header"><h2 style="color:var(--primary);margin:0;font-size:14px;letter-spacing:2px;">MATRIZ CANÔNICA</h2></div>
    <ul id="list" class="module-list"></ul>
</div>
<div class="main">
    <div class="top"><span id="path">SELECIONE UMA DISCIPLINA</span><span>V13.6</span></div>
    <div id="view" class="content">
        <div style="text-align:center;margin-top:15vh;opacity:0.2;">
            <h1 style="font-size:100px;margin:0;">&</h1>
            <p style="letter-spacing:5px;">PALAVRA & SÉRIE</p>
        </div>
    </div>
    <div class="footer">O TEXTO BÍBLICO É A FONTE PRIMÁRIA. NENHUM COMENTÁRIO PODE SUBSTITUIR O TEXTO.</div>
</div>
<script>
    const DISCIPLINAS = ["00 AS DICIPLINAS DA TEOLOGIA", "1 FUNDAÇÃO BÍBLICA", "2 ESTUDOS BÍBLICOS CANÔNICOS", "3 TEOLOGIA BÍBLICA", "4 TEOLOGIA SISTEMÁTICA", "5 HISTÓRIA DA IGREJA", "6 VIDA CRISTÃ", "7 ACONSELHAMENTO PASTORAL", "8 APOLOGÉTICA", "9 MISSÕES / CULTURA / SOCIEDADE", "10 ÉTICA CRISTÃ", "11 LIDERANÇA E MINISTÉRIO", "12 PREGAÇÃO E ENSINO", "13 ADORAÇÃO E LITURGIA", "14 EDUCAÇÃO CRISTÃ", "15 DISCIPULADO", "16 FAMÍLIA CRISTÃ", "17 FORMAÇÃO ESPIRITUAL", "18 EVANGELISMO", "19 FILOSOFIA CRISTÃ", "20 COSMOVISÃO CRISTÃ", "21 TEOLOGIA PÚBLICA", "22 ESTUDOS JUDAICOS E CONTEXTUAIS", "23 ESTUDOS DENOMINACIONAIS", "24 TEOLOGIA HISTÓRICA", "25 ESPIRITUALIDADE HISTÓRICA", "26 TEOLOGIA APLICADA", "27 MINISTÉRIO INFANTIL E JUVENIL", "28 MISSIOLOGIA", "29 LINGUAGENS E COMUNICAÇÃO CRISTÃ"];
    
    const HIERARQUIA = {
        1: { "REVELAÇÃO E ESCRITURA": ["Doutrina das Escrituras", "Revelação e Inspiração", "Canonicidade", "Crítica Textual", "Manuscritologia"], "LINGUAGEM BÍBLICA": ["Línguas Bíblicas", "Linguística", "Filologia", "Sintaxe", "Semântica"] },
        2: { "CORPUS ANTIGO TESTAMENTO": ["Pentateuco", "História", "Sapiencial", "Poética", "Profetas"], "CORPUS NOVO TESTAMENTO": ["Evangelhos", "Atos", "Paulinas", "Hebreus", "Apocalipse"] },
        3: { "TEMAS REDENTIVOS": ["História Redentiva", "Reino de Deus", "Alianças", "Tipologia", "Messianismo"] }
    };

    const P1 = "AQ.Ab8RN6JQi5L"; const P2 = "CGgGxeIBaNVAocD"; const P3 = "N1FQkZSb0n2kje4bNke08sDQ";
    const KEY = P1 + P2 + P3;

    function init() {
        const list = document.getElementById('list');
        DISCIPLINAS.forEach((name, i) => {
            const li = document.createElement('li'); li.className = 'module-item';
            li.innerHTML = `<span style="opacity:0.5;margin-right:10px;">${i.toString().padStart(2,'0')}</span> ${name.replace(/^\d+\s/, '')}`;
            li.onclick = () => showSub(i);
            list.appendChild(li);
        });
    }

    function showSub(id) {
        document.querySelectorAll('.module-item').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.module-item')[id].classList.add('active');
        document.getElementById('path').innerText = DISCIPLINAS[id];
        
        const view = document.getElementById('view'); view.innerHTML = '';
        const subs = HIERARQUIA[id] || { "PESQUISA GERAL": ["Investigação nesta Camada"] };
        
        for (const cat in subs) {
            const title = document.createElement('div'); title.className = 'category-title'; title.innerText = cat;
            const grid = document.createElement('div'); grid.className = 'grid';
            subs[cat].forEach(item => {
                const card = document.createElement('div'); card.className = 'card'; card.innerText = item;
                card.onclick = () => openSearch(item, DISCIPLINAS[id]);
                grid.appendChild(card);
            });
            view.appendChild(title); view.appendChild(grid);
        }
    }

    function openSearch(item, disc) {
        document.getElementById('view').innerHTML = `
            <div class="search-box">
                <div style="font-size:10px;color:var(--accent);margin-bottom:5px;font-weight:bold;">${disc.toUpperCase()}</div>
                <h3 style="margin:0;">INVESTIGAR: ${item.toUpperCase()}</h3>
                <div class="input-group">
                    <input id="q" type="text" placeholder="Digite o tema ou passagem..." onkeypress="if(event.key==='Enter')run('${item}','${disc}')">
                    <button id="btn" onclick="run('${item}','${disc}')">ESTABELECER</button>
                </div>
                <div id="ld" style="display:none;margin-top:20px;color:var(--primary);font-weight:bold;font-size:12px;">ACIONANDO FONTES ACADÊMICAS...</div>
                <div id="res" class="result"></div>
            </div>`;
        document.getElementById('q').focus();
    }

    async function run(item, disc) {
        const q = document.getElementById('q').value.trim(); if(!q) return;
        const btn = document.getElementById('btn'); const ld = document.getElementById('ld'); const res = document.getElementById('res');
        btn.disabled = true; ld.style.display = 'block'; res.style.display = 'none';
        
        const prompt = `Aja como um Doutor em Teologia. Investigue "${q}" na área de "${item}" (${disc}). REGRAS: 1. Foco em originais (Hebraico/Grego). 2. Sem devocional. 3. Densidade técnica acadêmica. 4. Divida em seções.`;
        
        try {
            const response = await fetch("https://generativelanguage.googleapis.com/v1/models/gemini-3.7-flash:generateContent?key=" + KEY, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] } )
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error?.message || "Erro API");
            res.innerHTML = `<h2>RELATÓRIO TÉCNICO</h2><div style="white-space:pre-wrap">${data.candidates[0].content.parts[0].text}</div>`;
            res.style.display = 'block';
            res.scrollIntoView({ behavior: 'smooth' });
        } catch (e) { alert("ERRO: " + e.message); }
        finally { btn.disabled = false; ld.style.display = 'none'; }
    }
    init();
</script>
</body>
</html>
