<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra & Série — Matriz Canônica</title>
    <style>

        * { box-sizing: border-box; }

        .sidebar { width: 320px; background: var(--s); border-right: 1px solid var(--b); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        .sidebar.pro-active .pro-mode { flex: 1 1 100%; }
        .discipline-mode { border-bottom: 1px solid var(--b); }
        .discipline-area { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        .discipline-list-pane { height: 100%; overflow-y: auto; }
        .discipline-internal-pane { display: none; }
        .internal-heading { padding: 12px 15px 8px; color: var(--a); font-size: 10px; font-weight: 900; letter-spacing: 1px; border-bottom: 1px solid var(--b); }
        .internal-list { list-style: none; padding: 8px 10px 14px; margin: 0; }

        .internal-category { padding: 8px 8px 5px; color: #7fcbed; font-size: 9px; font-weight: 900; letter-spacing: 0.6px; }
        .internal-item { padding: 7px 9px; margin-bottom: 3px; border-radius: 5px; cursor: pointer; color: #a9bbcf; font-size: 10px; line-height: 1.25; }
        .internal-item:hover { background: rgba(24,191,255,0.1); color: #fff; }
        .sidebar-header { padding: 25px; border-bottom: 1px solid var(--b); background: rgba(0,0,0,0.2); }
        .sidebar-header h2 { font-size: 14px; color: var(--p); margin: 0; letter-spacing: 2px; }
        .sidebar-header p { font-size: 10px; color: #91a4bd; margin: 5px 0 0; font-weight: bold; }
        .module-list { list-style: none; padding: 10px; margin: 0; }
        .module-item { padding: 12px 15px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; font-size: 12px; font-weight: 600; color: #91a4bd; display: flex; align-items: center; }
        .module-item:hover { background: rgba(32, 214, 107, 0.05); color: var(--t); }
        .module-item.active { background: rgba(32, 214, 107, 0.1); border-color: var(--p); color: #fff; }
        .menu-heading { padding: 22px 15px 14px; border-bottom: 1px solid var(--b); background: rgba(0,0,0,0.12); }
        .menu-heading span { display: block; color: var(--p); font-size: 13px; font-weight: 900; letter-spacing: 2px; }
        .menu-heading strong { display: block; margin-top: 7px; color: #e5edf7; font-size: 11px; line-height: 1.35; letter-spacing: 0.4px; }
        .pro-area { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
        .pro-menu-box { flex: 1 1 auto; min-height: 0; margin: 10px; overflow: hidden; border: 1px solid #2e6580; border-radius: 10px; background: #0d1b31; box-shadow: 0 8px 18px rgba(0,0,0,0.18); display: flex; flex-direction: column; }
        .pro-internal-pane { display: none; }
        .pro-internal-list { list-style: none; padding: 8px 10px 14px; margin: 0; }
        .pro-response-paper { display: none; }

        .pro-main-paper h2 { margin: 0 0 12px; color: #4a443b; font-size: 28px; }
        .pro-main-paper h4 { margin: 0 0 14px; color: #806f53; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; }
        .pro-main-paper p { margin: 0; line-height: 1.65; font-size: 13px; white-space: pre-wrap; }
        .pro-chat { margin-top: 42px; padding-top: 24px; border-top: 1px solid #d8cdb8; }
        .pro-chat h3 { margin: 0 0 8px; color: #806f53; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
        .pro-chat-intro { margin-bottom: 14px !important; color: #6a6256; font-size: 12px !important; }
        .pro-chat-messages { min-height: 90px; max-height: 260px; overflow-y: auto; margin-bottom: 12px; }
        .pro-chat-message { margin: 8px 0; padding: 10px 12px; border-radius: 7px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; }
        .pro-chat-message.system { background: rgba(128,111,83,0.10); color: #6a6256; }
        .pro-chat-message.user { margin-left: 12%; background: #e3d8c4; color: #4a443b; }
        .pro-chat-form { display: flex; gap: 10px; align-items: stretch; }
        .pro-chat-form textarea { flex: 1; min-height: 58px; resize: vertical; padding: 11px; border: 1px solid #cdbfaa; border-radius: 6px; background: #faf6ed; color: #4a443b; font: inherit; font-size: 12px; outline: none; }
        .pro-chat-form textarea:focus { border-color: #a88f66; box-shadow: 0 0 0 2px rgba(168,143,102,0.16); }
        .pro-chat-form button { align-self: stretch; padding: 0 18px; border: 0; border-radius: 6px; background: #806f53; color: #fffaf0; font-weight: 800; cursor: pointer; }
        .pro-chat-form button:hover { background: #6c5b42; }
        .pro-menu-heading { padding: 16px 14px 12px; border-bottom: 1px solid #2e6580; background: rgba(24,191,255,0.09); }
        .pro-menu-heading span { display: block; color: var(--a); font-size: 11px; font-weight: 900; letter-spacing: 1px; line-height: 1.35; }
        .pro-menu-heading strong { display: inline-block; margin-top: 8px; padding: 4px 8px; border: 1px solid var(--a); border-radius: 4px; color: #d8f5ff; font-size: 9px; line-height: 1.2; letter-spacing: 1px; }
        .pro-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; list-style: none; padding: 12px 10px 14px; margin: 0; }
        .pro-item { padding: 11px 10px; margin-bottom: 6px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; color: #b5c5d8; font-size: 10px; font-weight: 700; line-height: 1.3; transition: 0.2s; }
        .pro-item:hover, .pro-item.active { background: rgba(24,191,255,0.14); border-color: var(--a); color: #fff; box-shadow: 0 3px 10px rgba(24,191,255,0.1); }
        .pro-sublist { display: none; list-style: none; padding: 2px 0 6px 14px; margin: 0; border-left: 2px solid #2e6580; }
        .pro-sublist.open { display: block; }
        .pro-subitem { padding: 8px 8px; margin-bottom: 3px; color: #9fb9cc; cursor: pointer; font-size: 9px; line-height: 1.3; border-radius: 5px; }
        .pro-subitem:hover, .pro-subitem.active { background: rgba(24,191,255,0.1); color: #fff; }
        .main { flex: 1; overflow-y: auto; background: var(--bg); display: flex; flex-direction: column; }
        .content { padding: 40px; max-width: 1000px; margin: 0 auto; width: 100%; }
        .category-group { margin-bottom: 40px; }
        .category-title { font-size: 11px; font-weight: 900; color: var(--a); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; padding-bottom: 8px; border-bottom: 1px solid var(--b); }
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .tool-card { background: var(--c); border: 1px solid var(--b); padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .tool-card:hover { border-color: var(--p); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .tool-card h4 { margin: 0; font-size: 13px; color: #fff; line-height: 1.4; }
        .search-area { background: var(--c); border: 1px solid var(--b); padding: 30px; border-radius: 16px; margin-bottom: 30px; }
        .split-view { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 20px; height: calc(100vh - 145px); min-height: 560px; }
        .topic-paper { background: #f1eadb; color: #4a443b; border: 1px solid #d8cdb8; padding: 42px; border-radius: 8px; min-height: 100%; width: 100%; overflow-y: auto; box-shadow: 0 6px 18px rgba(55,45,30,0.12); }
        .topic-paper .category-title { color: #806f53; border-bottom-color: #d8cdb8; }
        .topic-paper h2 { margin: 0; color: #4a443b; font-size: clamp(26px, 3vw, 42px); line-height: 1.2; }
        .topic-paper .paper-space { min-height: 180px; }
        .study-placeholder { min-height: 120px; padding: 26px 0; color: #8b806e; font-size: 14px; font-style: italic; }
        .study-question { margin-top: 30px; padding: 28px 0 10px; border-top: 2px solid #c7b99f; }
        .study-question h3 { margin: 0 0 8px; color: #5f513d; font-size: 18px; letter-spacing: 1px; }
        .study-question p { margin: 0 0 14px; color: #776b59; font-size: 13px; }
        .study-question .question-row { display: flex; gap: 10px; }
        .study-question input { background: #faf6ed; border: 1px solid #cfc0a7; color: #4a443b; }
        .study-question input::placeholder { color: #9b907e; }
        .study-question button { min-height: 48px; }
        .study-loading { display: none; margin-top: 12px; color: #806f53; font-weight: 700; }
        .study-answer { display: none; margin-top: 20px; padding: 20px; border-left: 4px solid #b99b61; background: rgba(255,255,255,0.42); color: #4a443b; line-height: 1.75; white-space: pre-wrap; }
        .topic-paper-back { margin-bottom: 20px; background: transparent; color: var(--p); border: 1px solid var(--p); }
        .back-arrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; padding: 8px 18px; border: 1px solid var(--p); border-radius: 999px; background: transparent; color: var(--p); cursor: pointer; font-size: 14px; font-weight: 900; }
        .back-arrow:hover { background: rgba(32,214,107,0.12); }
        .ai-chat-panel { display: flex; flex-direction: column; min-height: 100%; overflow: hidden; border: 1px solid #263754; border-radius: 12px; background: #111b30; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
        .ai-chat-header { padding: 22px 24px; border-bottom: 1px solid #263754; background: #17243a; }
        .ai-chat-header h3 { margin: 0; color: #20d66b; font-size: 16px; letter-spacing: 1px; }
        .ai-chat-header p { margin: 8px 0 0; color: #91a4bd; font-size: 12px; line-height: 1.5; }
        .ai-chat-messages { flex: 1; overflow-y: auto; padding: 22px; }
        .ai-chat-welcome { padding: 18px; border: 1px solid #344762; border-radius: 10px; background: #17243a; color: #b9c7d8; line-height: 1.6; font-size: 14px; }
        .ai-chat-welcome strong { color: #fff; }
        .ai-chat-input { padding: 16px; border-top: 1px solid #263754; background: #0d172b; }
        .ai-chat-input .question-row { display: flex; gap: 10px; }
        .ai-chat-input input { min-width: 0; background: #111b30; border-color: #344762; }
        .ai-chat-input input:focus { border-color: var(--p); }
        .ai-chat-answer { display: none; margin-top: 16px; padding: 20px; border-left: 3px solid var(--p); border-radius: 6px; background: #17243a; color: #dbe7f5; line-height: 1.8; white-space: pre-wrap; font-size: 14px; }
        .ai-chat-loading { display: none; margin-top: 10px; color: var(--p); font-size: 12px; font-weight: bold; }
        @media (max-width: 900px) { .split-view { grid-template-columns: 1fr; height: auto; min-height: 0; } .topic-paper { min-height: 520px; } .ai-chat-panel { min-height: 520px; } }
        .search-box { display: flex; gap: 10px; margin-top: 15px; }
        input { flex: 1; background: var(--i); border: 1px solid var(--b); color: #fff; padding: 15px; border-radius: 8px; outline: none; }
        input:focus { border-color: var(--p); }
        button { background: var(--p); color: #000; border: none; padding: 0 25px; border-radius: 8px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        button:hover { filter: brightness(1.1); transform: scale(1.02); }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        .res { background: #fdfcf0; color: #1a202c; padding: 40px; border-radius: 12px; border-left: 10px solid var(--p); display: none; line-height: 1.8; font-size: 1.1rem; }
        .res h2 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 15px; color: #000; font-size: 1.4rem; }
        #ld { color: var(--p); font-weight: bold; margin-top: 15px; display: none; text-align: center; letter-spacing: 2px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--b); border-radius: 10px; }
    </style>
</head>

<script>

    const AI_PROXY_URL = "https://yellow-lab-f4b2.palavraeserie.workers.dev";

    const PRO_MODULE_DATA = {
        '01 — TEXTO BÍBLICO': { question: 'O que constitui o texto objeto da pesquisa?', rule: 'o texto bíblico é a fonte primária; nenhum comentário o substitui. Texto crítico eclético é o padrão — tradições históricas alternativas entram só como testemunho comparativo. A comparação de tradições em 01.9 é apenas um mapeamento preliminar — a avaliação e o julgamento das variantes pertencem exclusivamente ao ANL-02.', items: ['01.1 — Identificação da passagem', '01.2 — Testamento', '01.3 — Livro', '01.4 — Capítulo', '01.5 — Versículo', '01.6 — Texto hebraico', '01.7 — Texto grego', '01.8 — Texto da Septuaginta', '01.9 — Identificação preliminar de tradições textuais divergentes', '01.10 — Palavras e construções no original', '01.11 — Determinação do texto-base'] },
        '02 — CRÍTICA TEXTUAL': { question: 'Existem variantes textuais relevantes para esta passagem?', rule: 'variante relevante deve ser sinalizada, nunca apresentada como fato indiscutível.', items: ['02.1 — Identificação da variante textual', '02.2 — Localização da variante', '02.3 — Testemunhos textuais', '02.4 — Manuscritos e versões envolvidos', '02.5 — Evidências externas', '02.6 — Evidências internas', '02.7 — Comparação das leituras', '02.8 — Aparato crítico', '02.9 — Avaliação da variante', '02.10 — Impacto na tradução', '02.11 — Impacto na interpretação', '02.12 — Determinação textual'] },
        '03 — GRAMÁTICA E SINTAXE': { question: 'Como as palavras estão funcionando dentro da frase?', rule: 'a unidade mínima de interpretação é a palavra dentro da construção e do contexto — nunca isolada.', items: ['03.1 — Identificação da construção', '03.2 — Morfologia', '03.3 — Lema e forma lexical', '03.4 — Classe gramatical', '03.5 — Sujeito', '03.6 — Predicado', '03.7 — Objeto', '03.8 — Verbos', '03.9 — Tempo e aspecto', '03.10 — Voz', '03.11 — Modo', '03.12 — Construções gramaticais', '03.13 — Relações sintáticas', '03.14 — Conectivos', '03.15 — Relações entre cláusulas', '03.16 — Estrutura da frase (síntese)'] },
        '04 — LÉXICO': { question: 'O que determinado termo pode significar neste contexto?', rule: 'o contexto determina o sentido — vários significados possíveis não implica presença simultânea de todos. Fluxo: forma encontrada → lema → usos → campo semântico → contexto → sentido provável.', items: ['04.1 — Identificação da palavra', '04.2 — Forma encontrada no texto', '04.3 — Lema', '04.4 — Transliteração', '04.5 — Classe gramatical', '04.6 — Definições lexicais', '04.7 — Usos da palavra', '04.8 — Campo semântico', '04.9 — Uso no contexto', '04.10 — Uso no Antigo Testamento', '04.11 — Uso no Novo Testamento', '04.12 — Comparação das evidências lexicais', '04.13 — Sentido provável no contexto'] },
        '05 — LÉXICO TEOLÓGICO': { question: 'Como esse conceito funciona dentro da linguagem teológica da Escritura?', rule: 'o conceito teológico aprofunda, mas permanece subordinado ao uso efetivo da palavra no texto estudado.', items: ['05.1 — Identificação do conceito', '05.2 — Termo no texto', '05.3 — Base lexical do conceito', '05.4 — Uso no Antigo Testamento', '05.5 — Uso na Septuaginta', '05.6 — Uso no Judaísmo', '05.7 — Uso no Novo Testamento', '05.8 — Desenvolvimento do conceito', '05.9 — Relações teológicas', '05.10 — Comparação das evidências', '05.11 — Síntese do conceito teológico', '05.12 — Relação com o contexto da passagem'] },
        '06 — EXEGESE': { question: 'O que o autor está comunicando nesta passagem?', rule: 'integra as conclusões dos ANLs 01–05; não os repete.', items: ['06.1 — Delimitação da passagem', '06.2 — Contexto imediato', '06.3 — Estrutura da passagem', '06.4 — Argumento da passagem', '06.5 — Contexto literário', '06.6 — Gênero literário', '06.7 — Relação entre versículos', '06.8 — Relações entre unidades de pensamento', '06.9 — Intenção comunicativa', '06.10 — Problemas interpretativos', '06.11 — Interpretações existentes', '06.12 — Argumentos das interpretações', '06.13 — Avaliação exegética', '06.14 — Síntese exegética'] },
        '07 — CONTEXTO HISTÓRICO-CULTURAL': { question: 'O que o mundo original do texto acrescenta à interpretação?', rule: 'nenhum pano de fundo especulativo sem base em fonte primária ou evidência material.', items: ['07.1 — Identificação do contexto histórico', '07.2 — Período histórico', '07.3 — Localização geográfica', '07.4 — Contexto político', '07.5 — Contexto religioso', '07.6 — Contexto social', '07.7 — Costumes e práticas', '07.8 — Instituições e estruturas sociais', '07.9 — Cultura e valores', '07.10 — Mundo greco-romano', '07.11 — Antigo Oriente Próximo', '07.12 — Judaísmo e contexto religioso', '07.13 — Arqueologia e evidências materiais', '07.14 — Literatura e fontes extrabíblicas', '07.15 — Impacto do contexto na interpretação'] },
        '08 — HERMENÊUTICA E CONTROLE DE ERROS': { question: 'Estou interpretando corretamente aquilo que foi encontrado?', rule: 'camada de controle de qualidade — atua transversalmente, podendo auditar qualquer ANL anterior, não só como etapa final. Veredito reconhece: forte suporte / suporte parcial / evidência insuficiente / interpretação questionável / interpretações concorrentes.', items: ['08.1 — Identificação dos pressupostos', '08.2 — Controle do contexto', '08.3 — Controle do sentido lexical', '08.4 — Controle gramatical e sintático', '08.5 — Controle do contexto histórico-cultural', '08.6 — Detecção de eisegese', '08.7 — Detecção de anacronismo', '08.8 — Detecção de falácia lexical', '08.9 — Detecção de descontextualização', '08.10 — Controle de alegorização indevida', '08.11 — Controle de generalização indevida', '08.12 — Controle da relação AT–NT', '08.13 — Descrição versus prescrição', '08.14 — Coerência da interpretação com as evidências', '08.15 — Veredito hermenêutico'] },

    function init() {
        const ml = document.getElementById('ml');

        // Somente as áreas 1 a 29 são itens funcionais.
        Object.keys(DATA)
            .filter(k => k !== '00 AS DISCIPLINAS DA TEOLOGIA')
            .forEach(k => {
                const li = document.createElement('li');
                li.className = 'module-item';
                li.innerText = k;
                li.onclick = () => showSub(k, li);
                ml.appendChild(li);
            });

        showSub('1 FUNDAÇÃO BÍBLICA', ml.children[0]);

        renderAllInternalProMenus();
    }

    function toggleProMenu() {
        const panel = document.getElementById('pro-panel');
        if (panel) panel.classList.toggle('open');
    }

    function renderProMenu() {
        const proList = document.getElementById('pro-inline-list');
        if (!proList) return;
        proList.innerHTML = '';
        PRO_MODULES.forEach(module => {
            const item = document.createElement('li');
            item.className = 'pro-item';
            item.innerText = module;
            item.onclick = () => showProfessionalModule(module, item);
            proList.appendChild(item);
        });
    }

    function renderInternalProMenu(module) {
        const heading = document.getElementById('pro-internal-heading');
        const list = document.getElementById('pro-internal-list');
        if (!heading || !list) return;
        heading.innerText = `LISTA INTERNA — ${module}`;
        list.innerHTML = '';
        const items = module === '01 — TEXTO BÍBLICO'
            ? TEXT_BIBLICO_SUBMODULES
            : ['Submenu interno deste módulo será estruturado nesta área.'];
        items.forEach(submodule => {
            const item = document.createElement('li');
            item.className = 'internal-item';
            item.innerText = submodule;
            if (module === '01 — TEXTO BÍBLICO') {
                item.onclick = () => {
                    document.querySelectorAll('.internal-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    showProfessionalModule(submodule, item, 'SUBMÓDULO DE TEXTO BÍBLICO');
                };
            }
            list.appendChild(item);
        });
    }

    function toggleTextBiblicoSubmenu(parentItem) {
        const existing = parentItem.nextElementSibling;
        if (existing && existing.classList.contains('pro-sublist')) {
            existing.classList.toggle('open');
            return;
        }

        const submenu = document.createElement('ul');
        submenu.className = 'pro-sublist open';
        TEXT_BIBLICO_SUBMODULES.forEach(submodule => {
            const item = document.createElement('li');
            item.className = 'pro-subitem';
            item.innerText = submodule;
            item.onclick = (event) => {
                event.stopPropagation();
                document.querySelectorAll('.pro-subitem').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                showProfessionalModule(submodule, item, 'SUBMÓDULO DE TEXTO BÍBLICO');
            };
            submenu.appendChild(item);
        });
        parentItem.parentNode.insertBefore(submenu, parentItem.nextSibling);
    }

    function backToPreviousView() {
        const element = lastDisciplineElement || document.querySelector('.module-item');
        showSub(lastDisciplineKey, element);
    }

    function renderProModuleCards(module) {
        const cards = module === '01 — TEXTO BÍBLICO'
            ? TEXT_BIBLICO_SUBMODULES
            : [`Procedimentos de análise — ${module}`, 'Fontes e critérios do módulo', 'Área de estudo e investigação'];
        let html = `<div class="category-group"><div class="category-title">MATRIZ CANÔNICA DE PESQUISA PRO</div><div class="tools-grid">`;
        cards.forEach(card => {
            html += `<div class="tool-card" onclick="openProCard('${card}', '${module}')"><h4>${card}</h4></div>`;
        });
        html += '</div></div>';
        return html;
    }

    function renderProChat(module) {
        return `<div class="pro-chat">
            <h3>MESA DE INVESTIGAÇÃO</h3>
            <p class="pro-chat-intro">O estudo permanece disponível acima. Utilize esta mesa para aprofundar questões relacionadas ao módulo selecionado.</p>
            <div class="pro-chat-messages" id="pro-chat-messages">
                <div class="pro-chat-message system">Aguardando a sua questão de investigação.</div>
            </div>
            <form class="pro-chat-form" onsubmit="sendProQuestion(event, '${module}')">
                <textarea id="pro-question" placeholder="Escreva a sua questão de investigação..."></textarea>
                <button type="submit">ENVIAR</button>
            </form>
        </div>`;
    }

    async function sendProQuestion(event, module) {
        event.preventDefault();
        const input = document.getElementById('pro-question');
        const messages = document.getElementById('pro-chat-messages');
        const form = event.currentTarget;
        const button = form ? form.querySelector('button') : null;
        const question = input ? input.value.trim() : '';
        if (!question || !messages) return;

        const userMessage = document.createElement('div');
        userMessage.className = 'pro-chat-message user';
        userMessage.textContent = question;
        messages.appendChild(userMessage);

        const systemMessage = document.createElement('div');
        systemMessage.className = 'pro-chat-message system';
        systemMessage.textContent = 'A consultar a Mesa de Investigação...';
        messages.appendChild(systemMessage);
        if (input) input.value = '';
        if (button) button.disabled = true;
        messages.scrollTop = messages.scrollHeight;

        try {
            const response = await fetch(AI_PROXY_URL.replace(/\/$/, '') + '/api/pesquisa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question,
                    topic: module,
                    discipline: 'MATRIZ CANÔNICA DE PESQUISA PRO',
                    module
                })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erro no serviço de pesquisa.');
            systemMessage.textContent = data.text || 'A consulta não devolveu texto.';
        } catch (error) {
            systemMessage.textContent = 'Não foi possível concluir a consulta: ' + error.message;
        } finally {
            if (button) button.disabled = false;
            messages.scrollTop = messages.scrollHeight;
        }
    }

    function openProCard(card, module) {
        document.getElementById('mn').innerHTML = `
            <div class="content">
                <button class="back-arrow" onclick="showProfessionalModule('${module}', document.querySelector('.pro-item.active'))" title="Voltar para o módulo PRO">← VOLTAR</button>
                <div class="pro-main-paper">
                    <h4>MATRIZ CANÔNICA DE PESQUISA PRO</h4>
                    <h2>${card}</h2>
                    <p>A resposta da consulta para este item será apresentada nesta folha de leitura.</p>
                    ${renderProChat(module)}
                </div>
            </div>`;
    }

    function showProfessionalModule(module, element, category = 'MÓDULO PROFISSIONAL DE ANÁLISE') {
        document.body.dataset.activeMenu = 'pro';
        document.querySelector('.sidebar').classList.add('pro-active');
        document.querySelectorAll('.pro-item, .pro-subitem').forEach(item => item.classList.remove('active'));
        if (element) element.classList.add('active');
        const data = PRO_MODULE_DATA[module] || { question: '', rule: '', items: [] };
        let html = `<div class="content"><button class="back-arrow" onclick="backToPreviousView()" title="Voltar para a tela anterior">← VOLTAR</button><div class="pro-main-paper">`;
        html += `<h4>MATRIZ CANÔNICA DE PESQUISA PRO</h4><h2>${module}</h2><p><strong>Pergunta central:</strong> ${data.question}</p><p class="pro-question"><strong>Regra metodológica:</strong> ${data.rule || 'A análise deve permanecer vinculada às evidências do texto e às fontes primárias.'}</p>`;
        html += `${renderProChat(module)}</div></div>`;
        document.getElementById('mn').innerHTML = html;
    }

    function renderAllInternalDisciplineMenus() {
        const internalList = document.getElementById('internal-list');
        if (!internalList) return;
        internalList.innerHTML = '';
        Object.keys(DATA).filter(discipline => discipline !== '00 AS DISCIPLINAS DA TEOLOGIA').forEach(discipline => {
            const disciplineTitle = document.createElement('li');
            disciplineTitle.className = 'internal-discipline-title';
            disciplineTitle.innerText = discipline;
            disciplineTitle.onclick = () => {
                const disciplineElement = Array.from(document.querySelectorAll('.module-item')).find(item => item.innerText === discipline);
                showSub(discipline, disciplineElement || document.querySelector('.module-item'));
            };
            internalList.appendChild(disciplineTitle);
            Object.keys(DATA[discipline]).forEach(category => {
                const categoryItem = document.createElement('li');
                categoryItem.className = 'internal-category';
                categoryItem.innerText = category;
                internalList.appendChild(categoryItem);
                DATA[discipline][category].forEach(tool => {
                    const item = document.createElement('li');
                    item.className = 'internal-item';
                    item.innerText = tool;
                    item.onclick = () => openSearch(tool, discipline);
                    internalList.appendChild(item);
                });
            });
        });
    }

    function renderAllInternalProMenus() {
        const list = document.getElementById('pro-list');
        if (!list) return;
        list.innerHTML = '';
        PRO_MODULES.forEach(module => {
            const data = PRO_MODULE_DATA[module];
            const li = document.createElement('li');
            const button = document.createElement('div');
            button.className = 'pro-item';
            button.innerText = module;
            button.onclick = () => toggleProModule(module, li, button);
            li.appendChild(button);
            const sublist = document.createElement('ul');
            sublist.className = 'pro-sublist';
            data.items.forEach(itemName => {
                const subitem = document.createElement('li');
                subitem.className = 'pro-subitem';
                subitem.innerText = itemName;
                subitem.onclick = (event) => {
                    event.stopPropagation();
                    document.querySelectorAll('.pro-subitem').forEach(item => item.classList.remove('active'));
                    subitem.classList.add('active');
                    openProCard(itemName, module);
                };
                sublist.appendChild(subitem);
            });
            li.appendChild(sublist);
            list.appendChild(li);
        });
    }

    function toggleProModule(module, li, button) {
        document.body.dataset.activeMenu = 'pro';
        document.querySelector('.sidebar').classList.add('pro-active');
        document.querySelectorAll('.pro-item').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        document.querySelectorAll('.pro-sublist').forEach(list => {
            if (list !== li.querySelector('.pro-sublist')) list.classList.remove('open');
        });
        li.querySelector('.pro-sublist').classList.toggle('open');
        showProfessionalModule(module, button);
    }

    function showSub(k, el) {
        document.body.dataset.activeMenu = 'discipline';
        document.querySelector('.sidebar').classList.remove('pro-active');
        lastDisciplineKey = k;
        lastDisciplineElement = el;
        document.querySelectorAll('.module-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        const mn = document.getElementById('mn');
        const subs = DATA[k];
        let html = `<div class="content"><h1>${k}</h1>`;
        Object.keys(subs).forEach(cat => {
            html += `<div class="category-group"><div class="category-title">${cat}</div><div class="tools-grid">`;
            subs[cat].forEach(tool => {
                html += `<div class="tool-card" onclick="openSearch('${tool}', '${k}')"><h4>${tool}</h4></div>`;
            });
            html += `</div></div>`;
        });
        mn.innerHTML = html + `</div>`;
    }

    function openSearch(tool, disc) {
        const mn = document.getElementById('mn');
        mn.innerHTML = `
            <button class="back-arrow" onclick="showSub('${disc}', document.querySelector('.module-item.active'))" title="Voltar para a tela anterior">← VOLTAR</button>
            <div class="split-view">
                <article class="topic-paper">
                    <div class="category-title">${disc}</div>
                    <h2>${tool}</h2>
                    <div class="paper-space">
                        <div class="study-placeholder">O conteúdo deste estudo será inserido aqui.</div>
                    </div>
                </article>
                <aside class="ai-chat-panel">
                    <header class="ai-chat-header">
                        <h3>MESA DE INVESTIGAÇÃO</h3>
                        <p><strong>${tool}</strong><br>O estudo em análise permanece disponível no painel de leitura.<br>Utilize esta mesa para aprofundar questões relacionadas ao tema selecionado.</p>
                    </header>
                    <div class="ai-chat-messages">
                        <div class="ai-chat-welcome"><strong>Consulta de pesquisa</strong><br><br>Aguardando a sua questão de investigação.</div>
                        <div id="rs" class="ai-chat-answer"></div>
                    </div>
                    <div class="ai-chat-input">
                        <div class="question-row">
                            <input type="text" id="q" placeholder="Escreva a sua questão de investigação...">
                            <button id="b" onclick="run('${tool}', '${disc}')">ENVIAR</button>
                        </div>
                        <div id="ld" class="ai-chat-loading">Análise contextual assistida por inteligência artificial...</div>
                    </div>
                </aside>
            </div>`;
        renderProMenu();
    }

    async function run(t, d) {
        const q = document.getElementById('q').value.trim();
        if (!q) return;
        if (!AI_PROXY_URL || AI_PROXY_URL.includes('COLE_AQUI')) {
            alert('Primeiro configure a URL do serviço protegido no código do site.');
            return;
        }

        const btn = document.getElementById('b');
        const ld = document.getElementById('ld');
        const rs = document.getElementById('rs');
        btn.disabled = true;
        ld.style.display = 'block';
        rs.style.display = 'none';

        try {
            const r = await fetch(AI_PROXY_URL.replace(/\/$/, '') + '/api/pesquisa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    question: q,
                    topic: t,
                    discipline: d,
                    module: document.querySelector('.pro-item.active')?.innerText || ''
                })
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error || 'Erro no serviço de pesquisa');
            rs.textContent = data.text || 'A consulta não devolveu texto.';
            rs.style.display = 'block';
            rs.scrollIntoView({ behavior: 'smooth' });
        } catch (e) {
            alert('ERRO TÉCNICO: ' + e.message);
        } finally {
            btn.disabled = false;
            ld.style.display = 'none';
        }
    }
    init();
</script>
