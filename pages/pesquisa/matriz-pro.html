<style>

<body>
<header>
  <div>
    <h1>MÉTODO TÉCNICO DE PESQUISA</h1>

<main>

    <div class="ptitle">MÓDULOS DO MÉTODO</div>
    <div id="menu"></div>

  <section class="panel chat">
    <div class="ptitle">MESA DE ANÁLISE PRO</div>
    <div id="msgs"></div>
    <form id="form">
      <textarea id="q" placeholder="Ex.: Romanos 3:21-26 ou o tema da justificação" aria-label="Tema ou referência bíblica"></textarea>

<script>
/* ---------- Conexões ---------- */
const sb = window.supabase.createClient("https://qmhdbuxomozdczgvpvcc.supabase.co","sb_publishable_5jVrL8dyVBg0YOfo_q4ppA_yLMOjTz8");
const WORKER = "https://yellow-lab-f4b2.palavraeserie.workers.dev";
const CHECKOUT = {PRO:"https://pay.kiwify.com.br/4m4qdH7",MASTER:"https://pay.kiwify.com.br/9aANGEG",DOCTUS:"https://pay.kiwify.com.br/tqJboGn"};
const NEXT = {FREE:"PRO",PRO:"MASTER",MASTER:"DOCTUS"};
const RANK = {FREE:0,PRO:1,MASTER:2,DOCTUS:3};
const L = {F:"FREE",P:"PRO",M:"MASTER",D:"DOCTUS"};
let plan = "FREE";
 
/* ---------- Menu: [módulo, nível de cada subetapa (F/P/M/D), subetapas] ---------- */
const MENU = [
["01 — TEXTO BÍBLICO","FFPPPPPPPMPM","Livro|Capítulo|Perícope|Versículo|Unidade de Sentido|Palavra|Texto Hebraico|Texto Grego|Texto da Septuaginta (LXX)|Identificação preliminar de tradições textuais divergentes|Palavras e Construções no Original|Determinação do Texto-Base"],
["02 — CRÍTICA TEXTUAL","PPPPMMMMMMMD","Identificação da variante textual|Localização da variante|Testemunhos textuais|Manuscritos e versões envolvidos|Evidências externas|Evidências internas|Comparação das leituras|Aparato crítico|Avaliação da variante|Impacto na tradução|Impacto na interpretação|Determinação textual"],
["03 — GRAMÁTICA E SINTAXE","PPPPPPPPMMMMMMMM","Identificação da construção|Morfologia|Lema e forma lexical|Classe gramatical|Sujeito|Predicado|Objeto|Verbos|Tempo e aspecto|Voz|Modo|Construções gramaticais|Relações sintáticas|Conectivos|Relações entre cláusulas|Estrutura da frase (síntese)"],
["04 — LÉXICO","PPPPPPPMMMMMM","Identificação da palavra|Forma encontrada no texto|Lema|Transliteração|Classe gramatical|Definições lexicais|Usos da palavra|Campo semântico|Uso no contexto|Uso no Antigo Testamento|Uso no Novo Testamento|Comparação das evidências lexicais|Sentido provável no contexto"],
["05 — LÉXICO TEOLÓGICO","MMMMMMMMMDDM","Identificação do conceito|Termo no texto|Base lexical do conceito|Uso no Antigo Testamento|Uso na Septuaginta|Uso no Judaísmo|Uso no Novo Testamento|Desenvolvimento do conceito|Relações teológicas|Comparação das evidências|Síntese do conceito teológico|Relação com o contexto da passagem"],
["06 — EXEGESE","PPPPPPPMMMMMDD","Delimitação da passagem|Contexto imediato|Estrutura da passagem|Argumento da passagem|Contexto literário|Gênero literário|Relação entre versículos|Relações entre unidades de pensamento|Intenção comunicativa|Problemas interpretativos|Interpretações existentes|Argumentos das interpretações|Avaliação exegética|Síntese exegética"],
["07 — CONTEXTO HISTÓRICO-CULTURAL","PPPPPPPMMMMMMMD","Identificação do contexto histórico|Período histórico|Localização geográfica|Contexto político|Contexto religioso|Contexto social|Costumes e práticas|Instituições e estruturas sociais|Cultura e valores|Mundo greco-romano|Antigo Oriente Próximo|Judaísmo e contexto religioso|Arqueologia e evidências materiais|Literatura e fontes extrabíblicas|Impacto do contexto na interpretação"],
["08 — HERMENÊUTICA E CONTROLE DE ERROS","MMMMMMMMMMMDMDD","Identificação dos pressupostos|Controle do contexto|Controle do sentido lexical|Controle gramatical e sintático|Controle do contexto histórico-cultural|Detecção de eisegese|Detecção de anacronismo|Detecção de falácia lexical|Detecção de descontextualização|Controle de alegorização indevida|Controle de generalização indevida|Controle da relação AT–NT|Descrição versus prescrição|Coerência da interpretação com as evidências|Veredito hermenêutico"],
["09 — TEOLOGIA BÍBLICA","MMMMMMMMMMMMMDD","Localização do tema na passagem|Relação com o contexto canônico|História da redenção|Desenvolvimento da revelação|Temas bíblicos relacionados|Relação com o Antigo Testamento|Relação com o Novo Testamento|Promessa e cumprimento|Alianças e desenvolvimento pactual|Criação, queda e redenção|Reino de Deus|Relação com Cristo|Consumação|Trajetória do tema na Escritura|Síntese teológico-bíblica"],
["10 — USO DO AT NO NT","MMMMMMMMMMMMDDD","Identificação da referência ao AT|Citação explícita|Alusão|Eco textual ou temático|Identificação da passagem de origem|Comparação com o texto hebraico|Comparação com a Septuaginta|Comparação com o texto grego do NT|Contexto da passagem do AT|Forma como o NT utiliza o AT|Função teológica da referência|Relação com promessa e cumprimento|Relação cristológica|Impacto na interpretação do NT|Síntese do uso do AT no NT"],
["11 — TEOLOGIA SISTEMÁTICA","MMMMMMDDDDDDD","Identificação da questão doutrinária|Dados doutrinários encontrados no texto|Relação com a teologia bíblica|Relação com outras passagens bíblicas|Doutrinas relacionadas|Formulações teológicas existentes|Comparação das formulações|Pressupostos teológicos|Convergências|Divergências|Avaliação da coerência doutrinária|Limites da conclusão doutrinária|Síntese doutrinária"],
["12 — COMPARAÇÃO DE INTERPRETAÇÕES","MMMMMMMDDDDDDD","Identificação das interpretações existentes (N)|Classificação das interpretações|Argumentos de cada interpretação (N)|Evidências textuais|Evidências gramaticais e lexicais|Evidências históricas e culturais|Evidências teológicas|Pressupostos de cada interpretação|Pontos de convergência|Pontos de divergência|Grau de consenso|Força das evidências|Limites da conclusão|Síntese comparativa"]
];
 
function renderMenu(){
  const root = document.getElementById("menu");
  root.innerHTML = "";
  MENU.forEach(([name, levels, labels], mi) => {
    const box = document.createElement("div");
    box.className = "mod";
    const head = document.createElement("button");
    head.type = "button";
    head.textContent = name;
    head.onclick = () => {
      const was = box.classList.contains("open");
      document.querySelectorAll(".mod").forEach(m => m.classList.remove("open"));
      if (!was) box.classList.add("open");
    };
    const steps = document.createElement("div");
    steps.className = "steps";
    labels.split("|").forEach((label, i) => {
      const level = L[levels[i]];
      const locked = RANK[plan] < RANK[level];
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step" + (locked ? " locked" : "");
      const t = document.createElement("span");
      t.textContent = (mi + 1 < 10 ? "0" : "") + (mi + 1) + "." + (i + 1) + " — " + label;
      const lv = document.createElement("span");
      lv.className = "lv";
      lv.dataset.l = level;
      lv.textContent = level;
      b.append(t, lv);
      b.onclick = e => {
        e.stopPropagation();
        document.querySelectorAll(".step").forEach(s => s.classList.remove("sel"));
        b.classList.add("sel");
      };
      steps.appendChild(b);
    });
    box.append(head, steps);
    root.appendChild(box);
  });
}
 
/* ---------- Plano do usuário ---------- */
async function loadPlan(){
  try{
    const {data} = await sb.auth.getSession();
    if(data && data.session){
      const r = await sb.from("profiles").select("plano").eq("id", data.session.user.id).single();
      if(r.data) plan = String(r.data.plano || "FREE").toUpperCase();
    }
  }catch(e){ console.error("Erro ao buscar plano:", e); }
  if(!(plan in RANK)) plan = "FREE";
  document.getElementById("badge").textContent = "PLANO: " + plan;
  const up = document.getElementById("upgrade");
  if(plan === "DOCTUS"){ up.style.display = "none"; }
  else{ up.style.display = "inline-block"; up.href = CHECKOUT[NEXT[plan]]; }
  renderMenu();
}
 
/* ---------- Chat ---------- */
const KEY = "palavraSerieMatrizProChatLivre";
const msgsEl = document.getElementById("msgs");
const qEl = document.getElementById("q");
const sendEl = document.getElementById("send");
let history = [];
let busy = false;
try{ history = JSON.parse(localStorage.getItem(KEY) || "[]"); }catch(e){ history = []; }
 
function saveHistory(){ try{ localStorage.setItem(KEY, JSON.stringify(history)); }catch(e){} }
 
function renderChat(){
  msgsEl.innerHTML = "";
  if(!history.length){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Digite um tema ou uma referência bíblica (por exemplo, Romanos 3:21-26) e clique em Enviar.";
    msgsEl.appendChild(p);
    return;
  }
  history.forEach(h => {
    const d = document.createElement("div");
    d.className = "m " + h.r;
    d.textContent = h.t;
    msgsEl.appendChild(d);
  });
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
 
async function send(){
  const q = qEl.value.trim();
  if(!q || busy) return;
  busy = true; sendEl.disabled = true; sendEl.textContent = "PROCESSANDO...";
  history.push({r:"user", t:q});
  const reply = {r:"bot", t:"Consultando..."};
  history.push(reply);
  qEl.value = "";
  renderChat();
  try{
    const {data} = await sb.auth.getSession();
    const s = data && data.session;
    if(!s || !s.access_token) throw new Error("Sessão não encontrada. Faça login novamente.");
    const r = await fetch(WORKER + "/api/pesquisa", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer " + s.access_token},
      body: JSON.stringify({
        mode:"writing_private",
        accessLevel:"private",
        question:q,
        topic:"CONSULTA LIVRE",
        module:"",
        stepCode:"",
        requiredLevel:"FREE",
        discipline:"MÉTODO TÉCNICO DE PESQUISA"
      })
    });
    let d = {};
    try{ d = await r.json(); }catch(e){}
    if(r.status === 401){ await sb.auth.signOut(); throw new Error("Sua sessão expirou. Entre novamente."); }
    if(!r.ok) throw new Error(d.error || "Não foi possível concluir a consulta.");
    reply.t = d.text || d.answer || d.response || d.result || "A consulta não devolveu conteúdo.";
  }catch(e){
    reply.t = e.message || "Não foi possível realizar a consulta.";
  }finally{
    busy = false; sendEl.disabled = false; sendEl.textContent = "ENVIAR";
    saveHistory(); renderChat(); qEl.focus();
  }
}
 
document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); send(); });
qEl.addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); } });
document.getElementById("clear").onclick = () => { history = []; saveHistory(); renderChat(); };
 
renderMenu();
renderChat();
loadPlan();
</script>
 
<script>
(function(){
  var URL_ = "https://qmhdbuxomozdczgvpvcc.supabase.co", KEY_ = "sb_publishable_5jVrL8dyVBg0YOfo_q4ppA_yLMOjTz8", done = false;
  function registrar(pais, cidade){
    if(done) return; done = true;
    try{

      if(!vid){
        vid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(16).slice(2);
        localStorage.setItem("ps_visitante_id", vid);
      }
      var p = {pagina:"Método Técnico de Pesquisa", visitante_id:vid};
      if(pais) p.pais = pais;
      if(cidade) p.cidade = cidade;
      fetch(URL_ + "/rest/v1/visitas", {method:"POST", headers:{"apikey":KEY_,"Authorization":"Bearer " + KEY_,"Content-Type":"application/json","Prefer":"return=minimal"}, body:JSON.stringify(p)}).catch(function(){});
    }catch(e){}
  }
  setTimeout(function(){ registrar(null, null); }, 2500);
  fetch("https://ipapi.co/json/").then(function(r){return r.json()}).then(function(i){ registrar(i && i.country_name, i && i.city); }).catch(function(){ registrar(null, null); });
})();
</script>
