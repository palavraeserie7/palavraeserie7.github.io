<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo — Consulta Geral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,560;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0b1428;
      --panel:#111b30;
      --border:#263754;
      --text:#dbe7f5;
      --muted:#91a4bd;

      --paper:#f4eedd;
      --paper-card:#fbf7ec;
      --paper-line:#ddcea4;
      --ink:#2c2418;
      --ink-soft:#6c5c42;
      --brass:#9c7a32;
      --brass-deep:#7c5f26;
      --brass-wash:#ede0bd;
      --navy:#0e1526;
      --navy-soft:#1b2740;
      --verified:#4b6b4e;

      --font-display:'Fraunces',Georgia,serif;
      --font-body:'Inter','Segoe UI',Tahoma,sans-serif;

      --accent:var(--brass);
      --paper-border:var(--paper-line);
    }

    * { box-sizing:border-box; }

    html, body {
      margin:0;
      width:100%;
      min-height:100%;
    }

    body {
      min-height:100vh;
      background:var(--paper);
      color:var(--text);
      font-family:var(--font-body);
      -webkit-font-smoothing:antialiased;
    }

    :focus-visible {
      outline:2px solid var(--brass);
      outline-offset:2px;
    }

    @media (prefers-reduced-motion:reduce) {
      * { transition-duration:.01ms !important; animation-duration:.01ms !important; }
    }

    .oracle-page {
      min-height:100vh;
      width:100%;
      padding:18px 0 0;
      background:var(--paper);
    }

    .oracle-content {
      width:100%;
      margin:0;
    }

    .back-arrow {
      display:inline-flex;
      align-items:center;
      gap:6px;
      min-height:34px;
      margin:0 0 16px 3.8%;
      padding:0 14px;
      border:1px solid var(--navy-soft);
      border-radius:6px;
      background:var(--navy);
      color:#dbe7f5;
      font-family:var(--font-body);
      font-weight:600;
      font-size:13px;
      cursor:pointer;
      text-decoration:none;
      transition:background .15s ease;
    }

    .back-arrow:hover {
      background:var(--navy-soft);
      color:#fff;
    }

    .oracle-chat-panel {
      width:92.4%;
      margin:0 auto;
      overflow:hidden;
      border:1px solid var(--paper-line);
      border-radius:10px;
      background:var(--paper);
      color:var(--ink);
      box-shadow:0 18px 40px rgba(14,21,38,.16);
    }

    .ai-chat-header {
      padding:28px 32px 20px;
      border-bottom:1px solid var(--paper-line);
      background:var(--paper-card);
    }

    .ai-chat-header h1 {
      margin:0 0 12px;
      color:var(--ink);
      font-family:var(--font-display);
      font-weight:650;
      font-size:clamp(24px,3.6vw,34px);
      letter-spacing:.2px;
    }

    .ai-chat-header p {
      max-width:640px;
      margin:0;
      color:var(--ink-soft);
      font-size:14.5px;
      line-height:1.65;
    }

    .oracle-trust-note {
      margin:16px 32px 12px;
      padding:12px 14px;
      border-left:2px solid var(--brass);
      background:var(--brass-wash);
      color:var(--ink-soft);
      font-size:12px;
      line-height:1.6;
    }

    .oracle-trust-note strong {
      color:var(--ink);
    }

    .ai-chat-messages {
      min-height:300px;
      max-height:52vh;
      overflow-y:auto;
      padding:0 28px 18px;
    }

    /* =========================================================
       ÍNDICE LATERAL DE 36 ÁREAS
       ========================================================= */

    .oracle-index-trigger {
      position:fixed;
      left:0;
      top:50%;
      z-index:1000;
      transform:translateY(-50%);
      padding:13px 10px;
      border:1px solid var(--navy-soft);
      border-left:0;
      border-radius:0 8px 8px 0;
      background:var(--navy);
      color:#dbe7f5;
      font-family:var(--font-body);
      font-size:11px;
      font-weight:600;
      letter-spacing:.06em;
      writing-mode:vertical-rl;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(14,21,38,.3);
      transition:background .15s ease, padding .15s ease;
    }

    .oracle-index-trigger:hover {
      background:var(--navy-soft);
      color:#fff;
      padding-right:14px;
    }

    .oracle-index-overlay {
      position:fixed;
      inset:0;
      z-index:1001;
      display:none;
      background:rgba(14,21,38,.45);
      backdrop-filter:blur(1px);
    }

    .oracle-index-overlay.active {
      display:block;
    }

    .oracle-index-panel {
      position:absolute;
      left:0;
      top:0;
      bottom:0;
      width:min(420px,88vw);
      overflow-y:auto;
      padding:26px 24px 30px;
      background:var(--paper-card);
      color:var(--ink);
      box-shadow:16px 0 40px rgba(14,21,38,.28);
    }

    .oracle-index-header {
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap:10px;
      margin-bottom:6px;
      padding-bottom:16px;
      border-bottom:2px
