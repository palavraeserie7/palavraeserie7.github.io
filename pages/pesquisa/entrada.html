

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>
<title>Entrar — Palavra &amp; Série</title>
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 
<style>
:root {
  --bg: #0b1428;
  --panel: #111b30;
  --text: #dbe7f5;
  --muted: #91a4bd;
  --line: #536780;
  --green: #20d66b;
  --danger: #e5716a;
  --gold: #c9a66b;
}
* {
  box-sizing: border-box;
}
body {
  min-height: 100vh;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    linear-gradient(rgba(5, 11, 24, .16), rgba(5, 11, 24, .28)),
    url("entrada-sala-escritor.png") center center / contain no-repeat fixed;
  background-color: #050b18;
  color: var(--text);
  font-family:
    "Segoe UI",
    Tahoma,
    sans-serif;
}
.login-page {
  position: relative;
  z-index: 1;
  width: min(410px, 100%);
}
.login-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 10px;
}
.brand {
  color: var(--green);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1.7px;
  text-transform: uppercase;
}
.back-link {
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font-size: 10px;
  font-weight: 800;
  text-decoration: none;
}
.back-link:hover,
.back-link:focus-visible {
  border-color: var(--green);
  color: #fff;
  outline: none;
}
.login-card {
  padding: 20px;
  border: 1px solid rgba(201, 166, 107, .42);
  border-radius: 9px;
  background: rgba(11, 20, 40, .52);
  box-shadow: 0 14px 40px rgba(0, 0, 0, .38);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
.login-card h1 {
  margin: 0 0 8px;
  color: var(--gold);
  font-size: 18px;
  letter-spacing: 1px;
}
.login-card > p {
  margin: 0;
  color: #b8c9dc;
  line-height: 1.6;
}
.login-form {
  display: block;
  margin-top: 15px;
}
.field {
  margin-bottom: 16px;
}
.field label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.field input {
  width: 100%;
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #0c1730;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
}
.field input:focus {
  border-color: var(--green);
  outline: none;
}
.field input:disabled {
  opacity: .6;
}
.submit-btn {
  display: block;
  width: 100%;
  margin-top: 6px;
  padding: 13px 14px;
  border: 1px solid var(--green);
  border-radius: 7px;
  background: rgba(32, 214, 107, .08);
  color: var(--green);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 1.3px;
  text-transform: uppercase;
  cursor: pointer;
  font-family: inherit;
}
.submit-btn:hover:not(:disabled),
.submit-btn:focus-visible:not(:disabled) {
  background: rgba(32, 214, 107, .16);
  color: #fff;
  outline: none;
}
.submit-btn:disabled {
  opacity: .55;
  cursor: not-allowed;
}
.form-message {
  display: none;
  margin-top: 16px;
  padding: 10px 12px;
  border-left: 3px solid var(--danger);
  background: rgba(229, 113, 106, .08);
  color: #f2b6b1;
  font-size: 12px;
  line-height: 1.5;
}
.form-message.visible {
  display: block;
}
.form-message.success {
  border-left-color: var(--green);
  background: rgba(32, 214, 107, .08);
  color: var(--green);
}
@media (max-width: 600px) {
  body {
    place-items: start center;
    padding: 16px;
    background-attachment: scroll;
    background-position: center top;
    background-size: contain;
  }
  .login-card {
    padding: 18px;
  }
  .login-header {
    align-items: flex-start;
    flex-direction: column;
  }
}
</style>
</head>
<body>
<main class="login-page">
  <header class="login-header">
    <div class="brand">
      PALAVRA &amp; SÉRIE · ACESSO
    </div>
    <a
      class="back-link"
      href="index.html"
    >
      ← VOLTAR À PESQUISA
    </a>
  </header>
  <section
    class="login-card"
    aria-labelledby="login-title"
  >
    <h1 id="login-title">
      ENTRAR
    </h1>
    <p>
      Aceda à Sala do Escritor e às ferramentas internas
      de criação da plataforma.
    </p>
 
    <form
      class="login-form"
      id="loginForm"
      novalidate
    >
      <div class="field">
        <label for="email">
          E-mail
        </label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="username"
          required
        >
      </div>
 
      <div class="field">
        <label for="password">
          Senha
        </label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        >
      </div>
 
      <button
        type="submit"
        id="submitBtn"
        class="submit-btn"
      >
        ENTRAR
      </button>
 
      <div
        id="formMessage"
        class="form-message"
        role="alert"
      ></div>
    </form>
  </section>
</main>
 
<script>
 
/* =====================================================
   SUPABASE
===================================================== */
 
const SUPABASE_URL =
  "https://qmhdbuxomozdczgvpvcc.supabase.co";
 
const SUPABASE_ANON_KEY =
  "sb_publishable_5jVrL8dyVBg0YOfo_q4ppA_yLMOjTz8";
 
const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );
 
 
/* =====================================================
   ELEMENTOS
===================================================== */
 
const loginForm =
  document.getElementById("loginForm");
 
const emailInput =
  document.getElementById("email");
 
const passwordInput =
  document.getElementById("password");
 
const submitBtn =
  document.getElementById("submitBtn");
 
const formMessage =
  document.getElementById("formMessage");
 
 
/* =====================================================
   MENSAGEM
===================================================== */
 
function showMessage(text, type){
 
  formMessage.textContent =
    text;
 
  formMessage.className =
    "form-message visible" +
    (type === "success" ? " success" : "");
 
}
 
function hideMessage(){
 
  formMessage.className =
    "form-message";
 
}
 
 
/* =====================================================
   TRADUÇÃO DE ERROS COMUNS
===================================================== */
 
function traduzirErro(error){
 
  const msg =
    String(error?.message || "").toLowerCase();
 
  if(msg.includes("invalid login credentials")){
    return "E-mail ou senha incorretos.";
  }
 
  if(msg.includes("email not confirmed")){
    return "Este e-mail ainda não foi confirmado.";
  }
 
  if(msg.includes("too many requests")){
    return "Muitas tentativas. Aguarde um momento e tente novamente.";
  }
 
  return error?.message ||
    "Não foi possível entrar. Tente novamente.";
 
}
 
 
/* =====================================================
   ENVIO DO FORMULÁRIO
===================================================== */
 
loginForm.addEventListener(
  "submit",
  async function(event){
 
    event.preventDefault();
 
    hideMessage();
 
    const email =
      emailInput.value.trim();
 
    const password =
      passwordInput.value;
 
    if(!email || !password){
 
      showMessage(
        "Preencha e-mail e senha.",
        "error"
      );
 
      return;
 
    }
 
 
    submitBtn.disabled = true;
    submitBtn.textContent = "ENTRANDO...";
 
    emailInput.disabled = true;
    passwordInput.disabled = true;
 
 
    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email,
          password
        });
 
 
    if(error){
 
      submitBtn.disabled = false;
      submitBtn.textContent = "ENTRAR";
 
      emailInput.disabled = false;
      passwordInput.disabled = false;
 
      showMessage(
        traduzirErro(error),
        "error"
      );
 
      return;
 
    }
 
 
    if(data?.session){
 
      showMessage(
        "Sessão iniciada. A abrir a Sala do Escritor...",
        "success"
      );
 
      window.location.href =
        "sala-do-escritor.html";
 
    }
 
  }
);
 
 
/* =====================================================
   SE JÁ HOUVER SESSÃO ATIVA, PULA DIRETO PARA A SALA
===================================================== */
 
async function verificarSessaoExistente(){
 
  const {
    data
  } =
    await supabaseClient
      .auth
      .getSession();
 
  if(data?.session){
 
    window.location.href =
      "sala-do-escritor.html";
 
  }
 
}
 
verificarSessaoExistente();
 
</script>
</body>
</html>
