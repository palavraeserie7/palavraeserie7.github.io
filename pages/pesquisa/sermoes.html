```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sermões — Palavra & Série</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        body {
            min-height: 100vh;
        }

        /* =========================
           ESTRUTURA DA PÁGINA
           ========================= */

        .pagina {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           CABEÇALHO
           ========================= */

        .cabecalho {
            width: 100%;
            padding: 22px 30px;
            background: #111;
            color: #fff;
        }

        .cabecalho h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .cabecalho p {
            margin: 6px 0 0;
            font-size: 12px;
            opacity: 0.7;
            letter-spacing: 1px;
        }

        /* =========================
           CONTEÚDO
           ========================= */

        .conteudo {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 60px 20px;
        }

        .analise {
            width: 100%;
            max-width: 600px;
        }

        .analise-titulo {
            margin: 0 0 30px;
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* =========================
           MENU DE ANÁLISE
           ========================= */

        .menu-analise {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-analise {
            width: 100%;
            padding: 18px 22px;
            border: 1px solid #d6d6d6;
            border-radius: 6px;
            background: #fff;
            color: #222;
            font-size: 17px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .item-analise:hover {
            background: #eeeeee;
        }

        .item-analise:active {
            transform: translateY(1px);
        }

        /* =========================
           ÁREA DE RESULTADO
           ========================= */

        #resultado {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: #fff;
            display: none;
        }

        #resultado h2 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        #resultado p {
            margin: 0;
            color: #666;
        }

        /* =========================
           RODAPÉ
           ========================= */

        .rodape {
            padding: 20px;
            text-align: center;
            font-size: 11px;
            color: #888;
        }

        /* =========================
           CELULAR
           ========================= */

        @media (max-width: 600px) {

            .cabecalho {
                padding: 18px 20px;
            }

            .conteudo {
                padding: 40px 16px;
            }

            .analise-titulo {
                font-size: 24px;
            }

            .item-analise {
                padding: 16px 18px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="pagina">

        <!-- CABEÇALHO -->
        <header class="cabecalho">
            <h1>PALAVRA & SÉRIE</h1>
            <p>SERMÕES</p>
        </header>


        <!-- CONTEÚDO PRINCIPAL -->
        <main class="conteudo">

            <section class="analise">

                <h2 class="analise-titulo">
                    ANÁLISE
                </h2>


                <!-- MENU -->
                <div class="menu-analise">

                    <button
                        class="item-analise"
                        type="button"
                        onclick="abrirAnalise('Livro')">
                        Livro
                    </button>

                    <button
                        class="item-analise"
                        type="button"
                        onclick="abrirAnalise('Capítulo')">
                        Capítulo
                    </button>

                    <button
                        class="item-analise"
                        type="button"
                        onclick="abrirAnalise('Perícope')">
                        Perícope
                    </button>

                    <button
                        class="item-analise"
                        type="button"
                        onclick="abrirAnalise('Versículo')">
                        Versículo
                    </button>

                    <button
                        class="item-analise"
                        type="button"
                        onclick="abrirAnalise('Unidade de Sentido')">
                        Unidade de Sentido
                    </button>

                    <button
                        class="item-analise"
                        type="button"
                        onclick="abrirAnalise('Palavra')">
                        Palavra
                    </button>

                </div>


                <!-- RESULTADO TEMPORÁRIO -->
                <div id="resultado">
                    <h2 id="resultadoTitulo"></h2>
                    <p id="resultadoTexto">
                        Esta etapa será construída posteriormente.
                    </p>
                </div>

            </section>

        </main>


        <!-- RODAPÉ -->
        <footer class="rodape">
            Palavra & Série
        </footer>

    </div>


    <!-- JAVASCRIPT MÍNIMO -->
    <script>
        function abrirAnalise(etapa) {

            const resultado = document.getElementById('resultado');
            const titulo = document.getElementById('resultadoTitulo');

            titulo.textContent = etapa;

            resultado.style.display = 'block';
        }
    </script>

</body>
</html>
```
