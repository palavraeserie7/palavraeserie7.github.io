#pcEstrutura .pc-abas button[data-pend="aviso"]::after{content:" ●";color:#c98a1b}
#pcEstrutura .pc-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#pcEstrutura .pc-cx{min-width:0}
#pcEstrutura .pc-cx[hidden]{display:none!important}
#pcEstrutura .pc-wide{grid-column:1/-1}

#pcEstrutura label{display:flex;flex-direction:column;gap:5px;font:700 12px "Segoe UI",Arial,sans-serif;color:var(--ink-soft)}

        lib.lista.push({id:novoId(), nome:(ant.titulo || "Plano anterior"), criado:t0, atualizado:t0, plano:ant});
        if(gravarLib()) setTimeout(function(){ msg("Seu plano anterior foi guardado na lista de planos."); }, 0);
      }
    }catch(e){}
  }
  renderLib();
  if(lib.lista.length){ var rec = lib.lista.slice().sort(function(a, b){ return b.atualizado - a.atualizado; })[0]; abrir(rec.id, true); }
})();
</script>
