<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudos · Palavra e Série</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a06; --panel:#17110a; --line:#3a2c14; --gold:#d4a132; --gold-d:#9c761f;
  --text:#f1ead8; --muted:#a89c82; --ok:#1fcf6b;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:Georgia,"Times New Roman",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse 80% 420px at 50% 0,#2a1d08 0,transparent 70%),var(--bg);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.7}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header.top{border-bottom:1px solid var(--line);background:radial-gradient(ellipse 60% 100% at 25% 40%,rgba(212,161,50,.22),transparent 70%),linear-gradient(180deg,#1a1208,#0d0a06)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.top .wrap{display:flex;gap:20px;align-items:center;padding-top:22px;padding-bottom:20px}
.logo{flex:none;width:76px;height:76px;border-radius:50%;background:#000;border:3px solid var(--gold);box-shadow:0 0 22px rgba(212,161,50,.55);display:grid;place-items:center;font-family:"Times New Roman",serif;font-style:italic;font-weight:700;font-size:1.8rem;color:var(--gold);text-decoration:none}
.brand{display:block;font-family:"Times New Roman",Times,serif;font-size:2rem;font-weight:700;letter-spacing:.14em;color:var(--gold);text-decoration:none;line-height:1.1;padding-bottom:8px;border-bottom:1px solid var(--gold)}
.brand-sub{font-family:"Times New Roman",Times,serif;font-size:1.05rem;margin:8px 0 2px;color:var(--text)}
.brand-tag{font-family:"Times New Roman",Times,serif;font-size:.85rem;color:var(--gold-d);margin:0;filter:brightness(1.3)}
nav.menu{border-bottom:1px solid var(--line);background:#0d0a06}
nav.menu .wrap{display:flex;flex-wrap:wrap;gap:6px 22px;padding-top:10px;padding-bottom:10px}
nav.menu a{font-family:var(--ui);font-size:.8rem;font-weight:600;color:var(--text);text-decoration:none}
nav.menu a:hover{color:var(--gold)}
@media (max-width:560px){.brand{font-size:1.35rem}.logo{width:60px;height:60px;font-size:1.4rem}}
main{padding:36px 0 72px}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
h1{font-size:2.6rem;font-weight:700}
h2{font-size:1.7rem;font-weight:600;color:var(--gold);margin:44px 0 12px}
h3{font-size:1.25rem;font-weight:600;margin:0 0 4px}
p{margin:0 0 14px}
.sub{font-family:var(--ui);font-size:.9rem;color:var(--muted);margin:8px 0 0}
.lead{border-left:3px solid var(--gold);background:var(--panel);padding:16px 20px;margin:28px 0;font-size:1.1rem}
.mensagem{font-size:1.15rem}
.vs{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.vs li{background:var(--panel);border:1px solid var(--line);padding:12px 16px}
.vs b{font-family:var(--ui);font-size:.8rem;color:var(--gold);display:block;margin-bottom:2px}
.grupos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grupos div{border-top:2px solid var(--gold-d);padding-top:8px}
.grupos b{font-family:var(--serif);font-size:1.15rem;display:block}
.grupos span{font-size:.95rem;color:var(--muted)}
.aprof{margin-top:44px;border:1px solid var(--gold-d);background:var(--panel)}
.aprof summary{cursor:pointer;padding:18px 20px;font-family:var(--serif);font-size:1.5rem;font-weight:600;color:var(--gold);list-style:none}
.aprof summary::-webkit-details-marker{display:none}
.aprof summary::after{content:"＋";float:right;font-family:var(--ui)}
.aprof[open] summary::after{content:"－"}
.aprof .inner{padding:0 20px 20px}
.aprof h2{font-size:1.3rem;margin:26px 0 10px}
.palavra{border-top:1px solid var(--line);padding:12px 0}
.palavra .heb{font-size:1.6rem;direction:rtl;unicode-bidi:isolate;color:var(--gold);margin-right:10px}
.palavra .tr{font-style:italic}
.palavra small{display:block;font-family:var(--ui);font-size:.8rem;color:var(--muted)}
.tri{display:grid;gap:12px}
.tri div{background:var(--bg);border:1px solid var(--line);padding:12px 16px}
.tri b{font-family:var(--ui);font-size:.8rem;color:var(--gold)}
.cta{margin-top:48px;padding:24px;background:var(--panel);border:1px solid var(--line);text-align:center}
.cta p{margin-bottom:16px}
.btn{display:inline-block;font-family:var(--ui);font-weight:700;font-size:.9rem;text-decoration:none;padding:12px 22px;margin:4px;border:1px solid var(--gold)}
.btn.main{background:var(--ok);border-color:var(--ok);color:#06210f}
.btn.sec{color:var(--gold)}
.btn:hover{filter:brightness(1.12)}
.outros{margin-top:40px}
.outros a{font-family:var(--ui);font-size:.95rem}
.lista{display:grid;gap:12px;margin-top:24px}
.card{display:block;background:var(--panel);border:1px solid var(--line);padding:18px 20px;text-decoration:none;color:var(--text)}
.card:hover{border-color:var(--gold)}
.card small{font-family:var(--ui);font-size:.8rem;color:var(--gold)}
.card p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.nf{padding:32px 0}
footer{border-top:1px solid var(--line);padding:24px 0;font-family:var(--ui);font-size:.8rem;color:var(--muted);text-align:center}
@media (max-width:560px){body{font-size:17px}h1{font-size:2.1rem}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="../index.html" aria-label="Palavra e Série">PS</a>
    <div>
      <a class="brand" href="#">PALAVRA E SÉRIE</a>
      <p class="brand-sub">Plataforma de Consulta e Estudo Bíblico</p>
      <p class="brand-tag">Conhecimento bíblico &nbsp;•&nbsp; Pesquisa &nbsp;•&nbsp; Formação cristã</p>
    </div>
  </div>
</header>
<nav class="menu" aria-label="Principal">
  <div class="wrap">
    <a href="../index.html">Início</a>
    <a href="#">Estudos</a>
    <a href="pesquisa/matriz-pro.html">Matriz de Pesquisa</a>
    <a href="https://www.youtube.com/@Palavraeserie" target="_blank" rel="noopener">Canal</a>
  </div>
</nav>

<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">Palavra e Série · Conhecimento bíblico, pesquisa e formação cristã.</div></footer>

<script>
/* =====================================================
   CADASTRO DE ESTUDOS
   Para publicar um novo estudo: copie o bloco do Salmo 1,
   troque o "id" (nunca mude depois de divulgar o link) e
   preencha os campos. O link do vídeo será:
   https://palavraeserie7.github.io/pages/estudos.html#ID
   ===================================================== */
const CANAL = "https://www.youtube.com/@Palavraeserie";
const MATRIZ = "pesquisa/matriz-pro.html";

const ESTUDOS = [
{
  id: "salmo-1",
  tipo: "Salmos",
  titulo: "Estudo do Salmo 1",
  texto: "Salmos 1",
  resumo: "Os dois caminhos: a vida que floresce e a vida que se esvazia.",
  abertura: "Você acabou de ouvir o Salmo 1. Agora vamos entender o que ele diz e por que ele abre o livro dos Salmos.",
  mensagem: "A Palavra de Deus (a Torá) é o critério para distinguir a vida que floresce, vivida com Deus, da vida que se esvazia e perece, vivida em autonomia.",
  grupos: [
    { t: "Versículos 1 a 3", d: "O caminho do justo: o que ele evita, onde ele encontra prazer e o que ele se torna." },
    { t: "Versículos 4 e 5", d: "O caminho do ímpio: a imagem da palha e a ausência de lugar no juízo." },
    { t: "Versículo 6", d: "A razão final: o Senhor conhece o caminho dos justos, e o caminho dos ímpios perecerá." }
  ],
  versiculos: [
    ["v. 1", "O homem não anda no conselho dos ímpios, não se detém no caminho dos pecadores e não se assenta na roda dos escarnecedores."],
    ["v. 2", "Seu prazer está na lei do Senhor (tôrat YHWH), e nela ele medita (hāgâ) de dia e de noite."],
    ["v. 3", "Ele é como árvore plantada junto a correntes de águas (palgê mōyim), que dá fruto na sua estação (bə‘ittô), cuja folha não cai; tudo o que faz prosperará (yāṣlîaḥ)."],
    ["v. 4", "Os ímpios não são assim; são como a palha que o vento espalha."],
    ["v. 5", "Por isso os ímpios não subsistirão no juízo, nem os pecadores na congregação dos justos."],
    ["v. 6", "O Senhor conhece (yōdēa‘) o caminho dos justos, mas o caminho dos ímpios perecerá (tōbēd)."]
  ],
  carater: "O Salmo 1 traz ao mesmo tempo advertência (o perigo progressivo do pecado e a ruína final dos ímpios), motivação (buscar prazer e meditação constante nas Escrituras) e esperança (a vida sustentada por Deus, que conhece o justo).",
  relacao: "A comunhão com Deus não é estática. Ela é marcada por uma rejeição ativa à corrupção moral (v. 1) e por um deleite voluntário e contínuo na instrução divina (v. 2). O relacionamento é de intimidade e aprovação: “o Senhor conhece” (v. 6).",
  aplicacao: "Examine de onde vêm os conselhos que você ouve no dia a dia. Recuse a cumplicidade com modos de pensar que destroem. Cultive uma disciplina amorosa de leitura das Escrituras, confiando que a verdadeira prosperidade, que não é necessariamente material, mas existencial e espiritual, vem da sustentação de Deus.",
  conclusao: "O Salmo 1 é o pórtico sapiencial de todo o Saltério. A felicidade (’ašrê) e a estabilidade dependem de rejeitar o pecado e de se deleitar de forma constante na instrução de Deus. O salmo adverte sobre o fim trágico da impiedade e assegura que o justo é conhecido e sustentado por Deus.",
  lexico: [
    ["תּוֹרָה", "tôrāh", "Substantivo", "Lei, instrução, ensino, direção. Feminino singular."],
    ["דֶּרֶךְ", "derek", "Substantivo", "Caminho, estrada, modo de proceder, conduta. Singular."],
    ["מֹושָׁב", "mōšāb", "Substantivo", "Assento, habitação, assembleia, roda de pessoas. Masculino singular."],
    ["רָשָׁע", "rāšā‘", "Adjetivo", "Ímpio, culpado, perverso, transgressor. Muitas vezes usado como substantivo. Masculino singular."],
    ["צַדִּיק", "ṣaddîq", "Adjetivo", "Justo, reto, inocente, conforme à norma divina. Muitas vezes usado como substantivo. Masculino singular."],
    ["הָגָה", "hāgâ", "Verbo", "Meditar, murmurar, pronunciar em voz baixa, estudar. No v. 2, Qal imperfeito (yehgeh): “ele meditará”."],
    ["צָלַח", "ṣālaḥ", "Verbo", "Prosperar, ter sucesso, avançar com êxito. Qal imperfeito, masculino singular (yāṣlîaḥ)."],
    ["יָדַע", "yāda‘", "Verbo", "Conhecer, reconhecer com intimidade e cuidado. Qal particípio ativo (yōdēa‘)."]
  ],
  comentario: {
    evidencia: "O texto contrapõe duas categorias de pessoas por meio de imagens agrícolas e existenciais: a árvore enraizada junto às águas contra a palha dispersa pelo vento, e o caminho que subsiste contra o caminho que perece (tōbēd).",
    interpretacao: "O olhar de Deus neste texto não é neutro. Ele “conhece” (yāda‘, um conhecimento relacional profundo) a direção da vida do justo, enquanto a conduta autônoma e rebelde dos ímpios leva à dissolução e ao vazio. É uma teologia retributiva sapiencial: a bênção flui de estar enraizado na revelação de Deus (tôrāh).",
    aplicacao: "Veja a seção “O que o texto pede de você”, acima."
  },
  limitacoes: [
    "O Salmo 1 não traz título nem autoria explícita no texto massorético. A tradição judaica o associa com frequência a Davi ou o vê como um prólogo editorial de todo o Saltério. Por ser uma atribuição externa ao texto, não se afirma autoria direta.",
    "O verbo hāgâ (v. 2) vai de “murmurar” (som baixo) a “meditar”. É preciso cautela para não impor ideias modernas de meditação abstrata: o sentido mais preciso é a recitação murmurada e constante da Palavra."
  ],
  videos: [] /* opcional: [{ youtube: "ID_DO_VIDEO", rotulo: "Salmo 1 narrado" }] */
}
];

/* ---------- renderização ---------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function indice(){
  document.title = "Estudos · Palavra e Série";
  app.innerHTML = `
    <h1>Estudos</h1>
    <p class="sub">Estudos dos conteúdos publicados no canal Palavra e Série.</p>
    <div class="lista">
      ${ESTUDOS.map(e => `
        <a class="card" href="#${esc(e.id)}">
          <small>${esc(e.tipo)}</small>
          <h3>${esc(e.titulo)}</h3>
          <p>${esc(e.resumo)}</p>
        </a>`).join("")}
    </div>`;
}

function estudo(e){
  document.title = e.titulo + " · Palavra e Série";
  const outros = ESTUDOS.filter(x => x.id !== e.id);
  const videos = (e.videos || []).map(v => `
    <div class="palavra">
      <b>${esc(v.rotulo)}</b>
      <p><a href="https://www.youtube.com/watch?v=${esc(v.youtube)}" target="_blank" rel="noopener">Assistir no canal</a></p>
    </div>`).join("");

  app.innerHTML = `
    <p class="sub">${esc(e.tipo)} · ${esc(e.texto)}</p>
    <h1>${esc(e.titulo)}</h1>
    <p class="lead">${esc(e.abertura)}</p>

    <h2>Mensagem principal</h2>
    <p class="mensagem">${esc(e.mensagem)}</p>
    <p>${esc(e.carater)}</p>

    <h2>Como o salmo se divide</h2>
    <div class="grupos">${e.grupos.map(g => `<div><b>${esc(g.t)}</b><span>${esc(g.d)}</span></div>`).join("")}</div>

    <h2>O que o texto diz</h2>
    <ul class="vs">${e.versiculos.map(v => `<li><b>${esc(v[0])}</b>${esc(v[1])}</li>`).join("")}</ul>

    <h2>Relação com Deus</h2>
    <p>${esc(e.relacao)}</p>

    <h2>O que o texto pede de você</h2>
    <p>${esc(e.aplicacao)}</p>

    <h2>Conclusão</h2>
    <p>${esc(e.conclusao)}</p>

    <details class="aprof" id="aprofundamento">
      <summary>Aprofundamento: palavras no hebraico, teologia e limites</summary>
      <div class="inner">
        <h2>Palavras-chave</h2>
        ${e.lexico.map(w => `
          <div class="palavra">
            <span class="heb" lang="he">${w[0]}</span><span class="tr">${esc(w[1])}</span>
            <small>${esc(w[2])}</small>
            ${esc(w[3])}
          </div>`).join("")}

        <h2>Comentário teológico</h2>
        <div class="tri">
          <div><b>O que o texto diz</b><br>${esc(e.comentario.evidencia)}</div>
          <div><b>Como se interpreta</b><br>${esc(e.comentario.interpretacao)}</div>
          <div><b>Como se aplica</b><br>${esc(e.comentario.aplicacao)}</div>
        </div>

        <h2>Limites e cuidados</h2>
        ${e.limitacoes.map(l => `<p>${esc(l)}</p>`).join("")}
      </div>
    </details>

    ${videos ? `<h2>Conteúdo no canal</h2>${videos}` : ""}

    <div class="cta">
      <p>Quer ir mais fundo em ${esc(e.texto)}? Abra a Matriz de Pesquisa.</p>
      <a class="btn main" href="${MATRIZ}">Aprofundar ${esc(e.texto)}</a>
      <a class="btn sec" href="${CANAL}" target="_blank" rel="noopener">Voltar ao canal</a>
      <a class="btn sec" href="${CANAL}?sub_confirmation=1" target="_blank" rel="noopener">Inscrever-se</a>
    </div>

    <div class="outros">
      ${outros.length ? `<h2>Outros estudos</h2>` + outros.map(o => `<p><a href="#${esc(o.id)}">${esc(o.titulo)}</a></p>`).join("") : ""}
      <p><a href="#">Ver todos os estudos</a></p>
    </div>`;
  window.scrollTo(0, 0);
}

function rota(){
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return indice();
  const e = ESTUDOS.find(x => x.id === id);
  if (e) return estudo(e);
  document.title = "Estudo não encontrado · Palavra e Série";
  app.innerHTML = `<div class="nf"><h1>Estudo não encontrado</h1>
    <p>Esse link não corresponde a nenhum estudo publicado. <a href="#">Veja todos os estudos.</a></p></div>`;
}
window.addEventListener("hashchange", rota);
rota();
</script>
</body>
</html>
