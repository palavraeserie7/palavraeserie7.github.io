<script>
/* ==========================================================
   COMO CADASTRAR UM ESTUDO

   1. Copie o MODELO abaixo e cole dentro da lista ESTUDOS,
      entre os colchetes [ ].
   2. Entre um estudo e o próximo vai uma VÍRGULA.
   3. Os textos ficam entre ACENTOS GRAVES ( ` ), não entre
      aspas. Assim você pode escrever com aspas, quebras de
      linha e hebraico à vontade. Só não use o próprio acento
      grave dentro do texto.
   4. Em "texto", deixe uma LINHA EM BRANCO entre parágrafos.
      Linhas que começam com "• " viram lista.
   5. Cada seção é do tamanho e com o título que você quiser.
      Com aprofundamento: true, a seção vai para a parte que
      abre ao clicar. Sem isso, fica aberta para todos.

   MODELO (copie daqui, sem os asteriscos):

   {
     id: "salmo-1",
     categoria: "salmos",   (serie, oracao, engano, direcao ou salmos)
     titulo: "Estudo do Salmo 1",
     texto: "Salmos 1",
     resumo: `Uma frase para o índice.`,
     conteudo: `o Salmo 1`,
     video: ``,   (opcional: ID do vídeo do YouTube; com ele, o vídeo aparece na página)
     secoes: [
       { titulo: `Título da seção`, texto: `Parágrafo 1.

Parágrafo 2.

• Item de lista
• Outro item` },
       { titulo: `Outra seção`, texto: `...` },
       { titulo: `Seção técnica`, aprofundamento: true, texto: `...` }
     ]
   },

   O "id" é o final do link e não deve mudar depois de
   divulgado: ...redes-sociais-estudos.html#salmo-1
   ========================================================== */

const CANAL = "https://www.youtube.com/@Palavraeserie";
const MATRIZ = "pesquisa/matriz-pro.html";

/* As 5 categorias (playlists). O "id" é o que se escreve em "categoria" no estudo.
   "msg" é a mensagem do topo do estudo ({c} vira o conteúdo) e "botao" é o texto do botão.
   Se um link de playlist estiver incompleto, corrija o campo "playlist". */
const CATEGORIAS = [
  { id: "serie",   nome: "O Que a Bíblia Realmente Diz?",     playlist: "https://www.youtube.com/playlist?list=PLMUW8wrJsx-s&playnext=1&index=1",
    desc: "Estudos de textos bíblicos frequentemente interpretados de forma equivocada.",
    msg: "Se você acabou de ouvir {c}, este é o estudo do texto, para entender o que ele diz e o que não diz. Se quiser ouvir de novo, o áudio está no canal.",
    botao: "Ouvir de novo no canal" },
  { id: "oracao",  nome: "Momentos de oração",          playlist: "https://www.youtube.com/playlist?list=PLH3lq9vJzsio&playnext=1&index=1",
    desc: "Orações e momentos de meditação baseados nas Escrituras.",
    msg: "Se você acabou de ouvir {c}, este é o estudo das Escrituras em que a oração se apoia. Se quiser orar de novo, o áudio está no canal.",
    botao: "Orar de novo no canal" },
  { id: "engano",  nome: "Tirando a mente do engano",   playlist: "https://www.youtube.com/playlist?list=PLNL8itelYU-E&playnext=1&index=1",
    desc: "Estudos para discernir o que o mundo, e até a igreja, aceita como normal, mas a Escritura não.",
    msg: "Se você acabou de ouvir {c}, este é o estudo que confere o assunto com a Escritura. Se quiser ouvir de novo, o áudio está no canal.",
    botao: "Ouvir de novo no canal" },
  { id: "direcao", nome: "Bíblia e direção de vida",    playlist: "https://www.youtube.com/playlist?list=PLQP9mSjlQCV0&playnext=1&index=1",
    desc: "Respostas bíblicas para dúvidas que desafiam a fé e a vida cristã.",
    msg: "Se você acabou de ouvir {c}, este é o estudo bíblico por trás da resposta. Se quiser ouvir de novo, o áudio está no canal.",
    botao: "Ouvir de novo no canal" },
  { id: "salmos",  nome: "Salmos e reflexões bíblicas", playlist: "https://www.youtube.com/playlist?list=PLdXZVtjxhh18",
    desc: "Estudo e reflexão sobre os Salmos: texto, contexto e aplicação à vida cristã.",
    msg: "Se você acabou de ouvir {c}, este é o estudo. Se quiser se edificar ouvindo o áudio, ele está no canal.",
    botao: "Ouvir no canal" }
];

const ESTUDOS = [

{
  id: "salmo-1",
  categoria: "salmos",
  titulo: "Estudo do Salmo 1 — Os dois caminhos",
  texto: "Salmos 1:1-6",
  resumo: "Os dois caminhos, a formação do caráter e o relacionamento com Deus.",
  conteudo: "Salmos 1:1-6",
  video: ``,
  abertura: "Estudo bíblico explicado — Salmos 1:1-6\nTema: Os dois caminhos, a formação do caráter e o relacionamento com Deus\n\nSalmos 1 apresenta duas maneiras de viver: a vida daquele que orienta sua existência pela Palavra de Deus e a vida daquele que conduz seus passos sem se submeter à orientação divina.\n\nO salmo não está apenas ensinando o que devemos fazer ou deixar de fazer. Ele está revelando como nossas escolhas, influências, pensamentos e atitudes formam nosso caráter e determinam a direção da nossa vida.\n\nVamos examinar cada expressão como um orientador discipulando alguém, procurando compreender o significado do texto e como ele deve transformar nossa maneira de viver.",
  secoes: [
    { titulo: "1. Salmos 1:1 — O caráter de quem é verdadeiramente feliz", texto: "\"Bem-aventurado o varão que não anda no conselho dos ímpios, nem está no caminho dos pecadores, nem se assenta no assento dos escarnecedores.\"\n\n1.1. O que significa ser bem-aventurado?\nA expressão hebraica é אַשְׁרֵי ('ashrê).\n\nPode ser traduzida como feliz, bem-aventurado ou verdadeiramente feliz.\n\nEntretanto, não devemos entender essa felicidade simplesmente como alegria emocional, satisfação material ou ausência de problemas.\n\nA bem-aventurança apresentada pelo salmo descreve uma condição de vida que está no caminho aprovado pela sabedoria de Deus.\n\nSer bem-aventurado é experimentar a felicidade de uma vida orientada pela vontade divina, mesmo quando as circunstâncias externas não são favoráveis.\n\nNa prática: uma pessoa bem-aventurada não é necessariamente aquela que possui tudo o que deseja, mas aquela que aprendeu a não sacrificar sua fidelidade a Deus para conseguir aquilo que deseja.\n\nPor exemplo:\n- Quando poderia mentir para obter vantagem, escolhe falar a verdade.\n- Quando poderia revidar uma ofensa, procura agir com domínio próprio.\n- Quando recebe uma proposta vantajosa, mas desonesta, prefere permanecer íntegra.\nA felicidade bíblica não depende exclusivamente daquilo que acontece ao nosso redor, mas também da direção espiritual que damos à nossa vida.\n1.2. O que seria o conselho dos ímpios?\nA expressão hebraica é עֲצַת רְשָׁעִים ('atsat resha'im).\n- עֵצָה ('etsah): conselho, orientação, plano ou propósito.\n- רָשָׁע (rasha'): ímpio, culpado, perverso.\nO conselho dos ímpios representa uma orientação de pensamento e comportamento que não respeita a justiça e a vontade de Deus.\n\nNão significa apenas receber conselhos de pessoas declaradamente más. Também pode envolver ideias aparentemente inteligentes, vantajosas e socialmente aceitas, mas contrárias aos princípios divinos.\n\nExemplos práticos:\n- \"Todo mundo mente um pouco para conseguir o que quer.\"\n- \"Se você tem oportunidade de enganar e não será descoberto, aproveite.\"\n- \"Perdoar é coisa de gente fraca.\"\n- \"O importante é vencer, não importa como.\"\nObserve que o conselho influencia primeiro a maneira de pensar.\n\nUma pessoa pode começar apenas ouvindo determinada orientação e, gradualmente, passar a considerá-la correta.\n\nLição para o discípulo: nem toda orientação que parece vantajosa conduz à vida. Antes de aceitar um conselho, examine se ele está de acordo com os princípios das Escrituras.\n1.3. O que significa estar no caminho dos pecadores?\nA expressão hebraica é דֶּרֶךְ חַטָּאִים (derekh chatta'im).\n- דֶּרֶךְ (derekh): caminho, percurso, maneira de proceder.\n- חַטָּאִים (chatta'im): pecadores.\nAqui, caminho não representa simplesmente uma estrada física. É uma figura que representa o modo de viver, as escolhas e a conduta de uma pessoa.\n\nEstar no caminho dos pecadores significa adotar uma maneira de viver caracterizada pela prática do pecado.\n\nExiste uma diferença entre entrar em contato com pessoas pecadoras e adotar suas práticas.\n\nO cristão convive com pessoas de diferentes comportamentos, mas não deve permitir que o pecado se torne seu padrão de vida.\n\nExemplo: imagine alguém que começa trabalhando em um ambiente onde pequenas desonestidades são consideradas normais. Inicialmente, discorda dessas práticas. Depois, começa a tolerá-las e, finalmente, passa a praticá-las.\n\nO problema não foi simplesmente estar naquele ambiente, mas permitir que sua conduta fosse moldada por ele.\n1.4. O que significa assentar-se no assento dos escarnecedores?\nA expressão hebraica é מוֹשַׁב לֵצִים (moshav letsim).\n- מוֹשָׁב (moshav): assento, lugar de permanência ou reunião.\n- לֵץ (lets): escarnecedor, zombador, aquele que ridiculariza.\nO escarnecedor é aquele que trata com desprezo aquilo que deveria ser respeitado, especialmente quando se trata da sabedoria, da correção e da instrução.\n\nAssentar-se representa uma posição de permanência e identificação.\n\nNão se trata apenas de ouvir uma zombaria ocasional. A imagem sugere alguém que passa a participar de um ambiente no qual o desprezo e a ridicularização se tornam características habituais.\n\nExemplo prático:\n\nUma pessoa começa participando de conversas nas quais a fé é ridicularizada, a santidade é tratada como motivo de piada e os princípios bíblicos são desprezados.\n\nCom o tempo, não apenas escuta essas conversas, mas também começa a participar delas e a reproduzir aquela mentalidade.\n\nLição para o discípulo: cuidado com os ambientes nos quais você encontra prazer em permanecer. Aquilo que você tolera continuamente pode começar a influenciar aquilo em que acredita.\n1.5. Por que o salmo apresenta andar, deter-se e assentar-se?\nObserve a sequência:\n1. Andar: receber influência e orientação.\n2. Deter-se: permanecer em determinada direção.\n3. Assentar-se: estabelecer-se e participar daquele ambiente.\nEssa sequência apresenta uma progressão literária de envolvimento com a impiedade.\n\nNão significa que todo pecado necessariamente aconteça nessa ordem cronológica, mas mostra como a influência, a participação e a identificação podem estar relacionadas.\n\nAplicação: examine não apenas suas atitudes, mas também as vozes que orientam seus pensamentos e os ambientes nos quais você escolhe permanecer." },
    { titulo: "2. Salmos 1:2 — O prazer na Palavra e a meditação contínua", texto: "\"Antes tem o seu prazer na lei do Senhor, e na sua lei medita de dia e de noite.\"\n\n2.1. O que é ter prazer na lei do Senhor?\nA palavra hebraica é חֵפֶץ (ḥēphets), que pode expressar prazer, deleite, desejo ou satisfação.\n\nO texto não está descrevendo apenas alguém que lê a Bíblia por obrigação religiosa.\n\nEstá apresentando uma pessoa que desenvolve uma disposição interior favorável à instrução de Deus.\n\nMas o que significa essa experiência interna?\n\nSignifica que a Palavra deixa de ser apenas uma informação religiosa recebida externamente e passa a ter valor para a pessoa.\n\nEla começa a desejar compreender o que Deus ensina porque reconhece que a instrução divina orienta sua vida.\n\nIsso envolve três dimensões:\n- Intelectual: deseja compreender a Palavra.\n- Afetiva: encontra satisfação naquilo que Deus ensina.\n- Volitiva: deseja ajustar suas escolhas à vontade divina.\nPor exemplo:\n\nUma pessoa pode saber que precisa perdoar alguém, mas continuar alimentando ressentimento.\n\nQuando desenvolve prazer na Palavra, começa a compreender a importância do perdão, reconhece a necessidade de abandonar a amargura e procura agir de acordo com aquilo que aprendeu.\n\nO prazer na Palavra não significa que todos os ensinamentos serão emocionalmente agradáveis. Às vezes, a Escritura confronta, corrige e revela aspectos de nossa vida que precisamos mudar.\n\nO verdadeiro deleite também se manifesta quando aceitamos ser corrigidos por Deus.\n2.2. O que significa meditar de dia e de noite?\nO verbo hebraico é הָגָה (hāgâ).\n\nPode significar murmurar, pronunciar em voz baixa, refletir ou meditar.\n\nA ideia é de uma reflexão que envolve atenção e consideração sobre aquilo que está sendo aprendido.\n\nMeditar de dia e de noite não significa necessariamente permanecer lendo a Bíblia durante 24 horas.\n\nÉ uma expressão que comunica continuidade e constância.\n\nA Palavra acompanha o pensamento e influencia as decisões durante a vida cotidiana.\n\nExemplo prático:\n\nPela manhã, você lê um ensinamento sobre domínio próprio.\n\nDurante o dia, alguém o provoca.\n\nNesse momento, você se recorda do ensinamento, reflete sobre ele e procura responder de maneira coerente com a Palavra.\n\nÀ noite, examina sua atitude e considera se agiu corretamente.\n\nIsso demonstra como a meditação pode ultrapassar o momento da leitura e alcançar as situações reais da vida.\n\nLição para o discípulo: não leia a Bíblia apenas para acumular informações. Leia para compreender, refletir, guardar e praticar aquilo que Deus ensina." },
    { titulo: "3. Salmos 1:3 — A árvore plantada junto aos ribeiros de águas", texto: "\"Pois será como a árvore plantada junto a ribeiros de águas, que dá o seu fruto no seu tempo; as suas folhas não cairão, e tudo quanto fizer prosperará.\"\n\nO versículo apresenta uma comparação. Depois de mostrar como vive aquele que encontra prazer na Palavra de Deus, o salmista utiliza a figura de uma árvore para explicar os resultados dessa vida.\n3.1. Por que Deus compara o justo a uma árvore?\nA árvore é uma figura muito significativa porque representa vida, estabilidade, crescimento, sustentação e frutificação.\n\nObserve algumas características:\n- Possui raízes que a sustentam.\n- Depende de água para continuar vivendo.\n- Cresce progressivamente.\n- Produz frutos conforme seu desenvolvimento.\n- Enfrenta mudanças nas condições ambientais.\nA comparação não significa que o justo nunca enfrentará dificuldades. Significa que sua vida está fundamentada em uma fonte de sustentação que não depende exclusivamente das circunstâncias externas.\n\nA árvore não vive apenas daquilo que aparece na superfície. Sua sustentação está relacionada às raízes e à água que recebe.\n\nDa mesma maneira, a vida espiritual não pode depender somente das aparências religiosas. Precisa estar fundamentada na comunhão com Deus e na assimilação de Sua Palavra.\n\nAplicação ao discipulado:\n\nPergunte a si mesmo:\n\nMinha vida espiritual possui raízes profundas ou depende apenas das circunstâncias favoráveis?\n\nQuando enfrento dificuldades, continuo buscando a Deus ou abandono meus princípios?\n\nMinha fé está fundamentada na Palavra ou apenas nas emoções que experimento?\n3.2. O que significa estar plantada junto a ribeiros de águas?\nA expressão hebraica é עַל־פַּלְגֵי מָיִם ('al-palge mayim).\n- פַּלְגֵי (palgei): canais, correntes ou cursos de água.\n- מָיִם (mayim): águas.\nO salmista descreve uma árvore situada em um local onde encontra acesso à água.\n\nA imagem comunica uma condição favorável à manutenção da vida e à produção de frutos.\n\nA aplicação espiritual é que o justo encontra na instrução divina uma fonte constante de orientação.\n\nNão se trata de afirmar que a Palavra elimina todos os problemas, mas que fornece direção para atravessá-los sem abandonar o caminho de Deus.\n3.3. O que significa dar fruto no seu tempo?\nA expressão hebraica é בְּעִתּוֹ (bə'ittô), que significa no seu tempo ou na sua estação.\n\nUma árvore não produz todos os frutos imediatamente. Existe um processo de crescimento e desenvolvimento.\n\nO fruto aparece no momento apropriado.\n\nEssa imagem ensina algo importante sobre maturidade espiritual: o crescimento cristão envolve processo, perseverança e desenvolvimento.\n\nExemplos de frutos na vida cristã:\n- Aprender a controlar a língua.\n- Desenvolver paciência diante das dificuldades.\n- Tratar as pessoas com misericórdia.\n- Abandonar hábitos pecaminosos.\n- Desenvolver fidelidade e responsabilidade.\n- Demonstrar amor mesmo quando isso exige renúncia.\nEsses resultados não aparecem necessariamente de uma só vez.\n\nUma pessoa pode compreender determinado ensinamento hoje e precisar de tempo, disciplina e perseverança para incorporá-lo à sua conduta.\n\nLição para o discípulo: não confunda crescimento espiritual com resultados imediatos. Deus também trabalha em processos de amadurecimento.\n3.4. O que significa suas folhas não caírem?\nA expressão apresenta a imagem de uma árvore cuja folhagem permanece.\n\nA folha representa a aparência de vitalidade e continuidade da vida.\n\nNa comparação, o justo não é retratado como alguém que perde sua sustentação diante de qualquer mudança das circunstâncias.\n\nIsso não significa que o cristão nunca ficará cansado, triste, enfermo ou abatido.\n\nA mensagem é de estabilidade e vitalidade na vida orientada por Deus.\n\nAplicação: não construa sua fidelidade sobre resultados imediatos. Continue caminhando com Deus mesmo quando não estiver vendo os frutos que esperava.\n3.5. O que significa tudo quanto fizer prosperará?\nA expressão hebraica final é וְכֹל אֲשֶׁר־יַעֲשֶׂה יַצְלִיחַ (wəkhol asher-ya'aseh yatsliach).\n\nO verbo יַצְלִיחַ (yatsliach) está relacionado a prosperar, ter êxito ou alcançar resultado favorável.\n\nAqui precisamos ter cuidado com uma interpretação equivocada.\n\nO texto não promete que toda atividade do justo resultará em riqueza, sucesso financeiro ou ausência de sofrimento.\n\nO salmo está descrevendo a vida daquele que se orienta pela instrução divina e encontra nela sua direção.\n\nA prosperidade deve ser compreendida dentro do contexto da sabedoria bíblica, e não simplesmente segundo os critérios materiais de sucesso.\n\nUma pessoa pode enfrentar perdas financeiras e ainda assim permanecer fiel, íntegra e espiritualmente firme.\n\nExemplo: alguém que recusa uma oportunidade de enriquecimento desonesto pode perder dinheiro, mas preserva sua integridade diante de Deus.\n\nNesse sentido, o êxito da vida justa não pode ser medido exclusivamente pelo patrimônio acumulado.\n\nLição para o discípulo: não pergunte apenas se sua vida está prosperando materialmente. Pergunte se suas decisões estão produzindo resultados coerentes com a vontade de Deus." },
    { titulo: "4. Salmos 1:4 — A comparação dos ímpios com a moinha", texto: "\"Não são assim os ímpios: mas são como a moinha que o vento espalha.\"\n\n4.1. Por que comparar os ímpios com a moinha que o vento espalha?\nA palavra hebraica é מֹץ (mots), que significa palha miúda, casca ou resíduo leve separado do grão.\n\nPara compreender a comparação, precisamos conhecer uma prática agrícola antiga.\n\nDepois da colheita, os grãos eram separados das partes leves e indesejáveis da planta.\n\nO material era lançado ao ar ou movimentado de maneira que o vento carregasse a palha e a moinha, enquanto os grãos, mais pesados, permaneciam.\n\nO salmista utiliza essa cena para estabelecer um contraste:\nJusto\tÍmpio\nÁrvore plantada\tMoinha\nPossui sustentação\tÉ levada pelo vento\nPermanece\tÉ espalhada\nProduz fruto\tNão apresenta a mesma imagem de frutificação\n\nA árvore representa estabilidade e vida. A moinha representa instabilidade e falta de sustentação.\n\nO contraste não está apenas na aparência física dos elementos, mas no destino que cada um representa.\n4.2. O que essa comparação ensina?\nEnsina que nem toda vida que parece bem-sucedida possui fundamento duradouro.\n\nO ímpio pode aparentar força, influência, riqueza e poder. Entretanto, essas coisas não garantem permanência diante do juízo de Deus.\n\nO salmista está mostrando que uma vida construída em oposição à justiça divina não possui fundamento capaz de sustentá-la diante do julgamento do Senhor.\n\nExemplo prático:\n\nImagine duas pessoas.\n\nA primeira constrói sua vida sobre honestidade, fidelidade, responsabilidade e temor de Deus.\n\nA segunda constrói sua vida sobre manipulação, mentira e exploração das pessoas.\n\nDurante algum tempo, a segunda pode até parecer mais bem-sucedida.\n\nMas o salmo ensina que a avaliação definitiva da vida humana não pertence às aparências sociais. Pertence a Deus.\n\nLição para o discípulo: não confunda sucesso aparente com aprovação divina. Uma vida pode impressionar as pessoas e, ainda assim, estar distante dos caminhos de Deus." },
    { titulo: "5. Salmos 1:5 — O juízo e a congregação dos justos", texto: "\"Pelo que os ímpios não subsistirão no juízo, nem os pecadores na congregação dos justos.\"\n\nAqui o salmista apresenta as consequências da vida representada pela moinha.\n\nA imagem deixa de tratar apenas da estabilidade e passa a apontar para o julgamento.\n5.1. O que significa os ímpios não subsistirem no juízo?\nA expressão hebraica utiliza o verbo קוּם (qûm), relacionado a levantar-se, permanecer de pé ou subsistir.\n\nA ideia é que os ímpios não terão condição de permanecer de pé diante do juízo.\n\nIsso não significa que Deus não examinará suas ações.\n\nPelo contrário: o versículo apresenta a realidade de um julgamento no qual a impiedade não encontrará aprovação.\n\nO texto ensina que ninguém pode construir uma vida de rebeldia contra Deus e esperar que sua aparente prosperidade seja suficiente para sustentá-lo diante do julgamento divino.\n\nUma distinção importante: o versículo não está ensinando que uma pessoa justa nunca pecou ou que alcança a salvação por mérito próprio. Ele apresenta o contraste entre dois caminhos de vida, não uma doutrina completa sobre justificação e salvação.\n\nAplicação:\n\nNão viva preocupado apenas com a opinião das pessoas sobre suas atitudes.\n\nPergunte também:\n- Como Deus avalia minhas escolhas?\n- Estou vivendo de maneira coerente com Sua Palavra?\n- Estou disposto a reconhecer meus erros e me arrepender?\n- Minha conduta demonstra submissão à justiça divina?\n5.2. O que significa os pecadores não permanecerem na congregação dos justos?\nA expressão hebraica é עֲדַת צַדִּיקִים ('adat tsaddiqim).\n- עֵדָה ('edah): assembleia, congregação ou comunidade.\n- צַדִּיקִים (tsaddiqim): justos.\nO salmista apresenta uma comunidade caracterizada pela justiça.\n\nA ideia é que os ímpios não terão lugar de permanência nessa assembleia quando ocorrer a manifestação do juízo divino.\n\nÉ importante não confundir essa afirmação com a proibição de receber pecadores na igreja.\n\nA igreja anuncia o evangelho, acolhe pessoas que precisam de arrependimento e ensina o caminho de Deus.\n\nO salmo está tratando do destino dos ímpios diante do juízo, e não estabelecendo uma regra para impedir que pessoas necessitadas de salvação participem da comunidade de fé.\n\nAplicação para a igreja:\n\nUma comunidade cristã deve acolher pessoas, ensinar as Escrituras, promover arrependimento e buscar uma vida de santidade.\n\nNão deve, porém, transformar o pecado deliberado em padrão de comportamento aceitável.\n\nLição para o discípulo: pertencer a uma comunidade religiosa não substitui uma vida de relacionamento verdadeiro com Deus." },
    { titulo: "6. Salmos 1:6 — Deus conhece o caminho dos justos", texto: "\"Porque o Senhor conhece o caminho dos justos; porém o caminho dos ímpios perecerá.\"\n\nEste versículo apresenta a razão fundamental do contraste entre os dois caminhos.\n\nO salmo termina mostrando que Deus não é indiferente à maneira como as pessoas vivem.\n\nEle conhece o caminho dos justos e o caminho dos ímpios tem como destino a perdição.\n6.1. O que significa Deus conhecer o caminho do justo?\nO verbo hebraico é יָדַע (yāda'), que significa conhecer, saber ou reconhecer.\n\nNo versículo, a forma empregada é יֹדֵעַ (yōdēa').\n\nMas precisamos compreender que o conhecimento de Deus não é simplesmente uma informação sobre a existência das pessoas.\n\nDeus conhece todas as coisas. Portanto, o sentido aqui não pode ser reduzido a Ele saber para onde alguém está indo.\n\nNo contexto do salmo, conhecer o caminho dos justos expressa uma relação de reconhecimento, consideração e cuidado divino.\n\nÉ uma maneira de comunicar que a vida do justo está diante de Deus e não passa despercebida por Ele.\n\nExemplo prático:\n\nImagine alguém que procura viver corretamente, mas enfrenta injustiças, incompreensão e dificuldades.\n\nAs pessoas podem não reconhecer sua integridade.\n\nPodem até interpretar sua fidelidade como fraqueza.\n\nEntretanto, Salmos 1:6 ensina que o Senhor conhece o caminho dos justos.\n\nA aprovação divina não depende do reconhecimento humano.\n\nLição para o discípulo: mesmo quando ninguém percebe sua fidelidade, Deus não é indiferente à maneira como você vive.\n6.2. O que significa o caminho dos ímpios perecerá?\nA expressão hebraica é וְדֶרֶךְ רְשָׁעִים תֹּאבֵד (wəderekh resha'im to'ved).\n- דֶּרֶךְ (derekh): caminho, conduta ou maneira de viver.\n- רְשָׁעִים (resha'im): ímpios.\n- תֹּאבֵד (to'ved): perecerá, desaparecerá ou será destruído.\nObserve algo importante: o texto não diz apenas que o ímpio sofrerá uma consequência. Ele declara que o próprio caminho dos ímpios perecerá.\n\nIsso significa que a maneira de viver construída em oposição a Deus não possui futuro duradouro diante do juízo divino.\n\nO caminho dos ímpios pode parecer vantajoso por determinado período, mas seu destino final é a ruína.\n\nExemplo prático:\n\nUma pessoa pode construir sua reputação por meio de mentiras, manipulação e exploração.\n\nDurante anos, pode conseguir vantagens.\n\nMas uma vida fundamentada na injustiça não possui aprovação diante de Deus.\n\nO salmo chama o leitor a considerar não apenas os resultados imediatos de suas escolhas, mas também seu destino final.\n6.3. O que Deus está revelando sobre a humanidade?\nO salmo apresenta uma verdade importante: Deus considera a direção da vida humana.\n\nNão basta observar o que uma pessoa declara acreditar. É necessário considerar o caminho que ela escolhe percorrer.\n\nO relacionamento com Deus envolve a maneira de pensar, as decisões, as atitudes e a disposição de ouvir Sua instrução.\n\nO Senhor conhece o caminho dos justos, mas o caminho dos ímpios não permanecerá.\n\nLição para o discípulo: não construa sua vida pensando apenas no presente. Viva considerando que suas escolhas estão diante de Deus." },
    { titulo: "7. O que Salmos 1 ensina quando consideramos os seis versículos juntos?", texto: "Agora que examinamos cada versículo, precisamos compreender como todos se relacionam.\n\nO salmo apresenta dois caminhos, duas maneiras de viver e dois destinos.\nOs dois caminhos de Salmos 1\nO caminho do justo\n\n- Não se deixa orientar pela impiedade.\n- Encontra prazer na Palavra de Deus.\n- Medita continuamente na instrução divina.\n- Possui estabilidade espiritual.\n- Produz frutos no tempo apropriado.\n- É conhecido pelo Senhor.\n  Destino: permanência diante de Deus\n\nO caminho dos ímpios\n\n- Aceita orientações contrárias à justiça.\n- Permanece em práticas pecaminosas.\n- Identifica-se com o desprezo pela instrução.\n- É comparado à moinha dispersada pelo vento.\n- Não subsiste no juízo.\n- Seu caminho perecerá.\n  Destino: ruína" },
    { titulo: "8. Orientação para a vida cristã: como colocar Salmos 1 em prática?", texto: "O salmo não foi apresentado apenas para que o leitor conheça a diferença entre o justo e o ímpio. Ele também o convida a examinar a própria vida.\n\nConsidere estas orientações:\n\n1. Examine suas influências.\n\nQuem está influenciando suas decisões? Os conselhos que você recebe estão de acordo com a Palavra de Deus?\n\n2. Examine seus ambientes.\n\nVocê está frequentando lugares ou participando de conversas que estão enfraquecendo seus princípios cristãos?\n\n3. Desenvolva prazer nas Escrituras.\n\nNão transforme a leitura bíblica em uma obrigação vazia. Procure compreender o que Deus ensina e por que esse ensinamento é importante.\n\n4. Aprenda a meditar.\n\nLeia, reflita, procure compreender e leve o ensinamento para as situações que enfrenta diariamente.\n\n5. Respeite o processo de amadurecimento.\n\nNão exija de si mesmo resultados instantâneos. Desenvolva perseverança e permita que os ensinamentos bíblicos transformem sua conduta.\n\n6. Viva diante de Deus, não apenas diante das pessoas.\n\nSua vida cristã não deve depender exclusivamente de elogios, reconhecimento ou aprovação humana." },
    { titulo: "9. Perguntas para exame pessoal e discipulado", texto: "Estas perguntas podem ser utilizadas em uma conversa entre discipulador e discípulo.\n\n1. Quais conselhos têm exercido maior influência sobre minhas decisões?\n\nSalmos 1:1\n\n2. Tenho prazer em aprender a Palavra ou apenas leio por obrigação?\n\nSalmos 1:2\n\n3. Minhas atitudes estão produzindo frutos coerentes com aquilo que aprendo?\n\nSalmos 1:3\n\n4. Minha vida possui fundamentos espirituais ou depende das circunstâncias?\n\nSalmos 1:3-4\n\n5. Estou preocupado apenas com a aprovação das pessoas ou também com a avaliação de Deus?\n\nSalmos 1:5\n\n6. Qual caminho minhas escolhas estão construindo?\n\nSalmos 1:6\n\n Copiar minhas reflexões" },
    { titulo: "10. Conclusão: o ensinamento central para o discípulo", texto: "Salmos 1 ensina que a vida com Deus não se resume a uma declaração de fé. Ela envolve uma maneira de pensar, uma disposição interior, escolhas conscientes e uma conduta orientada pela Palavra.\n\nO justo não é apresentado como alguém que nunca enfrenta dificuldades, mas como alguém cuja vida encontra orientação na instrução do Senhor.\n\nA árvore representa a estabilidade e a frutificação. A moinha representa a fragilidade e a transitoriedade de uma vida que não encontra fundamento na justiça divina.\n\nO salmo termina mostrando que Deus conhece o caminho dos justos e que o caminho dos ímpios perecerá.\n\nA grande pergunta que Salmos 1 deixa para cada pessoa é: em qual caminho estou construindo minha vida?\n\nNão basta admirar a árvore. É necessário desenvolver raízes. Não basta conhecer a Palavra. É necessário permitir que ela oriente nossas decisões.\nUma palavra do discipulador\nNão procure apenas conhecer mais versículos. Procure compreender o que Deus está ensinando e permita que esse conhecimento transforme sua maneira de viver.\n\nAprenda a ouvir a Palavra, examine suas atitudes, reconheça seus erros, abandone aquilo que contraria a vontade de Deus e persevere no caminho da justiça.\n\nA maturidade cristã não consiste apenas em saber o que a Bíblia diz, mas em desenvolver uma vida cada vez mais coerente com aquilo que ela ensina." }
  ]
},

  {
  id: "nascido-de-deus-relacao-com-pecado",

  video: ``,
  abertura: `Estudo bíblico exegético e teológico

Texto central: 1 João 3:9
Unidade literária principal: 1 João 2:28–3:10
Textos complementares: 1 João 1:5–2:2; João 3:1-8; Romanos 6–8; Gálatas 5:16-25

Uma das afirmações mais profundas da primeira carta de João encontra-se em 1 João 3:9:

"Qualquer que é nascido de Deus não comete pecado; porque a sua semente permanece nele; e não pode pecar, porque é nascido de Deus." (Almeida Revista e Corrigida)

Essa declaração levanta uma questão importante: se uma pessoa nasceu de Deus, ela realmente não pode mais cometer pecado?

A pergunta se torna ainda mais complexa quando observamos que o próprio João afirma anteriormente:

"Se dissermos que não temos pecado, enganamo-nos a nós mesmos, e não há verdade em nós." (1 João 1:8)

E acrescenta:

"Meus filhinhos, estas coisas vos escrevo, para que não pequeis; e, se alguém pecar, temos um Advogado para com o Pai, Jesus Cristo, o justo." (1 João 2:1)

Como compreender essas declarações sem contradizer o pensamento do apóstolo?

João não apresenta o novo nascimento como uma simples mudança de religião ou uma declaração verbal de fé. Ele descreve uma transformação espiritual que modifica a relação do indivíduo com Deus, com a justiça e com o pecado.

O objetivo deste estudo é compreender a natureza dessa transformação, identificar o que significa não praticar o pecado, examinar a expressão "não pode pecar" e esclarecer como o cristão deve lidar com suas quedas, seu arrependimento e sua confiança na graça de Cristo.`,
  secoes: [
    { titulo: `CAPÍTULO 1 — O QUE SIGNIFICA SER NASCIDO DE DEUS?`, texto: `1.1. A origem do novo nascimento

O novo nascimento é uma obra espiritual realizada por Deus na vida humana. Não se trata simplesmente de melhorar o comportamento, adquirir conhecimentos religiosos ou adotar uma nova filosofia de vida.

Jesus explicou essa realidade a Nicodemos:

"Na verdade, na verdade te digo que aquele que não nascer de novo não pode ver o Reino de Deus." (João 3:3)

Nicodemos inicialmente compreendeu a expressão em sentido físico, mas Jesus esclareceu que estava falando de um nascimento espiritual:

"O que é nascido da carne é carne, e o que é nascido do Espírito é espírito." (João 3:6)

A distinção apresentada por Jesus é fundamental. O nascimento natural produz a vida humana; o nascimento espiritual está relacionado à ação do Espírito de Deus.

Portanto, o novo nascimento não é produzido exclusivamente pela força de vontade humana. É uma transformação cuja origem está em Deus.

João também apresenta essa realidade:

"Os quais não nasceram do sangue, nem da vontade da carne, nem da vontade do homem, mas de Deus." (João 1:13)

1.2. O novo nascimento transforma a natureza interior?

O novo nascimento não significa que o indivíduo se torna imediatamente incapaz de cometer qualquer erro. Significa que sua relação com Deus e com o pecado passa por uma transformação fundamental.

Antes, o pecado podia ser aceito como uma maneira normal de viver. Depois da regeneração, a pessoa passa a reconhecer sua incompatibilidade com a vontade de Deus.

Isso não significa ausência de tentações, conflitos ou possibilidades de queda.

Paulo descreve a transformação da vida cristã:

"Assim que, se alguém está em Cristo, nova criatura é: as coisas velhas já passaram; eis que tudo se fez novo." (2 Coríntios 5:17)

A novidade mencionada não se limita à aparência exterior. Ela envolve uma nova identidade, uma nova relação com Deus e uma nova orientação da vida.

1.3. Qual é a diferença entre professar a fé e nascer de Deus?

Uma pessoa pode frequentar uma igreja, conhecer passagens bíblicas, participar de atividades religiosas e declarar publicamente que acredita em Jesus.

Entretanto, a profissão religiosa, isoladamente, não comprova o novo nascimento.

João ensina que a verdadeira filiação divina produz evidências na vida:

"Se sabeis que ele é justo, sabeis que todo aquele que pratica a justiça é nascido dele." (1 João 2:29)

A prática da justiça não compra a salvação. Ela manifesta a transformação produzida por Deus.

É necessário distinguir a causa da salvação de suas evidências:

- A salvação tem sua origem na graça de Deus.
- A fé recebe a obra de Cristo.
- O novo nascimento transforma a pessoa.
- A transformação manifesta seus efeitos na vida.

Efésios 2:8-10 apresenta essa relação entre graça, fé e boas obras.

1.4. O novo nascimento elimina todas as inclinações pecaminosas?

Essa questão exige cuidado.

A Bíblia não ensina de maneira inequívoca que todo desejo contrário à vontade de Deus desaparece instantaneamente quando alguém nasce de novo.

Gálatas 5:17 apresenta um conflito entre a carne e o Espírito:

"Porque a carne cobiça contra o Espírito, e o Espírito contra a carne."

A existência desse conflito demonstra que a vida cristã envolve uma luta contra desejos contrários à vontade divina.

Portanto, o novo nascimento não deve ser confundido automaticamente com a erradicação de toda inclinação pecaminosa.

Conclusão do capítulo

Ser nascido de Deus significa receber uma nova vida cuja origem está em Deus. Essa transformação modifica a identidade, a orientação moral e a relação com o pecado. Sua evidência não é a alegação de perfeição absoluta, mas uma vida que passa a reconhecer, rejeitar e combater aquilo que anteriormente poderia aceitar como normal.` },
    { titulo: `CAPÍTULO 2 — O DOMÍNIO DO PECADO: QUAL É A TRANSFORMAÇÃO PRODUZIDA PELO NOVO NASCIMENTO?`, texto: `2.1. A diferença entre cometer pecado e viver dominado pelo pecado

Uma das distinções fundamentais para compreender 1 João 3:9 está na diferença entre cometer um ato pecaminoso e organizar a própria existência em torno da prática do pecado.

João não está afirmando que o pecado seja algo insignificante. Pelo contrário, ele apresenta uma oposição muito forte entre a prática do pecado e a prática da justiça.

Em 1 João 3:4, declara:

"Qualquer que comete pecado também comete iniquidade, porque o pecado é iniquidade."

O pecado não é apresentado como uma simples imperfeição comportamental. É uma realidade contrária à vontade de Deus.

Entretanto, em 1 João 2:1, João reconhece a possibilidade de um cristão pecar e apresenta Jesus Cristo como Advogado.

Assim, é necessário considerar a diferença entre:

- Uma queda reconhecida e lamentada.
- Uma prática pecaminosa persistente.
- Uma atitude de resistência ao arrependimento.
- Uma existência deliberadamente organizada contra a vontade de Deus.

Essas situações não devem ser tratadas como se fossem espiritualmente idênticas.

2.2. O que significa estar livre do domínio do pecado?

Romanos 6 apresenta uma explicação importante:

"Porque o pecado não terá domínio sobre vós, pois não estais debaixo da lei, mas debaixo da graça." (Romanos 6:14)

Paulo não está afirmando que os cristãos nunca mais cometerão pecados. O argumento do capítulo é que aqueles que pertencem a Cristo não devem continuar oferecendo seus corpos ao pecado como instrumentos de injustiça.

A graça não é apresentada como autorização para continuar vivendo na escravidão.

Romanos 6:6 ensina que o velho homem foi crucificado com Cristo para que o corpo do pecado fosse desfeito e o indivíduo não servisse mais ao pecado como escravo.

A liberdade cristã, portanto, envolve uma mudança de domínio e de orientação.

2.3. O cristão ainda enfrenta tentações?

Sim.

A tentação não é necessariamente equivalente à prática do pecado.

Tiago 1:14-15 descreve uma progressão entre desejo, atração e consumação do pecado.

Hebreus 4:15 afirma que Jesus foi tentado em todas as coisas, mas sem pecado.

Isso demonstra que a experiência da tentação, isoladamente, não deve ser confundida com a consumação do pecado.

O cristão precisa aprender a reconhecer os desejos contrários à vontade de Deus e resistir a eles.

Gálatas 5:16 apresenta a orientação:

"Andai em Espírito e não cumprireis a concupiscência da carne."

2.4. Existe diferença entre uma queda e uma vida dominada pelo pecado?

Existe uma diferença importante, embora não seja correto estabelecer uma fórmula matemática para determinar quantas quedas caracterizam um estilo de vida pecaminoso.

Uma queda pode ser acompanhada de reconhecimento, arrependimento, confissão e busca de restauração.

Por outro lado, uma prática persistente pode envolver justificativas, resistência à correção e ausência de disposição para abandonar o comportamento.

A avaliação deve considerar a natureza da conduta, a postura diante da verdade, a disposição para o arrependimento e o conjunto da vida.

Conclusão do capítulo

O novo nascimento não significa necessariamente que todas as tentações e possibilidades de queda desapareceram. Significa que o pecado não deve mais ser aceito como senhor da existência. A graça de Deus não apenas perdoa: ela também transforma e capacita para uma nova maneira de viver.` },
    { titulo: `CAPÍTULO 3 — O QUE SIGNIFICA PERMANECER EM CRISTO?`, texto: `3.1. O significado de permanecer

A expressão permanecer em Cristo aparece repetidamente nos escritos joaninos.

O verbo grego é μένω (menō), que possui sentidos como permanecer, continuar e habitar.

Em João 15, Jesus utiliza a figura da videira e dos ramos:

"Estai em mim, e eu, em vós." (João 15:4)

A imagem apresenta uma relação de dependência contínua.

O ramo não possui vida independente da videira. Sua existência e capacidade de produzir frutos dependem da ligação com ela.

Da mesma maneira, a vida cristã não pode ser compreendida como uma realização espiritual independente de Cristo.

3.2. Permanecer é apenas pensar em Cristo?

Não.

Pensar em Cristo, estudar a Bíblia e manter a mente ocupada com assuntos religiosos podem fazer parte da vida cristã, mas não esgotam o significado da permanência.

Em 1 João 2:24, o apóstolo relaciona a permanência à continuidade naquilo que foi ouvido desde o princípio.

Em 1 João 3:24, relaciona a permanência em Deus à obediência aos seus mandamentos e à ação do Espírito.

Portanto, permanecer em Cristo envolve:

- Fidelidade à verdade recebida.
- Confiança em Jesus.
- Comunhão com Deus.
- Obediência aos mandamentos.
- Dependência da ação do Espírito Santo.
- Continuidade na fé.

3.3. Qual é a relação entre a mente e o comportamento?

Os pensamentos influenciam desejos, decisões e atitudes.

Romanos 8:5-6 apresenta a diferença entre a inclinação da carne e a inclinação do Espírito.

Colossenses 3:2 orienta:

"Pensai nas coisas que são de cima e não nas que são da terra."

Isso não significa que a transformação cristã seja simplesmente uma técnica de controle mental.

A renovação da mente está relacionada à transformação espiritual e à orientação da vida pela verdade de Deus.

3.4. É possível professar Cristo e viver contra seus ensinamentos?

Sim, é possível existir uma contradição entre profissão religiosa e comportamento.

Jesus advertiu sobre aqueles que o chamariam de Senhor sem fazer a vontade do Pai (Mateus 7:21).

João também apresenta a obediência como evidência da relação com Deus.

Isso não significa que toda desobediência isolada comprove ausência de fé. Significa que uma profissão de fé que permanece completamente desconectada da vida precisa ser examinada.

Conclusão do capítulo

Permanecer em Cristo significa viver em uma relação contínua de dependência, fidelidade e comunhão com ele. Não é apenas uma disposição mental, mas uma realidade espiritual que se manifesta na fé, na obediência e no amor.` },
    { titulo: `CAPÍTULO 4 — POR QUE JOÃO AFIRMA QUE O NASCIDO DE DEUS NÃO PRATICA O PECADO E NÃO PODE PECAR?`, texto: `4.1. A estrutura de 1 João 3:9

O versículo apresenta três elementos fundamentais:

1. Aquele que nasceu de Deus não pratica o pecado.
2. A semente de Deus permanece nele.
3. Ele não pode pecar porque nasceu de Deus.

O argumento não está limitado ao comportamento exterior. João relaciona a prática do pecado à origem espiritual da pessoa.

A expressão "porque a sua semente permanece nele" apresenta a razão da incompatibilidade entre o nascimento divino e a prática do pecado.

4.2. Análise do original grego

O texto grego crítico de 1 João 3:9 contém as seguintes expressões:

• Grego — Transliteração — Sentido
• γεγέννηται — gegennētai — Nasceu, foi gerado
• σπέρμα — sperma — Semente
• ἁμαρτίαν οὐ ποιεῖ — hamartian ou poiei — Não pratica o pecado
• οὐ δύναται ἁμαρτάνειν — ou dynatai hamartanein — Não pode pecar

A construção merece atenção especial.

4.2.1. "Não pratica o pecado"

A expressão grega ἁμαρτίαν οὐ ποιεῖ apresenta o substantivo pecado como objeto do verbo fazer ou praticar.

O sentido deve ser investigado dentro do argumento de 1 João 3:4-10, no qual o apóstolo contrasta a prática da injustiça com a prática da justiça.

A interpretação de que João está tratando de uma prática característica ou persistente é coerente com esse contexto.

Entretanto, não se deve afirmar que o tempo presente, sozinho, determina obrigatoriamente esse sentido.

4.2.2. "Não pode pecar"

A expressão οὐ δύναται ἁμαρτάνειν contém o verbo δύναμαι (dynamai), que significa poder ou ser capaz, seguido de um infinitivo.

A expressão é forte. João não diz simplesmente que o nascido de Deus não deveria pecar. Ele afirma que não pode pecar porque nasceu de Deus.

A questão é determinar a natureza dessa impossibilidade.

Uma interpretação considera que o apóstolo descreve a incompatibilidade entre a nova origem espiritual e a continuidade da prática pecaminosa.

Outra leitura enfatiza a força absoluta da expressão e procura explicar como ela se relaciona com a perfeição cristã.

A análise precisa considerar o contexto da carta, e não somente uma palavra isolada.

4.3. O significado da semente de Deus

A palavra grega σπέρμα (sperma) significa semente.

João afirma que a semente de Deus permanece na pessoa nascida dele.

A imagem indica um princípio de vida cuja origem está em Deus e cuja permanência produz consequências.

Existem interpretações que relacionam essa semente à Palavra de Deus, outras à ação regeneradora do Espírito Santo e outras ao princípio da vida divina comunicado ao regenerado.

1 Pedro 1:23 associa o novo nascimento à semente incorruptível, mediante a Palavra de Deus.

Entretanto, não é adequado afirmar que 1 João 3:9 identifica explicitamente a semente com uma dessas interpretações sem demonstrar o argumento contextual.

4.4. Como conciliar 1 João 3:9 com 1 João 1:8-10?

Essa é a questão interpretativa decisiva.

Em 1 João 1:8, o apóstolo rejeita a afirmação de que não temos pecado.

Em 1 João 1:9, apresenta a confissão e o perdão.

Em 1 João 2:1, reconhece a possibilidade de alguém pecar e apresenta Cristo como Advogado.

Em 1 João 3:9, afirma que aquele que nasceu de Deus não pratica o pecado e não pode pecar.

Uma interpretação que considere essas passagens conjuntamente entende que João distingue a possibilidade de cometer uma falha da continuidade de uma existência caracterizada pelo pecado.

A regeneração não significa que a pessoa se tornou absolutamente incapaz de qualquer transgressão. Significa que a prática do pecado não corresponde à nova vida recebida de Deus.

4.5. Principais interpretações teológicas

Interpretação da impecabilidade: entende que a afirmação descreve uma condição de ausência de pecado na pessoa verdadeiramente regenerada, ou uma forma específica de perfeição cristã.

Sua dificuldade principal é explicar como essa leitura se relaciona com as afirmações de 1 João 1:8-2:2.

Interpretação da prática habitual: entende que João está negando a continuidade de uma vida caracterizada pela prática do pecado.

Sua força está na relação com o contraste entre praticar pecado e praticar justiça em 1 João 3:4-10.

Sua limitação é que a interpretação não pode depender exclusivamente da ideia de que o presente grego sempre significa hábito.

Interpretação da incompatibilidade espiritual: enfatiza que a origem divina e a prática do pecado pertencem a princípios de vida incompatíveis.

Essa leitura destaca o argumento teológico da permanência da semente de Deus.

Sua dificuldade está em explicar com precisão como essa incompatibilidade se manifesta em pessoas que ainda cometem pecados.

4.6. Qual interpretação melhor explica o conjunto da carta?

A interpretação que compreende 1 João 3:9 como uma afirmação da incompatibilidade entre o nascimento divino e a continuidade da prática do pecado oferece uma maneira consistente de relacionar o versículo com 1 João 1:8-2:2.

Ela preserva simultaneamente duas verdades:

- O cristão não deve tratar o pecado como uma maneira normal e aceitável de viver.
- O cristão que peca necessita reconhecer sua condição e buscar a restauração oferecida em Cristo.

Conclusão do capítulo

João apresenta o novo nascimento como uma realidade incompatível com a continuidade de uma vida dominada pelo pecado. A semente de Deus permanece no regenerado e constitui a razão espiritual dessa nova orientação. A expressão "não pode pecar" não deve ser enfraquecida, mas também não deve ser isolada das afirmações do próprio apóstolo sobre pecado, confissão e intercessão de Cristo.` },
    { titulo: `CAPÍTULO 5 — O CRISTÃO AUTÊNTICO QUE PECA PERDE A SALVAÇÃO?`, texto: `5.1. A possibilidade de um cristão pecar

1 João 2:1 apresenta uma orientação muito importante:

"Meus filhinhos, estas coisas vos escrevo, para que não pequeis; e, se alguém pecar, temos um Advogado para com o Pai, Jesus Cristo, o justo."

João apresenta simultaneamente um propósito e uma provisão.

O propósito é que os cristãos não pequem.

A provisão é que, caso alguém peque, existe um Advogado junto ao Pai.

Isso demonstra que a possibilidade de uma queda não é ignorada na vida cristã.

O texto, entretanto, não deve ser utilizado como autorização para continuar pecando.

5.2. O que acontece quando o cristão peca?

O pecado representa uma violação da vontade de Deus e prejudica a comunhão.

A resposta bíblica não é esconder, justificar ou normalizar o erro.

1 João 1:9 ensina:

"Se confessarmos os nossos pecados, ele é fiel e justo para nos perdoar os pecados e nos purificar de toda injustiça."

A confissão envolve reconhecer a realidade do pecado diante de Deus.

O perdão não significa que o comportamento foi correto. Significa que Deus oferece restauração mediante sua fidelidade e justiça.

5.3. Todo pecado representa perda da salvação?

A Bíblia apresenta diferentes textos que precisam ser considerados.

João 10:28-29 destaca a segurança daqueles que pertencem a Cristo.

Romanos 8:1 declara que não há condenação para os que estão em Cristo Jesus.

Entretanto, Hebreus 3:12-14 apresenta advertências contra a incredulidade e o afastamento do Deus vivo.

Hebreus 10:26-31 adverte seriamente contra o pecado deliberado após o conhecimento da verdade.

Essas passagens não devem ser colocadas umas contra as outras sem análise.

Existem diferentes posições cristãs sobre a possibilidade de perda da salvação.

A tradição reformada enfatiza a perseverança dos verdadeiros regenerados, sustentada pela graça de Deus.

Outras tradições defendem que o crente pode abandonar a fé e apostatar, rejeitando deliberadamente a graça recebida.

Ambas precisam ser avaliadas à luz do conjunto das Escrituras.

5.4. Existe diferença entre cair e abandonar a fé?

Sim.

Uma queda moral, uma vida de resistência ao arrependimento e o abandono deliberado da fé não são necessariamente a mesma realidade.

A Bíblia apresenta exemplos de pessoas que falharam gravemente e foram restauradas.

Pedro negou Jesus, mas posteriormente foi restaurado.

Davi cometeu pecados graves, reconheceu sua culpa e buscou misericórdia no Salmo 51.

Esses exemplos demonstram que uma queda não precisa representar o encerramento definitivo da relação com Deus.

Entretanto, não autorizam concluir que toda pessoa que persiste no pecado está espiritualmente segura.

5.5. Como compreender a segurança da salvação?

A segurança cristã deve estar fundamentada em Cristo, e não na ideia de que o indivíduo alcançou perfeição moral absoluta.

A confiança não está em nunca ter cometido uma falha, mas na obra de Jesus, em sua graça e na fidelidade de Deus.

Ao mesmo tempo, essa segurança não deve ser utilizada para justificar uma vida contrária aos ensinamentos de Cristo.

Conclusão do capítulo

A Bíblia não permite afirmar que todo pecado cometido por um cristão provoca automaticamente a perda da salvação. Também não permite transformar a graça em justificativa para permanecer deliberadamente no pecado. A segurança da salvação precisa ser compreendida em conjunto com a obra de Cristo, o arrependimento, a fé e as advertências bíblicas sobre a perseverança.` },
    { titulo: `CAPÍTULO 6 — A TRISTEZA PELO PRÓPRIO PECADO: ARREPENDIMENTO, CULPA OU MEDO DA CONDENAÇÃO?`, texto: `6.1. A pessoa que detesta o próprio pecado

Considere uma pessoa que reconhece seus erros, sente profunda tristeza pelo que fez, não deseja continuar pecando e busca sinceramente o perdão de Deus.

Essa pessoa pode experimentar uma luta interior intensa.

Ela sabe que o pecado é contrário à vontade de Deus, deseja abandoná-lo, mas ainda enfrenta dificuldades.

Sua tristeza pode ser acompanhada de perguntas como:

- Será que Deus ainda me aceita?
- Será que perdi minha salvação?
- Por que continuo falhando?
- Será que minha tristeza demonstra arrependimento verdadeiro?
- Será que não conheço suficientemente o amor de Cristo?

Essas perguntas precisam ser examinadas à luz da Bíblia.

6.2. A tristeza segundo Deus

Paulo escreve:

"Porque a tristeza segundo Deus opera arrependimento para a salvação, da qual ninguém se arrepende; mas a tristeza do mundo opera a morte." (2 Coríntios 7:10)

O texto apresenta uma distinção importante.

Nem toda tristeza relacionada ao pecado possui o mesmo significado espiritual.

A tristeza segundo Deus conduz ao arrependimento.

Ela não se limita ao sofrimento pelas consequências pessoais. Envolve reconhecer o erro diante de Deus e desejar uma mudança de direção.

A tristeza do mundo, por outro lado, pode permanecer concentrada na vergonha, na perda, no medo das consequências e no sofrimento pessoal, sem produzir verdadeiro arrependimento.

6.3. Detestar o pecado é sinal de transformação?

Pode ser uma evidência de uma consciência sensível à vontade de Deus.

Uma pessoa que reconhece seu pecado, não deseja justificá-lo e busca abandoná-lo demonstra uma postura diferente daquela que se orgulha da transgressão ou se recusa deliberadamente a reconhecer o erro.

Entretanto, a tristeza isoladamente não é prova suficiente da regeneração.

É necessário observar sua relação com a fé, o arrependimento, a confiança em Cristo e os frutos produzidos na vida.

6.4. A diferença entre convicção e condenação

Romanos 8:1 declara:

"Portanto, agora nenhuma condenação há para os que estão em Cristo Jesus."

Essa passagem precisa ser compreendida em seu contexto.

Paulo não ensina que o cristão deixa de reconhecer o pecado. O capítulo apresenta a libertação da condenação e a nova vida no Espírito.

A convicção do pecado leva ao reconhecimento do erro e à busca de restauração.

A condenação permanente, por outro lado, pode produzir desespero, afastamento e a sensação de que não existe mais possibilidade de perdão.

A Bíblia apresenta Cristo como aquele que intercede pelos seus.

Hebreus 4:16 convida os cristãos a se aproximarem do trono da graça para receber misericórdia e encontrar auxílio.

6.5. Uma pessoa pode conhecer a doutrina da punição, mas não compreender profundamente o amor de Cristo?

Sim.

Uma pessoa pode conhecer muitas advertências bíblicas e ainda possuir uma compreensão incompleta da graça.

Pode compreender que Deus condena o pecado, mas não compreender adequadamente a suficiência da obra de Cristo.

Nesse caso, sua vida espiritual pode ser dominada por medo e insegurança.

Entretanto, não se deve concluir que toda preocupação com o pecado seja sinal de desconhecimento do amor de Cristo.

O amor de Deus não elimina a seriedade do pecado. Ele oferece o caminho de perdão, reconciliação e transformação.

6.6. Como o cristão deve reagir depois de pecar?

O caminho bíblico envolve:

1. Reconhecer honestamente o pecado.
2. Não procurar justificativas para o erro.
3. Confessar a Deus.
4. Buscar o perdão fundamentado na obra de Cristo.
5. Abandonar o comportamento pecaminoso.
6. Procurar reparar os danos causados, quando possível.
7. Continuar caminhando em fé e obediência.

O arrependimento não significa viver eternamente se castigando pelo erro já confessado.

Também não significa tratar o pecado com indiferença.

Conclusão do capítulo

A tristeza pelo próprio pecado pode ser uma evidência de arrependimento e de uma consciência sensível à vontade de Deus. Não é, por si só, prova de condenação nem garantia automática de regeneração. O cristão precisa aprender a reconhecer a gravidade do pecado sem rejeitar a suficiência da graça de Cristo.` },
    { titulo: `CAPÍTULO 7 — O AMOR DE CRISTO: LIBERDADE DO PECADO OU VIDA GOVERNADA PELO MEDO?`, texto: `7.1. Cristo veio para perdoar e transformar

O evangelho não apresenta Jesus apenas como aquele que remove a culpa do passado.

A obra de Cristo também está relacionada à libertação do domínio do pecado.

João Batista declarou:

"Eis o Cordeiro de Deus, que tira o pecado do mundo." (João 1:29)

Romanos 6 ensina que a união com Cristo implica uma nova relação com o pecado.

A graça não é simplesmente uma permissão para continuar fazendo aquilo que Deus condena.

Tito 2:11-12 ensina que a graça de Deus se manifestou trazendo salvação e educando os cristãos a renunciarem à impiedade e às paixões mundanas.

7.2. Obedecer por amor ou por medo?

Existem diferenças entre obedecer porque se reconhece o amor e a autoridade de Deus e obedecer exclusivamente por medo de punição.

Jesus relaciona o amor à obediência:

"Se me amardes, guardareis os meus mandamentos." (João 14:15)

A obediência cristã não deve ser reduzida a uma tentativa de comprar a aceitação divina.

O cristão obedece porque pertence a Cristo e deseja viver de maneira coerente com essa relação.

7.3. O perfeito amor lança fora o medo?

1 João 4:18 declara:

"No amor não há temor; antes, o perfeito amor lança fora o temor, porque o temor tem consigo a pena, e o que teme não é perfeito em amor."

O contexto apresenta o amor de Deus e a confiança no dia do juízo.

A expressão não significa que o cristão nunca sentirá medo diante de situações difíceis.

Também não elimina a reverência diante de Deus.

O texto trata especialmente do medo relacionado ao castigo e à condenação.

7.4. Liberdade significa ausência de responsabilidade?

Não.

Gálatas 5:13 adverte:

"Porque vós, irmãos, fostes chamados à liberdade. Não useis então da liberdade para dar ocasião à carne."

A liberdade cristã não é licença para a prática do pecado.

É liberdade para viver sob a direção do Espírito e servir a Deus.

7.5. Como o amor de Cristo transforma a relação com o pecado?

Quando uma pessoa compreende que foi amada, perdoada e reconciliada com Deus por meio de Cristo, sua obediência não precisa ser governada exclusivamente pelo medo.

Ela passa a reconhecer que a santidade não é uma tentativa de conquistar o amor divino, mas uma resposta à graça recebida.

Isso não elimina a necessidade de vigilância, arrependimento e correção.

Pelo contrário, o amor de Cristo oferece uma razão mais profunda para abandonar o pecado.

Conclusão do capítulo

O amor de Cristo liberta da escravidão do pecado e do medo da condenação, mas não elimina a responsabilidade moral. A graça conduz à santidade, a confiança não substitui o arrependimento e a liberdade não autoriza a desobediência.` },

/* ---------- renderização (não precisa mexer) ---------- */
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catDe = id => CATEGORIAS.find(c => c.id === id);
const doCat = id => ESTUDOS.filter(e => e.categoria === id);

document.getElementById("cats").innerHTML = CATEGORIAS.map(c =>
  `<a href="#cat-${c.id}" data-cat="${c.id}">${esc(c.nome)}</a>`).join("");

function marcar(catId, noIndice){
  document.getElementById("m-estudos").classList.toggle("on", !!noIndice);
  document.querySelectorAll("#cats a").forEach(a => a.classList.toggle("on", a.dataset.cat === catId));
}

function blocos(t){
  return String(t || "").trim().split(/\n\s*\n/).map(b => {
    const l = b.split("\n").map(x => x.trim()).filter(Boolean);
    if (l.length && l.every(x => /^[•\-]\s/.test(x)))
      return `<ul class="pts">${l.map(x => `<li>${esc(x.replace(/^[•\-]\s/, ""))}</li>`).join("")}</ul>`;
    return `<p>${l.map(esc).join("<br>")}</p>`;
  }).join("");
}
const secao = s => `<h2>${esc(s.titulo)}</h2>${blocos(s.texto)}`;

function indice(){
  document.title = "Estudos · Palavra e Série";
  marcar(null, true);
  app.innerHTML = `
    <h1>Estudos</h1>
    <p class="sub">Ouviu no canal? Escolha a lista do conteúdo que você ouviu e encontre o estudo.</p>
    <div class="grid">${CATEGORIAS.map(c => {
      const n = doCat(c.id).length;
      return `<a class="card" href="#cat-${c.id}">
        <h3>${esc(c.nome)}</h3>
        <p>${esc(c.desc)}</p>
        <p><b>${n ? n + (n === 1 ? " estudo" : " estudos") : "Em breve"}</b></p>
      </a>`;}).join("")}</div>`;
}

function categoria(c){
  document.title = c.nome + " · Palavra e Série";
  marcar(c.id, false);
  const lista = doCat(c.id);
  app.innerHTML = `
    <p class="sub"><a href="#">Estudos</a></p>
    <h1>${esc(c.nome)}</h1>
    <p class="sub">${esc(c.desc)}</p>
    ${lista.length ? `<div class="lista">${lista.map(e => `
      <a class="card" href="#${esc(e.id)}">
        <small>${esc(e.texto)}</small>
        <h3>${esc(e.titulo)}</h3>
        <p>${esc(e.resumo)}</p>
      </a>`).join("")}</div>` : `<p class="vazio">Nenhum estudo nesta categoria ainda.</p>`}
    <div class="cta">
      <p>Prefere ouvir? Veja esta playlist no canal.</p>
      <a class="btn sec" href="${esc(c.playlist)}" target="_blank" rel="noopener">Ver playlist no YouTube</a>
    </div>`;
  window.scrollTo(0, 0);
}

function estudo(e){
  document.title = e.titulo + " · Palavra e Série";
  const c = catDe(e.categoria);
  marcar(c ? c.id : null, false);
  const secs = e.secoes || [];
  const abertas = secs.filter(s => !s.aprofundamento);
  const fundas = secs.filter(s => s.aprofundamento);
  const outros = c ? doCat(c.id).filter(x => x.id !== e.id) : [];
  app.innerHTML = `
    <p class="sub">${c ? `<a href="#cat-${c.id}">${esc(c.nome)}</a> · ` : ""}${esc(e.texto)}</p>
    <h1>${esc(e.titulo)}</h1>
    <div class="ouvir">
      <p>${(e.mensagem || (c && c.msg) || "Se você acabou de ouvir {c}, este é o estudo. O áudio está no canal.").replace("{c}", "<b>" + esc(e.conteudo || e.texto) + "</b>")}</p>
      <a class="btn gold" href="${e.video ? "https://www.youtube.com/watch?v=" + esc(e.video) : (c ? esc(c.playlist) : CANAL)}" target="_blank" rel="noopener">${esc((c && c.botao) || "Ouvir no canal")}</a>
    </div>
    ${e.video ? `<div class="player"><iframe src="https://www.youtube.com/embed/${esc(e.video)}" title="${esc(e.titulo)}" loading="lazy" allowfullscreen></iframe></div>` : ""}
    ${e.abertura ? blocos(e.abertura) : ""}
    ${abertas.map(secao).join("")}
    ${fundas.length ? `<details class="aprof"><summary>Aprofundamento</summary><div class="inner">${fundas.map(secao).join("")}</div></details>` : ""}
    <div class="cta">
      <p>Quer ir mais fundo em ${esc(e.texto)}? Abra a Matriz de Pesquisa.</p>
      <a class="btn main" href="${MATRIZ}">Aprofundar ${esc(e.texto)}</a>
      <a class="btn sec" href="${e.video ? "https://www.youtube.com/watch?v=" + esc(e.video) : (c ? esc(c.playlist) : CANAL)}" target="_blank" rel="noopener">Voltar ao canal</a>
      <a class="btn sec" href="${CANAL}?sub_confirmation=1" target="_blank" rel="noopener">Inscrever-se</a>
    </div>
    <div class="outros">
      ${outros.length ? `<h2>Mais em ${esc(c.nome)}</h2>` + outros.map(o => `<p><a href="#${esc(o.id)}">${esc(o.titulo)}</a></p>`).join("") : ""}
      <p><a href="#${c ? "cat-" + c.id : ""}">${c ? "Ver todos em " + esc(c.nome) : "Ver todos os estudos"}</a></p>
    </div>`;
  window.scrollTo(0, 0);
}

function rota(){
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return indice();
  if (id.startsWith("cat-")) {
    const c = catDe(id.slice(4));
    if (c) return categoria(c);
  }
  const e = ESTUDOS.find(x => x.id === id);
  if (e) return estudo(e);
  document.title = "Estudo não encontrado · Palavra e Série";
  marcar(null, false);
  app.innerHTML = `<div class="nf"><h1>Estudo não encontrado</h1>
    <p>Esse link não corresponde a nenhum estudo publicado. <a href="#">Veja todos os estudos.</a></p></div>`;
}
window.addEventListener("hashchange", rota);
rota();
</script>
