<html lang="pt-BR">
<head>

<style>
:root{
  --bg:#0d0a06; --panel:#17110a; --line:#3a2c14; --gold:#d4a132; --gold-d:#9c761f;
  --text:#f1ead8; --muted:#a89c82; --ok:#1fcf6b;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --body:Georgia,"Times New Roman",serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse 80% 420px at 50% 0,#2a1d08 0,transparent 70%) no-repeat,var(--bg);color:var(--text);font-family:var(--body);font-size:18px;line-height:1.7}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header.top{border-bottom:1px solid var(--line);background:radial-gradient(ellipse 60% 100% at 25% 40%,rgba(212,161,50,.22),transparent 70%),linear-gradient(180deg,#1a1208,#0d0a06)}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.top .wrap{display:flex;gap:20px;align-items:center;padding-top:22px;padding-bottom:20px}
.logo{flex:none;width:76px;height:76px;border-radius:50%;background:#000;border:3px solid var(--gold);box-shadow:0 0 22px rgba(212,161,50,.55);display:grid;place-items:center;font-family:"Times New Roman",serif;font-style:italic;font-weight:700;font-size:1.8rem;color:var(--gold);text-decoration:none}
.brand{display:block;font-family:"Times New Roman",Times,serif;font-size:2rem;font-weight:700;letter-spacing:.14em;color:var(--gold);text-decoration:none;line-height:1.1;padding-bottom:8px;border-bottom:1px solid var(--gold)}
.brand-sub{font-family:"Times New Roman",Times,serif;font-size:1.05rem;margin:8px 0 2px;color:var(--text)}
.brand-tag{font-family:"Times New Roman",Times,serif;font-size:.85rem;color:var(--gold-d);margin:0;filter:brightness(1.3)}
nav.menu{border-bottom:1px solid var(--line);background:#0d0a06}
nav.menu .wrap{display:flex;flex-wrap:wrap;gap:6px 22px;padding-top:10px;padding-bottom:10px}
nav.menu a{font-family:var(--ui);font-size:.8rem;font-weight:600;color:var(--text);text-decoration:none}
nav.menu a:hover{color:var(--gold)}
nav.cats{background:#0a0804}
nav.cats .wrap{gap:8px;padding-top:12px;padding-bottom:12px}
nav.cats a{border:1px solid var(--line);padding:6px 12px;font-weight:600}
nav.cats a:hover{border-color:var(--gold)}
nav.cats a.on{background:var(--gold);border-color:var(--gold);color:#1a1208;border-bottom:1px solid var(--gold);padding-bottom:6px}
.grid{display:grid;gap:12px;margin-top:24px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card b{font-family:var(--ui);font-size:.8rem;color:var(--gold)}
nav.menu a.on{color:var(--gold);border-bottom:2px solid var(--gold);padding-bottom:2px}

main{padding:36px 0 72px}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
h1{font-size:2.6rem;font-weight:700}
h2{font-size:1.7rem;font-weight:600;color:var(--gold);margin:40px 0 12px}
h3{font-size:1.25rem;font-weight:600;margin:0 0 4px}
p{margin:0 0 14px}
ul.pts{margin:0 0 14px;padding-left:22px}
ul.pts li{margin-bottom:6px}
.sub{font-family:var(--ui);font-size:.9rem;color:var(--muted);margin:8px 0 0}
.aprof{margin-top:44px;border:1px solid var(--gold-d);background:var(--panel)}
.aprof summary{cursor:pointer;padding:18px 20px;font-family:var(--serif);font-size:1.5rem;font-weight:600;color:var(--gold);list-style:none}
.aprof summary::-webkit-details-marker{display:none}
.aprof summary::after{content:"＋";float:right;font-family:var(--ui)}
.aprof[open] summary::after{content:"－"}
.aprof .inner{padding:0 20px 20px}
.aprof h2{font-size:1.3rem;margin:26px 0 10px}
.ouvir{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;margin:24px 0;padding:18px 20px;background:var(--panel);border-left:3px solid var(--gold)}
.ouvir p{margin:0;flex:1 1 320px}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1208;margin:0}
.player{position:relative;aspect-ratio:16/9;margin:0 0 24px;border:1px solid var(--line)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.cta{margin-top:48px;padding:24px;background:var(--panel);border:1px solid var(--line);text-align:center}
.cta p{margin-bottom:16px}
.btn{display:inline-block;font-family:var(--ui);font-weight:700;font-size:.9rem;text-decoration:none;padding:12px 22px;margin:4px;border:1px solid var(--gold)}
.btn.main{background:var(--ok);border-color:var(--ok);color:#06210f}
.btn.sec{color:var(--gold)}
.btn:hover{filter:brightness(1.12)}
.outros{margin-top:40px}
.outros a{font-family:var(--ui);font-size:.95rem}
.lista{display:grid;gap:12px;margin-top:24px}
.card{display:block;background:var(--panel);border:1px solid var(--line);padding:18px 20px;text-decoration:none;color:var(--text)}
.card:hover{border-color:var(--gold)}
.card small{font-family:var(--ui);font-size:.8rem;color:var(--gold)}
.card p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.vazio{color:var(--muted);font-style:italic;margin-top:24px}
.nf{padding:32px 0}
footer{border-top:1px solid var(--line);padding:24px 0;font-family:var(--ui);font-size:.8rem;color:var(--muted);text-align:center}
@media (max-width:560px){body{font-size:17px}h1{font-size:2.1rem}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

<script>
/* ==========================================================
   COMO CADASTRAR UM ESTUDO

   1. Copie o MODELO abaixo e cole dentro da lista ESTUDOS,
      entre os colchetes [ ].
   2. Entre um estudo e o próximo vai uma VÍRGULA.
   3. Os textos ficam entre ACENTOS GRAVES ( ` ), não entre
      aspas. Assim você pode escrever com aspas, quebras de
      linha e hebraico à vontade. Só não use o próprio acento
      grave dentro do texto.
   4. Em "texto", deixe uma LINHA EM BRANCO entre parágrafos.
      Linhas que começam com "• " viram lista.
   5. Cada seção é do tamanho e com o título que você quiser.
      Com aprofundamento: true, a seção vai para a parte que
      abre ao clicar. Sem isso, fica aberta para todos.

   MODELO (copie daqui, sem os asteriscos):

   {
     id: "salmo-1",
     categoria: "salmos",   (serie, oracao, engano, direcao ou salmos)
     titulo: "Estudo do Salmo 1",
     texto: "Salmos 1",
     resumo: `Uma frase para o índice.`,
     conteudo: `o Salmo 1`,
     video: ``,   (opcional: ID do vídeo do YouTube; com ele, o vídeo aparece na página)
     secoes: [
       { titulo: `Título da seção`, texto: `Parágrafo 1.

Parágrafo 2.

• Item de lista
• Outro item` },
       { titulo: `Outra seção`, texto: `...` },
       { titulo: `Seção técnica`, aprofundamento: true, texto: `...` }
     ]
   },

   O "id" é o final do link e não deve mudar depois de
   divulgado: ...redes-sociais-estudos.html#salmo-1
   ========================================================== */

const CANAL = "https://www.youtube.com/@Palavraeserie";
const MATRIZ = "pesquisa/matriz-pro.html";

/* As 5 categorias (playlists). O "id" é o que se escreve em "categoria" no estudo.
   "msg" é a mensagem do topo do estudo ({c} vira o conteúdo) e "botao" é o texto do botão.
   Se um link de playlist estiver incompleto, corrija o campo "playlist". */
const CATEGORIAS = [
  { id: "serie",   nome: "Série de estudo bíblico",     playlist: "https://www.youtube.com/playlist?list=PLMUW8wrJsx-s&playnext=1&index=1",
    desc: "Estudos de textos bíblicos frequentemente interpretados de forma equivocada.",
    msg: "Se você acabou de ouvir {c}, este é o estudo do texto, para entender o que ele diz e o que não diz. Se quiser ouvir de novo, o áudio está no canal.",
    botao: "Ouvir de novo no canal" },
  { id: "oracao",  nome: "Momentos de oração",          playlist: "https://www.youtube.com/playlist?list=PLH3lq9vJzsio&playnext=1&index=1",
    desc: "Orações e momentos de meditação baseados nas Escrituras.",
    msg: "Se você acabou de ouvir {c}, este é o estudo das Escrituras em que a oração se apoia. Se quiser orar de novo, o áudio está no canal.",
    botao: "Orar de novo no canal" },
  { id: "engano",  nome: "Tirando a mente do engano",   playlist: "https://www.youtube.com/playlist?list=PLNL8itelYU-E&playnext=1&index=1",
    desc: "Estudos para discernir o que o mundo, e até a igreja, aceita como normal, mas a Escritura não.",
    msg: "Se você acabou de ouvir {c}, este é o estudo que confere o assunto com a Escritura. Se quiser ouvir de novo, o áudio está no canal.",
    botao: "Ouvir de novo no canal" },
  { id: "direcao", nome: "Bíblia e direção de vida",    playlist: "https://www.youtube.com/playlist?list=PLQP9mSjlQCV0&playnext=1&index=1",
    desc: "Respostas bíblicas para dúvidas que desafiam a fé e a vida cristã.",
    msg: "Se você acabou de ouvir {c}, este é o estudo bíblico por trás da resposta. Se quiser ouvir de novo, o áudio está no canal.",
    botao: "Ouvir de novo no canal" },
  { id: "salmos",  nome: "Salmos e reflexões bíblicas", playlist: "https://www.youtube.com/playlist?list=PLdXZVtjxhh18",
    desc: "Estudo e reflexão sobre os Salmos: texto, contexto e aplicação à vida cristã.",
    msg: "Se você acabou de ouvir {c}, este é o estudo. Se quiser se edificar ouvindo o áudio, ele está no canal.",
    botao: "Ouvir no canal" }
];

const ESTUDOS = [

{
  id: "salmo-1",
  categoria: "salmos",
  titulo: "Estudo do Salmo 1",
  texto: "Salmos 1",
  resumo: `O Salmo 1 funciona como o pórtico sapiencial de todo o Saltério.`,
  conteudo: `o Salmo 1`,
  video: ``,   /* ID do vídeo do YouTube (opcional). Ex.: se o link é youtube.com/watch?v=AbC123, escreva AbC123 */
  secoes: [
    { titulo: `1. IDENTIFICAÇÃO DA ETAPA`, texto: `• ETAPA: Análise da Mensagem Principal, Análise Lexical (Substantivos, Adjetivos e Verbos), Relação com Deus e Comentário Teológico de Salmos 1.
• MÓDULO: Análise exegética e textual com base no texto bíblico como fonte primária.` },

    { titulo: `2. DADOS/EVIDÊNCIAS`, texto: `O texto de Salmos 1 (conforme o texto hebraico tradicional / Texto Massorético) é estruturado em duas vias fundamentais para a existência humana: a via do justo e a via do ímpio.

Evidências Textuais (Versículos 1 a 6):

• v. 1: A descrição do homem que não anda no conselho dos ímpios, não se detém no caminho dos pecadores e não se assenta na roda dos escarnecedores.
• v. 2: O prazer (ḥēpeṣ) desse homem está na lei do Senhor (tôratYHWH), e na sua lei medita (hāgâ) de dia e de noite.
• v. 3: Ele é como árvore plantada junto a correntes de águas (palgê mōyim), que dá o seu fruto na sua estação (bə‘ittô), cuja folha não cai; e tudo quanto faz prosperará (yāṣlîaḥ).
• v. 4: Os ímpios não são assim; são como a palha que o vento espalha.
• v. 5: Por isso os ímpios não subsistirão no juízo, nem os pecadores na congregação dos justos.
• v. 6: Porque o Senhor conhece (yōdēa‘) o caminho dos justos, mas o caminho dos ímpios perecerá (tōbēd).` },

    { titulo: `3. ANÁLISE ESPECÍFICA DA ETAPA`, texto: `Mensagem Principal, Caráter (Advertência, Motivação, Esperança) e Relacionamento com Deus:

• Mensagem Principal: A centralidade da Palavra de Deus (Tora) como critério absoluto para distinguir a vida que floresce (vida com Deus) da vida que se esvazia e perece (autonomia ímpia).
• O que apresenta ao destinatário: O Salmo 1 apresenta simultaneamente advertência (sobre o perigo progressivo do pecado e a ruína final dos ímpios), motivação (para buscar o prazer e a meditação constante nas Escrituras) e esperança (na constância da vida sustentada por Deus e no Seu conhecimento pessoal sobre o justo).
• Ensino sobre o relacionamento com Deus: Ensina que a comunhão com Deus não é estática, mas moldada por uma rejeição ativa à corrupção moral (v. 1) e por um deleite voluntário e contínuo na instrução divina (tôrah, v. 2). O relacionamento é marcado pela intimidade e aprovação divina ("o Senhor conhece", v. 6).` },

    { titulo: `Análise Lexical (Principais Substantivos, Adjetivos e Verbos)`, texto: `• Nota metodológica: As análises morfológicas e transliterações abaixo baseiam-se estritamente no vocabulário hebraico do texto-base (BHS).

Substantivos:

1. תּוֹרָה (tôrāh)

• Transliteração: tôrāh
• Significado: Lei, instrução, ensino, direção.
• Classificação gramatical: Substantivo feminino singular.

2. דֶּרֶךְ (derek)

• Transliteração: derek
• Significado: Caminho, estrada, modo de proceder, conduta.
• Classificação gramatical: Substantivo comum (comum de dois gêneros) singular.

3. מֹושָׁב (mōšāb)

• Transliteração: mōšāb
• Significado: Assento, habitação, assembleia, roda (de pessoas).
• Classificação gramatical: Substantivo masculino singular.

Adjetivos:

1. רָשָׁע (rāšā‘)

• Transliteração: rāšā‘
• Significado: Ímpio, culpado, perverso, transgressor.
• Classificação gramatical: Adjetivo (frequentemente usado como substantivo) masculino singular.

2. צַדִּיק (ṣaddîq)

• Transliteração: ṣaddîq
• Significado: Justo, reto, inocente, conforme à norma divina.
• Classificação gramatical: Adjetivo (frequentemente usado como substantivo) masculino singular.

Verbos:

1. הָגָה (hāgâ)

• Transliteração: hāgâ
• Significado: Meditar, murmurar, resmungar, pronunciar em voz baixa, estudar.
• Classificação gramatical: Verbo, radical Qal, particípio ou perfeito (aqui forma verbal finita/imperfeita/participial dependendo da flexão contextual, no v. 2: imperfeito yehgeh = "ele meditará").

2. צָלַח (ṣālaḥ)

• Transliteração: ṣālaḥ
• Significado: Prosperar, ter sucesso, avançar com êxito.
• Classificação gramatical: Verbo, radical Qal, imperfeito masculino singular (yāṣlîaḥ).

3. יָדַע (yāda‘)

• Transliteração: yāda‘
• Significado: Conhecer, saber, reconhecer com intimidade e cuidado.
• Classificação gramatical: Verbo, radical Qal, particípio ativo (yōdēa‘).` },

    { titulo: `Comentário Teológico (Diferenciação entre Evidência, Interpretação e Aplicação)`, texto: `• Evidência textual: O texto contrapõe explicitamente duas categorias de pessoas através de metáforas agrícolas e existenciais: a árvore enraizada junto às águas correntes versus a palha dispersa pelo vento; o caminho que subsiste versus o caminho que perece (tōbēd).
• Interpretação teológica: O olhar de Deus sobre a humanidade neste texto não é neutro. Deus observa e "conhece" (yāda‘ — indicando um conhecimento relacional profundo e eletivo) a direção da vida do justo, ao passo que a conduta autônoma e rebelde dos ímpios conduz inexoravelmente à dissolução e ao vazio ontológico e moral. O texto apresenta uma teologia retributiva sapiencial, onde a bênção flui de estar enraizado na revelação de Deus (tôrah).
• Aplicação teológica: Convida o destinatário a examinar as fontes de seu conselho diário, a recusar a cumplicidade com estruturas destrutivas de pensamento e a cultivar uma disciplina contemplativa e amorosa em relação às Escrituras Sagradas, confiando que a verdadeira prosperidade (não necessariamente material, mas existencial e espiritual) é fruto da sustentação divina.` },

    { titulo: `4. LIMITAÇÕES/INCERTEZAS`, texto: `• O Salmo 1 não traz título ou autoria explícita no texto massorético (embora a tradição judaica o associe frequentemente a Davi ou o veja como um prólogo editorial para todo o saltério). Por ser uma questão de atribuição externa, evita-se afirmar categoricamente a autoria autoral direta.
• O termo hāgâ (v. 2) possui um leque semântico que transita entre "murmurar/cochichar" (som baixo) e "meditar/pensar profundamente", exigindo cautela para não impor conceitos modernos de meditação abstrata, sendo mais preciso entendê-lo como a recitação murmurada e constante da Palavra.` },

    { titulo: `5. CONCLUSÃO PROVISÓRIA`, texto: `O Salmo 1 funciona como o pórtico sapiencial de todo o Saltério, estabelecendo que a felicidade (ašrê) e a estabilidade humana dependem inteiramente da rejeição ao pecado e da comunhão constante e prazerosa com a instrução de Deus (Tora). Ele adverte sobre o fim trágico da impiedade e assegura a esperança de que o justo é ativamente vigiado e sustentado pelo conhecimento íntimo de Deus.` }
  ]
},

/* >>>>>>>>>> COLE O PRÓXIMO ESTUDO AQUI, ACIMA DESTA LINHA <<<<<<<<<< */

];

/* ---------- renderização (não precisa mexer) ---------- */
const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catDe = id => CATEGORIAS.find(c => c.id === id);
const doCat = id => ESTUDOS.filter(e => e.categoria === id);

document.getElementById("cats").innerHTML = CATEGORIAS.map(c =>
  `<a href="#cat-${c.id}" data-cat="${c.id}">${esc(c.nome)}</a>`).join("");

function marcar(catId, noIndice){
  document.getElementById("m-estudos").classList.toggle("on", !!noIndice);
  document.querySelectorAll("#cats a").forEach(a => a.classList.toggle("on", a.dataset.cat === catId));
}

function blocos(t){
  return String(t || "").trim().split(/\n\s*\n/).map(b => {
    const l = b.split("\n").map(x => x.trim()).filter(Boolean);
    if (l.length && l.every(x => /^[•\-]\s/.test(x)))
      return `<ul class="pts">${l.map(x => `<li>${esc(x.replace(/^[•\-]\s/, ""))}</li>`).join("")}</ul>`;
    return `<p>${l.map(esc).join("<br>")}</p>`;
  }).join("");
}
const secao = s => `<h2>${esc(s.titulo)}</h2>${blocos(s.texto)}`;

function indice(){
  document.title = "Estudos · Palavra e Série";
  marcar(null, true);
  app.innerHTML = `
    <h1>Estudos</h1>
    <p class="sub">Ouviu no canal? Escolha a lista do conteúdo que você ouviu e encontre o estudo.</p>
    <div class="grid">${CATEGORIAS.map(c => {
      const n = doCat(c.id).length;
      return `<a class="card" href="#cat-${c.id}">
        <h3>${esc(c.nome)}</h3>
        <p>${esc(c.desc)}</p>
        <p><b>${n ? n + (n === 1 ? " estudo" : " estudos") : "Em breve"}</b></p>
      </a>`;}).join("")}</div>`;
}

function categoria(c){
  document.title = c.nome + " · Palavra e Série";
  marcar(c.id, false);
  const lista = doCat(c.id);
  app.innerHTML = `
    <p class="sub"><a href="#">Estudos</a></p>
    <h1>${esc(c.nome)}</h1>
    <p class="sub">${esc(c.desc)}</p>
    ${lista.length ? `<div class="lista">${lista.map(e => `
      <a class="card" href="#${esc(e.id)}">
        <small>${esc(e.texto)}</small>
        <h3>${esc(e.titulo)}</h3>
        <p>${esc(e.resumo)}</p>
      </a>`).join("")}</div>` : `<p class="vazio">Nenhum estudo nesta categoria ainda.</p>`}
    <div class="cta">
      <p>Prefere ouvir? Veja esta playlist no canal.</p>
      <a class="btn sec" href="${esc(c.playlist)}" target="_blank" rel="noopener">Ver playlist no YouTube</a>
    </div>`;
  window.scrollTo(0, 0);
}

function estudo(e){
  document.title = e.titulo + " · Palavra e Série";
  const c = catDe(e.categoria);
  marcar(c ? c.id : null, false);
  const secs = e.secoes || [];
  const abertas = secs.filter(s => !s.aprofundamento);
  const fundas = secs.filter(s => s.aprofundamento);
  const outros = c ? doCat(c.id).filter(x => x.id !== e.id) : [];
  app.innerHTML = `
    <p class="sub">${c ? `<a href="#cat-${c.id}">${esc(c.nome)}</a> · ` : ""}${esc(e.texto)}</p>
    <h1>${esc(e.titulo)}</h1>
    <div class="ouvir">
      <p>${(e.mensagem || (c && c.msg) || "Se você acabou de ouvir {c}, este é o estudo. O áudio está no canal.").replace("{c}", "<b>" + esc(e.conteudo || e.texto) + "</b>")}</p>
      <a class="btn gold" href="${e.video ? "https://www.youtube.com/watch?v=" + esc(e.video) : (c ? esc(c.playlist) : CANAL)}" target="_blank" rel="noopener">${esc((c && c.botao) || "Ouvir no canal")}</a>
    </div>
    ${e.video ? `<div class="player"><iframe src="https://www.youtube.com/embed/${esc(e.video)}" title="${esc(e.titulo)}" loading="lazy" allowfullscreen></iframe></div>` : ""}
    ${e.abertura ? blocos(e.abertura) : ""}
    ${abertas.map(secao).join("")}
    ${fundas.length ? `<details class="aprof"><summary>Aprofundamento</summary><div class="inner">${fundas.map(secao).join("")}</div></details>` : ""}
    <div class="cta">
      <p>Quer ir mais fundo em ${esc(e.texto)}? Abra a Matriz de Pesquisa.</p>
      <a class="btn main" href="${MATRIZ}">Aprofundar ${esc(e.texto)}</a>
      <a class="btn sec" href="${e.video ? "https://www.youtube.com/watch?v=" + esc(e.video) : (c ? esc(c.playlist) : CANAL)}" target="_blank" rel="noopener">Voltar ao canal</a>
      <a class="btn sec" href="${CANAL}?sub_confirmation=1" target="_blank" rel="noopener">Inscrever-se</a>
    </div>
    <div class="outros">
      ${outros.length ? `<h2>Mais em ${esc(c.nome)}</h2>` + outros.map(o => `<p><a href="#${esc(o.id)}">${esc(o.titulo)}</a></p>`).join("") : ""}
      <p><a href="#${c ? "cat-" + c.id : ""}">${c ? "Ver todos em " + esc(c.nome) : "Ver todos os estudos"}</a></p>
    </div>`;
  window.scrollTo(0, 0);
}

function rota(){
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return indice();
  if (id.startsWith("cat-")) {
    const c = catDe(id.slice(4));
    if (c) return categoria(c);
  }
  const e = ESTUDOS.find(x => x.id === id);
  if (e) return estudo(e);
  document.title = "Estudo não encontrado · Palavra e Série";
  marcar(null, false);
  app.innerHTML = `<div class="nf"><h1>Estudo não encontrado</h1>
    <p>Esse link não corresponde a nenhum estudo publicado. <a href="#">Veja todos os estudos.</a></p></div>`;
}
window.addEventListener("hashchange", rota);
rota();
</script>
</body>
</html>
