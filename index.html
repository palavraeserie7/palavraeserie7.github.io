
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra em Série</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-background: #0B1628; /* Azul */
            --color-primary: #C9A84C; /* Ouro */
            --color-text: #F8F4EC; /* Creme */
            --font-heading: 'Playfair Display', serif;
            --font-body: 'IBM Plex Sans', sans-serif;
        }

        body {
            background: var(--color-background);
            color: var(--color-text);
            font-family: var(--font-body);
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }

        h1 {
            text-align: center;
            color: var(--color-primary);
            font-family: var(--font-heading);
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        div.buttons-container {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 25px;
            margin: 0 10px;
            border: none;
            border-radius: 8px;
            background: var(--color-primary);
            color: var(--color-background);
            font-family: var(--font-body);
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: #b39543; /* Um tom um pouco mais escuro de ouro */
            transform: translateY(-2px);
        }

        #estante {
            margin: 30px auto;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .livro {
            background: #1c2a3d; /* Um tom mais escuro do azul de fundo */
            padding: 20px;
            border-left: 6px solid var(--color-primary);
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .livro h3 {
            color: var(--color-primary);
            font-family: var(--font-heading);
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.5em;
        }

        .livro p {
            color: var(--color-text);
            font-size: 1em;
            margin-bottom: 0;
        }

        .message-info {
            text-align: center;
            color: var(--color-text);
            font-style: italic;
            padding: 20px;
        }

        .error-message {
            text-align: center;
            color: #ff6b6b; /* Vermelho para erros */
            font-weight: bold;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>PALAVRA EM SÉRIE</h1>

    <div class="buttons-container">
        <button onclick="filtrar('Free')">LIVROS FREE</button>
        <button onclick="filtrar('Pro')">LIVROS PRO</button>
    </div>

    <div id="estante">
        <p class="message-info">Carregando biblioteca...</p>
    </div>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script>
        const supabaseUrl = 'https://qmhdbuxomozdczgvpvcc.supabase.co';
        // CORREÇÃO: Aspa simples adicionada para a chave do Supabase
        const supabaseKey = 'sb_publishable_5jVrL8dyVBg0YOfo_q4ppA_yLMOjTz8';

        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let livrosCache = [];

        async function buscarLivros() {
            try {
                const { data, error } = await supabase
                    .from('livros')
                    .select('*');

                if (error) {
                    console.error('Erro Supabase:', error);
                    document.getElementById('estante').innerHTML = 
                        '<p class="error-message">Erro ao conectar ao banco de dados. Verifique as credenciais ou as políticas de RLS.</p>';
                    return;
                }

                // Se o banco estiver vazio, carrega dados de exemplo para demonstração
                if (!data || data.length === 0) {
                    console.log("Banco de dados 'livros' vazio. Carregando dados de exemplo.");
                    livrosCache = [
                        { titulo: "A Jornada do Herói (Exemplo Free)", descricao: "Uma aventura épica para todos.", categoria: "Free" },
                        { titulo: "Segredos Antigos (Exemplo Pro)", descricao: "Conteúdo exclusivo para assinantes Pro.", categoria: "Pro" },
                        { titulo: "Sabedoria Milenar (Exemplo Free)", descricao: "Textos inspiradores para o dia a dia.", categoria: "Free" }
                    ];
                } else {
                    livrosCache = data;
                }
                filtrar('Free'); // Exibe os livros 'Free' por padrão ao carregar a página
            } catch (err) {
                console.error('Erro inesperado ao buscar livros:', err);
                document.getElementById('estante').innerHTML = 
                    '<p class="error-message">Ocorreu um erro inesperado. Tente novamente mais tarde.</p>';
            }
        }

        function filtrar(plano) {
            const estante = document.getElementById('estante');
            
            if (!livrosCache || livrosCache.length === 0) {
                estante.innerHTML = '<p class="message-info">Nenhum conteúdo disponível no momento.</p>';
                return;
            }

            const filtrados = livrosCache.filter(l => l.categoria === plano);

            if (filtrados.length === 0) {
                estante.innerHTML = `<p class="message-info">Nenhum livro ${plano} encontrado.</p>`;
                return;
            }

            estante.innerHTML = filtrados.map(l => `
                <div class="livro">
                    <h3>${l.titulo}</h3>
                    <p>${l.descricao}</p>
                </div>
            `).join('');
        }

        // Inicia a busca de livros ao carregar a página
        buscarLivros();
    </script>

</body>

</html>
