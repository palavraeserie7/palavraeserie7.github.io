<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Palavra em Série - Manutenção</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/services/supabase.js"></script>

    <style>

        body{
            background:#0B1628;
            color:#F8F4EC;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
        }

        .lock-screen{
            border:1px solid #C9A84C;
            padding:40px;
            border-radius:15px;
            max-width:450px;
            text-align:center;
            background:#111827;
        }

        h1{
            color:#C9A84C;
        }

        .btn-admin{
            background:#C9A84C;
            color:#0B1628;
            border:none;
            padding:12px 20px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
            margin-top:20px;
        }

    </style>

</head>

<body>

    <div id="app">

        <div class="lock-screen">

            <h1>🔒 MODO MANUTENÇÃO</h1>

            <p>Palavra em Série V9</p>

            <p>
                Plataforma temporariamente restrita ao administrador.
            </p>

            <button onclick="entrarAdmin()" class="btn-admin">
                ENTRAR COMO ADMIN
            </button>

        </div>

    </div>

    <script>

        const ADMIN_EMAIL = "palavraeserie@gmail.com";

        async function entrarAdmin() {

            const {
                data: { user }
            } = await window.supabaseClient.auth.getUser();

            if (!user) {

                window.location.href = "pages/login.html";

                return;
            }

            if (user.email.toLowerCase() === ADMIN_EMAIL) {

                window.location.href = "pages/dashboard.html";

                return;
            }

            alert("Acesso negado.");

            await window.supabaseClient.auth.signOut();

            window.location.href = "pages/login.html";
        }

        // Verifica automaticamente
        window.onload = async () => {

            const {
                data: { user }
            } = await window.supabaseClient.auth.getUser();

            if (
                user &&
                user.email.toLowerCase() === ADMIN_EMAIL
            ) {

                document.getElementById("app").innerHTML = `

                    <div class="lock-screen">

                        <h1>✅ ADMIN RECONHECIDO</h1>

                        <p>${user.email}</p>

                        <button
                            onclick="window.location.href='pages/dashboard.html'"
                            class="btn-admin">

                            ACESSAR PAINEL

                        </button>

                    </div>

                `;
            }

        };

    </script>

</body>

</html>
