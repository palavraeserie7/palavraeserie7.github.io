
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistema Palavra em Série</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #0f172a;
      color: #e2e8f0;
    }

    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
    }

    button {
      margin-top: 10px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0ea5e9;
    }

    .card {
      margin-top: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
    }

    .title {
      color: #38bdf8;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .section {
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>Sistema Palavra em Série</h1>
  <p>Estudo Bíblico em 3 Camadas</p>
</header>

<div class="container">

  <input type="text" id="input" placeholder="Digite um tema bíblico (ex: Fé, Amor, Gênesis 1)"/>
  <button onclick="analisar()">Analisar</button>

  <div id="resultado"></div>

</div>

<script>
function analisar() {
  const texto = document.getElementById("input").value;

  if (!texto) return;

  document.getElementById("resultado").innerHTML = `
    <div class="card">

      <div class="title">🔎 Tema: ${texto}</div>

      <div class="section">
        <strong>🟢 Camada 1 — Aplicação</strong>
        <p>O tema "${texto}" pode ser entendido como princípio de conduta, ética e desenvolvimento do caráter humano, influenciando decisões e valores diários.</p>
      </div>

      <div class="section">
        <strong>🟡 Camada 2 — Contexto Histórico</strong>
        <p>Esse conceito deve ser entendido dentro do contexto histórico e cultural do texto bíblico, considerando práticas, linguagem e sociedade da época.</p>
      </div>

      <div class="section">
        <strong>🔵 Camada 3 — Linguagem Original</strong>
        <p>O termo original em hebraico ou grego possui nuances que vão além da tradução simples, revelando significados mais profundos no texto original.</p>
      </div>

    </div>
  `;
}
</script>

</body>
</html>
