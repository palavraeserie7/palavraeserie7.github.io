<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sistema Palavra em Série</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: #38bdf8;
      border: none;
      cursor: pointer;
    }
    .box {
      margin-top: 20px;
      padding: 15px;
      background: #1e293b;
    }
  </style>
</head>

<body>

<h2>Sistema Palavra em Série</h2>
<p>Estudo Bíblico em 3 Camadas</p>

<input id="texto" placeholder="Digite um tema">
<button onclick="analisar()">Analisar</button>

<div id="resultado"></div>

<script>
function analisar() {
  let t = document.getElementById("texto").value;

  document.getElementById("resultado").innerHTML =
  "<div class='box'>" +
  "<h3>Tema: " + t + "</h3>" +
  "<p><b>Camada 1:</b> Aplicação ética do tema.</p>" +
  "<p><b>Camada 2:</b> Contexto histórico e cultural bíblico.</p>" +
  "<p><b>Camada 3:</b> Termos originais e profundidade linguística.</p>" +
  "</div>";
}
</script>

</body>
</html>
