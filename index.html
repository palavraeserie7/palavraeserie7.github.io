<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra & Série - Estudo Exegético</title>
    <style>
        body {
            background-color: #0a192f; /* Azul escuro moderno */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            color: #64ffda; /* Tom de verde água para o título */
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #8892b0;
            margin-bottom: 30px;
        }
        .btn-compra {
            background-color: #25d366; /* Verde chamativo */
            color: #ffffff;
            text-decoration: none;
            padding: 18px 35px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.3rem;
            transition: transform 0.3s, background-color 0.3s;
            display: inline-block;
        }
        .btn-compra:hover {
            background-color: #128c7e;
            transform: scale(1.05);
        }
        .footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #495670;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Palavra & Série</h1>
        <p>Aprofunde seus conhecimentos bíblicos com o nosso<br><strong>Estudo Exegético do Salmo 23</strong>.</p>
        
        <a href="https://pay.kiwify.com.br/o6G6k0p" class="btn-compra">QUERO MEU ESTUDO AGORA</a>
    </div>

    <div class="footer">
        &copy; 2026 Palavra & Série - Todos os direitos reservados.
    </div>

</body>
</html>
