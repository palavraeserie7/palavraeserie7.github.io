<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Palavra em Série</title>

<style>

body{
background:#0f0f0f;
color:white;
font-family:Arial;
padding:20px;
}

h1{
text-align:center;
color:#e2b96f;
}

button{

padding:10px 20px;
margin:10px;
border:none;
border-radius:10px;
background:#1a1a1a;
color:#e2b96f;
cursor:pointer;

}

#estante{
margin-top:30px;
}

.livro{

background:#1c1c1c;
padding:15px;
margin-bottom:15px;
border-left:5px solid #e2b96f;
border-radius:10px;

}

</style>

</head>

<body>

<h1>PALAVRA EM SÉRIE</h1>

<div>

<button onclick="filtrar('Free')">
LIVROS FREE
</button>

<button onclick="filtrar('Pro')">
LIVROS PRO
</button>

</div>

<div id="estante">
Carregando biblioteca...
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl =
'https://qmhdbuxomozdczgvpvcc.supabase.co';

const supabaseKey =
sb_publishable_5jVrL8dyVBg0YOfo_q4ppA_yLMOjTz8';

const supabase =
window.supabase.createClient(
supabaseUrl,
supabaseKey
);

let livrosCache = [];

async function buscarLivros(){

const { data, error } =
await supabase
.from('livros')
.select('*');

if(error){

document.getElementById('estante')
.innerHTML =
'Erro ao conectar banco de dados';

console.log(error);

return;
}

livrosCache = data;

filtrar('Free');

}

function filtrar(plano){

const estante =
document.getElementById('estante');

const filtrados =
livrosCache.filter(
l => l.categoria === plano
);

if(filtrados.length === 0){

estante.innerHTML =
'Nenhum conteúdo encontrado';

return;
}

estante.innerHTML =
filtrados.map(l => `

<div class="livro">

<h3>${l.titulo}</h3>

<p>${l.descricao}</p>

</div>

`).join('');

}

buscarLivros();

</script>

</body>
</html>
