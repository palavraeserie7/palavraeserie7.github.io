<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra em Série - Biblioteca</title>
    <style>
        :root { --ouro: #e2b96f; --fundo: #0f0f0f; }
        body { background: var(--fundo); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        h1 { color: var(--ouro); letter-spacing: 2px; margin-bottom: 30px; }
        .btn-group { margin-bottom: 30px; display: flex; justify-content: center; gap: 10px; }
        button { 
            padding: 12px 25px; cursor: pointer; border: 2px solid var(--ouro); 
            border-radius: 30px; background: transparent; color: var(--ouro); 
            font-weight: bold; transition: 0.3s;
        }
        button:hover, button.active { background: var(--ouro); color: black; }
        #estante { max-width: 600px; margin: 0 auto; text-align: left; }
        .livro-item { 
            background: rgba(255,255,255,0.05); padding: 20px; 
            border-radius: 15px; margin-bottom: 15px; border-left: 5px solid var(--ouro);
        }
        .livro-item h3 { margin-top: 0; color: var(--ouro); }
        .loading { color: var(--ouro); font-style: italic; }
    </style>
</head>
<body>

    <h1>PALAVRA EM SÉRIE</h1>
    
    <div class="btn-group">
        <button id="btn-free" onclick="filtrar('Free')">LIVROS FREE</button>
        <button id="btn-pro" onclick="filtrar('Pro')">LIVROS PRO</button>
    </div>

    <div id="estante" class="loading">Conectando à biblioteca operacional...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        // --- CONFIGURAÇÃO OBRIGATÓRIA ---
        // Pegue estes dados no Supabase: Settings > API
        const supabaseUrl = 'COLE_AQUI_SEU_URL';
        const supabaseKey = 'COLE_AQUI_SUA_KEY';
        // --------------------------------

        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        let livrosCache = [];

        async function buscarLivros() {
            const { data, error } = await supabase
                .from('livros')
                .select('title, content, category');

            if (error) {
                document.getElementById('estante').innerHTML = "Erro de conexão com a infraestrutura.";
                console.error(error);
                return;
            }

            livrosCache = data;
            filtrar('Free'); // Inicia no plano Free por padrão
        }

        function filtrar(plano) {
            const estante = document.getElementById('estante');
            
            // Atualiza visual dos botões
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${plano.toLowerCase()}`).classList.add('active');

            const filtrados = livrosCache.filter(l => l.category === plano);
            
            if (filtrados.length === 0) {
                estante.innerHTML = `<p style="text-align:center">Nenhum conteúdo ${plano} disponível no momento.</p>`;
                return;
            }

            estante.innerHTML = filtrados.map(l => `
                <div class="livro-item">
                    <h3>${l.title}</h3>
                    <p>${l.content}</p>
                </div>
            `).join('');
        }

        buscarLivros();
    </script>
</body>
</html>
