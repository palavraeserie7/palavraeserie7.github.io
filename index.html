
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra & Série — Portal de Investigação</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --bg: #0b0b0b; --text: #eaeaea; --glass: rgba(255,255,255,0.03); }
        body { margin: 0; font-family: 'Inter', sans-serif; background: radial-gradient(circle at center, #1a1a1a, #0b0b0b); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { max-width: 500px; width: 90%; padding: 40px 20px; text-align: center; }
        .brand { color: var(--gold); letter-spacing: 4px; font-size: 11px; text-transform: uppercase; margin-bottom: 10px; }
        .line { width: 40px; height: 1px; background: var(--gold); margin: 0 auto 30px; }
        
        .search-box { 
            background: var(--glass); 
            border: 1px solid rgba(212,175,55,0.3); 
            padding: 18px; 
            border-radius: 50px; 
            width: 100%; 
            color: white; 
            font-size: 16px; 
            outline: none; 
            text-align: center; 
            transition: 0.3s; 
            box-sizing: border-box; 
        }
        .search-box:focus { border-color: var(--gold); background: rgba(255,255,255,0.07); }

        .result-card { 
            margin-top: 30px; 
            padding: 25px; 
            border-radius: 12px; 
            background: var(--glass); 
            border: 1px solid rgba(255,255,255,0.05); 
            min-height: 180px; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            animation: fadeIn 0.5s ease;
        }

        h1 { font-family: 'Playfair Display', serif; font-size: 28px; margin-bottom: 15px; }
        .highlight { color: var(--gold); }
        .verse { font-style: italic; color: #fff; margin-bottom: 15px; font-family: 'Playfair Display', serif; font-size: 18px; }
        .explanation { font-size: 14px; line-height: 1.6; color: #bbb; }
        
        .btn-pro { 
            display: inline-block; 
            background: var(--gold); 
            color: #000; 
            padding: 16px 32px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: 700; 
            font-size: 13px; 
            margin-top: 35px; 
            letter-spacing: 1px; 
            transition: 0.3s; 
            box-shadow: 0 4px 15px rgba(212,175,55,0.2);
        }
        .btn-pro:hover { transform: scale(1.03); filter: brightness(1.1); }
        
        .status-msg { font-size: 10px; color: #555; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="brand">Palavra & Série</div>
    <div class="line"></div>
    
    <input type="text" id="mainSearch" class="search-box" placeholder="Investigue um tema (Ex: Salmos)..." onkeyup="pesquisar(event)">

    <div id="displayArea" class="result-card">
        <h1 id="titulo">Portal em <span class="highlight">Manutenção</span></h1>
        <p id="texto" class="explanation">Estamos processando os temas teológicos. Digite 'Salmos' para iniciar a exegese inicial.</p>
    </div>

    <a href="https://pay.kiwify.com.br/kFIoNlk" class="btn-pro">ACESSAR ESTUDO EXEGÉTICO PRO</a>
    <div class="status-msg">Investigação Teológica Ativa</div>
</div>

<script>
    const estudos = {
        "salmos": { 
            t: "Salmo <span class='highlight'>23</span>", 
            c: `<div class="verse">"O Senhor é o meu pastor; de nada me faltará."</div>
                <div style="color:var(--gold); margin-bottom:10px; font-weight:bold;">יְהוָה רֹעִי (Yahweh Ro'eh)</div>
                <p class="explanation">A exegese do termo <strong>Ro'eh</strong> revela uma relação de dependência absoluta. No original, não indica apenas cuidado, mas provisão contínua e proteção ativa contra predadores.</p>` 
        },
        "graça": { 
            t: "<span class='highlight'>Graça</span>", 
            c: `<div class="verse">"Favor Imerecido"</div>
                <p class="explanation">A base bíblica da graça foca na benevolência divina independente do esforço humano. É o pilar central da Redenção.</p>` 
        }
    };

    function pesquisar(e) {
        const busca = document.getElementById("mainSearch").value.toLowerCase().trim();
        const area = document.getElementById("displayArea");

        if (estudos[busca]) {
            area.innerHTML = `<h1>${estudos[busca].t}</h1>` + estudos[busca].c;
        } else if (busca !== "") {
            area.innerHTML = `<h1><span style='color:#666'>Processando...</span></h1><p class="explanation">Este tema está em fase de manutenção exegética pela nossa equipe. Tente pesquisar 'Salmos'.</p>`;
        }
    }
</script>

</body>
</html>
