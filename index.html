
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenção - Palavra em Série</title>
    
    <link rel="stylesheet" href="/css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="/js/core/orchestrator.js"></script>

    <style>
        body { background-color: #0a0a0a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .lock-screen { border: 1px solid #333; padding: 40px; border-radius: 15px; background: #111; }
        h1 { color: #00ff88; margin-bottom: 10px; }
        p { color: #888; margin-bottom: 20px; }
        button, a { background: #00ff88; color: black; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; text-decoration: none; font-weight: bold; display: inline-block; }
        button:hover, a:hover { background: #00cc6e; }
    </style>
</head>
<body>

    <div id="app">
        <div class="lock-screen">
            <h1>🛠️ Manutenção</h1>
            <p>O sistema está passando por atualizações importantes.</p>
            <button onclick="tentarAcesso()">ENTRAR COMO ADMIN</button>
        </div>
    </div>

    <script>
        const SEU_EMAIL_ADMIN = "palavraeserie@gmail.com";

        // VERIFICA SE O USUÁRIO LOGADO É O ADMIN PARA LIBERAR O BOTÃO
        async function tentarAcesso() {
            try {
                const supabase = window.supabaseClient;

                if (!supabase) {
                    alert("Aguarde um momento, o sistema ainda está carregando...");
                    return;
                }

                const { data: { user } } = await supabase.auth.getUser();

                if (user && user.email === SEU_EMAIL_ADMIN) {
                    window.location.href = "/pages/dashboard.html";
                } else {
                    alert("Acesso restrito para administradores durante a manutenção.");
                    window.location.href = "/pages/login.html";
                }
            } catch (error) {
                console.error("Erro na autenticação:", error);
                alert("Erro ao verificar credenciais.");
            }
        }

        // AUTO-RECONHECIMENTO CASO VOCÊ JÁ ESTEJA LOGADO NO NAVEGADOR
        window.addEventListener('DOMContentLoaded', async () => {
            // Pequena espera para garantir que o supabaseClient foi montado pelo orchestrator/supabase.js
            setTimeout(async () => {
                try {
                    const supabase = window.supabaseClient;
                    if (!supabase) return;

                    const { data: { user } } = await supabase.auth.getUser();

                    if (user && user.email === SEU_EMAIL_ADMIN) {
                        document.getElementById("app").innerHTML = `
                            <div class="lock-screen">
                                <h1>👑 ADMIN RECONHECIDO</h1>
                                <p style="color: #00ff88;">${user.email}</p>
                                <a href="/pages/dashboard.html">ENTRAR NO PAINEL</a>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error("Erro no auto-reconhecimento:", error);
                }
            }, 500);
        });
    </script>
</body>
</html>
