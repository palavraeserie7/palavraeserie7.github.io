<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra em Série - Sentinela V9.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0B1628; color: #F8F4EC; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .lock-screen { border: 1px solid #C9A84C; padding: 40px; border-radius: 15px; max-width: 400px; }
        h1 { color: #C9A84C; }
        .btn-admin { background: #C9A84C; color: #0B1628; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; margin-top: 20px; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <div id="app">
        <div class="lock-screen">
            <h1>🔒 MODO MANUTENÇÃO</h1>
            <p>Plataforma V9.0 Enterprise Global</p>
            <p style="font-size: 0.8em; opacity: 0.7;">O acesso é restrito apenas ao Administrador Canônico.</p>
            <button onclick="tentarAcesso()" class="btn-admin">ENTRAR COMO ADMIN</button>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO SENTINELA
        const SEU_EMAIL_ADMIN = "Palavraeserie@gmail.com"; 
        const supabaseUrl = 'https://qmhdbuxomozdczgvpvcc.supabase.co';
        const supabaseKey = 'sb_publishable_5jVrL8dyVBg0YOfo_q4ppA_yLMOjTz8';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function tentarAcesso() {
            const { data: { user } } = await supabase.auth.getUser();

            if (user && user.email === SEU_EMAIL_ADMIN) {
                // Se for você, libera a entrada para o Dashboard
                window.location.href = "pages/dashboard.html";
            } else {
                // Se não estiver logado ou não for você, manda para o login
                alert("Acesso Negado. Identifique-se como Administrador.");
                window.location.href = "pages/login.html";
            }
        }

        // Verifica automaticamente se você já está logado
        window.onload = async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (user && user.email === SEU_EMAIL_ADMIN) {
                document.getElementById('app').innerHTML = `
                    <div class="lock-screen">
                        <h1>✅ ADMIN RECONHECIDO</h1>
                        <p>Bem-vindo, ${user.email}</p>
                        <a href="pages/dashboard.html" class="btn-admin">ACESSAR PAINEL</a>
                    </div>
                `;
            }
        };
    </script>
</body>
</html>
