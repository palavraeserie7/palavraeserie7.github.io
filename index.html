
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra em Série - Operacional</title>
    <style>
        :root { --ouro: #e2b96f; --fundo: #0f0f0f; }
        body { background: var(--fundo); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        h1 { color: var(--ouro); letter-spacing: 2px; text-transform: uppercase; }
        .btn-group { margin: 30px 0; display: flex; justify-content: center; gap: 15px; }
        button { 
            padding: 12px 25px; cursor: pointer; border: 2px solid var(--ouro); 
            border-radius: 30px; background: transparent; color: var(--ouro); 
            font-weight: bold; transition: 0.3s;
        }
        button:hover, button.active { background: var(--ouro); color: black; }
        #id-estante { max-width: 600px; margin: 0 auto; text-align: left; }
        .livro-item { 
            background: rgba(255,255,255,0.05); padding: 20px; 
            border-radius: 15px; margin-bottom: 15px; border-left: 5px solid var(--ouro);
        }
        .livro-item h3 { margin-top: 0; color: var(--ouro); }
    </style>
</head>
<body>

    <h1>PALAVRA EM SÉRIE</h1>
    
    <div class="btn-group">
        <button id="btn-free" onclick="filtrar('Free')">LIVROS FREE</button>
        <button id="btn-pro" onclick="filtrar('Pro')">LIVROS PRO</button>
    </div>

    <div id="id-estante">Iniciando infraestrutura modular...</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script>
        // CONFIGURAÇÃO TÉCNICA CORRIGIDA
        const supabaseUrl = 'https://qmhdbuxomozdczgvpvcc.supabase.co'; 
        const supabaseKey = 'sb_publishable_5jVrLp2kFpndH6_N7pT6H6B2'; 

        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        let livrosCache = [];

        async function buscarLivros() {
            // CONFIRMAÇÃO DA TABELA: 'livros' conforme solicitado
            const { data, error } = await supabase.from('livros').select('*');

            if (error) {
                document.getElementById('id-estante').innerHTML = "Erro de conexão com a base de dados.";
                console.error("Erro Supabase:", error);
                return;
            }

            livrosCache = data;
            filtrar('Free'); // Inicia exibindo o conteúdo FREE
        }

        function filtrar(plano) {
            const estante = document.getElementById('id-estante');
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            const btnId = plano === 'Free' ? 'btn-free' : 'btn-pro';
            document.getElementById(btnId).classList.add('active');

            const filtrados = livrosCache.filter(l => l.category === plano);
            
            if (filtrados.length === 0) {
                estante.innerHTML = `<p style="text-align:center">Nenhum conteúdo ${plano} disponível.</p>`;
                return;
            }

            estante.innerHTML = filtrados.map(l => `
                <div class="livro-item">
                    <h3>${l.title}</h3>
                    <p>${l.content}</p>
                </div>
            `).join('');
        }

        buscarLivros();
    </script>
</body>
</html>
