<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palavra em Série</title>
    <style>
        body {
            background: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #e2b96f;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            background: #1a1a1a;
            color: #e2b96f;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2a2a2a;
        }

        #estante {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .livro {
            background: #1c1c1c;
            padding: 15px;
            border-left: 5px solid #e2b96f;
            border-radius: 10px;
        }

        .erro {
            color: #ff6b6b;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>PALAVRA EM SÉRIE</h1>

    <div style="text-align: center;">
        <button onclick="filtrar('Free')">LIVROS FREE</button>
        <button onclick="filtrar('Pro')">LIVROS PRO</button>
    </div>

    <div id="estante">
        Carregando biblioteca...
    </div>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

    <script>
        const supabaseUrl = 'https://qmhdbuxomozdczgvpvcc.supabase.co';
        // CORREÇÃO: Adicionada a aspa simples que faltava no início da chave
        const supabaseKey = 'sb_publishable_5jVrL8dyVBg0YOfo_q4ppA_yLMOjTz8';

        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        let livrosCache = [];

        async function buscarLivros() {
            try {
                const { data, error } = await supabase
                    .from('livros')
                    .select('*');

                if (error) throw error;

                livrosCache = data;
                filtrar('Free');
            } catch (error) {
                document.getElementById('estante').innerHTML = 
                    '<p class="erro">Erro ao conectar ao banco de dados. Verifique as credenciais.</p>';
                console.error('Erro Supabase:', error);
            }
        }

        function filtrar(plano) {
            const estante = document.getElementById('estante');
            
            if (!livrosCache || livrosCache.length === 0) {
                estante.innerHTML = 'Nenhum conteúdo carregado.';
                return;
            }

            const filtrados = livrosCache.filter(l => l.categoria === plano);

            if (filtrados.length === 0) {
                estante.innerHTML = `<p style="text-align:center">Nenhum livro ${plano} encontrado.</p>`;
                return;
            }

            estante.innerHTML = filtrados.map(l => `
                <div class="livro">
                    <h3>${l.titulo}</h3>
                    <p>${l.descricao}</p>
                </div>
            `).join('');
        }

        // Inicia a busca ao carregar a página
        buscarLivros();
    </script>

</body>
</html>
