<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquitetura IA Teológica</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0D0F14; --paper: #F5F1E8; --gold: #C9A84C; --blue-deep: #1A2744; --blue-pale: #D6E4F7;
    --mono: 'IBM Plex Mono', monospace; --serif: 'Lora', serif; --display: 'Syne', sans-serif;
  }
  body { background: var(--paper); color: var(--ink); font-family: var(--serif); margin: 0; line-height: 1.6; }
  header { background: var(--blue-deep); color: #fff; padding: 40px 20px; text-align: center; border-bottom: 4px solid var(--gold); }
  .eyebrow { font-family: var(--mono); font-size: 10px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  h1 { font-family: var(--display); font-size: 28px; margin: 0; }
  h1 span { color: var(--gold); }
  
  .container { max-width: 600px; margin: 0 auto; padding: 20px; }
  
  .search-section { background: #fff; padding: 15px; border: 2px solid var(--gold); margin-bottom: 30px; border-radius: 4px; }
  input { width: 100%; padding: 12px; font-family: var(--mono); border: 1px solid #ddd; margin-bottom: 10px; box-sizing: border-box; }
  button.main-btn { width: 100%; background: var(--blue-deep); color: var(--gold); border: none; padding: 15px; font-family: var(--display); font-weight: bold; cursor: pointer; text-transform: uppercase; }

  .tabs { display: flex; gap: 5px; border-bottom: 2px solid var(--blue-pale); margin-bottom: 15px; }
  .tab-btn { padding: 10px; border: none; background: none; font-family: var(--mono); font-size: 10px; cursor: pointer; color: #777; border-bottom: 3px solid transparent; }
  .tab-btn.active { color: var(--blue-deep); border-bottom-color: var(--gold); font-weight: bold; }
  .tab-content { display: none; background: #fff; padding: 20px; border-radius: 4px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); min-height: 100px; }
  .tab-content.active { display: block; }
  
  footer { text-align: center; padding: 40px; font-family: var(--mono); font-size: 9px; opacity: 0.5; }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Sistema Teológico Estruturado</div>
  <h1>Arquitetura <span>IA v2.0</span></h1>
</header>

<div class="container">
  <div class="search-section">
    <input type="text" id="input-tema" placeholder="Ex: Graca no Grego ou Romanos 1:1">
    <button class="main-btn" onclick="executarM00()">Executar Orquestrador</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="openTab(event, 'm03')">M03 - EXEGESE</button>
    <button class="tab-btn" onclick="openTab(event, 'sentinela')">SENTINELA</button>
  </div>

  <div id="m03" class="tab-content active">
    <p id="m03-text">Aguardando comando...</p>
  </div>

  <div id="sentinela" class="tab-content">
    <p id="sentinela-text">Aguardando validação...</p>
  </div>
</div>

<footer>SISTEMA TEOLÓGICO · 2026</footer>

<script>
  function openTab(evt, tabName) {
    let i, tabcontent, tablinks;
    tabcontent = document.getElementsByClassName("tab-content");
    for (i = 0; i < tabcontent.length; i++) tabcontent[i].style.display = "none";
    tablinks = document.getElementsByClassName("tab-btn");
    for (i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
    document.getElementById(tabName).style.display = "block";
    if(evt) evt.currentTarget.classList.add("active");
  }

  function executarM00() {
    const tema = document.getElementById('input-tema').value;
    const m03Text = document.getElementById('m03-text');
    const sentinelaText = document.getElementById('sentinela-text');

    if (!tema) return alert("Digite algo!");

    m03Text.innerHTML = "<em>[M00] Processando módulos...</em>";
    
    // Simula a IA trabalhando
    setTimeout(() => {
      m03Text.innerHTML = `<strong>Análise de "${tema}":</strong><br>O termo no original aponta para uma raiz que indica favor imerecido e disposição benevolente.`;
      sentinelaText.innerHTML = `<strong>Score Teológico:</strong> 9.8/10<br><strong>Status:</strong> Aprovado pelo Sentinela.`;
      alert("Processamento concluído com sucesso!");
    }, 1500);
  }
</script>
</body>
</html>
