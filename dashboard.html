<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Palavra em Série</title>

    <link rel="stylesheet" href="../css/style.css">

    <!-- SUPABASE PRIMEIRO -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/services/supabase.js"></script>
</head>

<body>

    <header style="padding: 20px; display: flex; justify-content: space-between; align-items: center; background: #111;">
        <h3>Palavra em Série</h3>

        <button
            onclick="supabaseClient.auth.signOut().then(() => window.location.href='/pages/login.html')"
            class="filter-btn free-btn"
            style="padding: 5px 15px;"
        >
            Sair
        </button>
    </header>

    <div class="container">

        <div style="margin: 30px 0; padding: 20px; background: #1a1a1a; border-radius: 12px; border-left: 5px solid #00ff88;">
            <h2 id="welcome-msg">Bem-vindo!</h2>
            <p id="user-plan">Seu plano atual: Carregando...</p>
        </div>

        <section id="books-container" class="books-grid"></section>

    </div>

    <!-- SCRIPTS (ORDEM CRÍTICA) -->
    <script src="../permissions.js"></script>
    <script src="../js/core/orchestrator.js"></script>

</body>
</html>
